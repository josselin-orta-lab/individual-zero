name: M11 independent custody audit and operator terminal forgery gate

on:
  pull_request:
    branches:
      - exp/m11-opt2-fast-canonical-audit-20261013
    paths:
      - 'src/lab/sqlite_life_store.py'
      - 'tests/test_m11_ledger_operator_terminal_semantics.py'
      - '.github/workflows/m11-custody-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m11-adversarial-audit:
    name: Verified M11 terminal semantics and full SQLite nonregression (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Reject forged operator stop with valid chain
        run: python -m unittest discover -s tests -p 'test_m11_ledger_operator_terminal_semantics.py' -v
      - name: Keep existing M11 storage fail-closed gates
        run: |
          python -m unittest discover -s tests -p 'test_sqlite_life_store.py' -v
          python -m unittest discover -s tests -p 'test_sqlite_corrupt_storage.py' -v
          python -m unittest discover -s tests -p 'test_m11_verified_anchor_optimization.py' -v
          python -m unittest discover -s tests -p 'test_m11_stage12_hard_crash.py' -v
