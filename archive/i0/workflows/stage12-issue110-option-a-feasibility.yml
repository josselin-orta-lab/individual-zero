name: Issue110 Option A autonomous obstacle feasibility
on:
  pull_request:
    branches:
      - science/stage12-issue110-sleep-window-20261014
    paths:
      - '.github/workflows/stage12-issue110-option-a-feasibility.yml'
      - 'scripts/run_stage12_issue110_spatial_feasibility.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue110-option-a-feasibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  autonomous-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact immutable SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Validate spatial perception and cognitive baseline
        run: |
          python -m unittest discover -s tests -p 'test_stage12_spatial_cue_policy.py' -v
          python -m unittest discover -s tests -p 'test_stage12_spatial_cue_worldbody.py' -v
          python -m unittest discover -s tests -p 'test_stage12_spatial_cue_audit.py' -v
          python -m unittest discover -s tests -p 'test_stage12_goal_agency_runtime.py' -v
      - name: Run autonomous obstacle contexts with externally audited decision coverage
        run: |
          mkdir -p /tmp/issue110-option-a
          python scripts/run_stage12_issue110_spatial_feasibility.py \
            --output-dir /tmp/issue110-option-a/experiment
      - name: Report all measured outcomes, never scientific GO
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/issue110-option-a/experiment/summary.json')
          print('issue110_spatial_feasibility_summary=' + (p.read_text() if p.is_file() else 'unavailable'))
          PY
      - name: Retain raw WAL canonical receipts negative lives and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue110-option-a-autonomous-py${{ matrix.python-version }}
          path: /tmp/issue110-option-a/
          retention-days: 30
          if-no-files-found: warn
