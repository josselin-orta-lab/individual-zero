name: Stage6 A2.30-I behavioral parity
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/i0/modules/stage6_planning.py'
      - 'scripts/run_stage12_issue110_b_a230i_parity.py'
      - 'docs/research/stage12-issue110-b-a230i-*.md'
      - '.github/workflows/stage6-a230i-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Download before-change canonical A2.30-E archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/a230i-before
          gh run download 38715999434 --repo "$GITHUB_REPOSITORY" --name a230e-py3.11 --dir /tmp/a230i-before
      - name: Replay unchanged B decisions against original physical receipts
        run: |
          python -u scripts/run_stage12_issue110_b_a230i_parity.py \
            --source-dir /tmp/a230i-before \
            --output-dir /tmp/a230i-after > /tmp/a230i.log 2>&1 \
            || { tail -n 160 /tmp/a230i.log; exit 2; }
          grep A230I_PARITY_SUMMARY /tmp/a230i.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a230i-parity-py${{ matrix.python-version }}
          path: |
            /tmp/a230i-after
            /tmp/a230i.log
          retention-days: 30
