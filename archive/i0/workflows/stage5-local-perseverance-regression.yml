name: Stage5 real first-person perseverance regression
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
    branches: [main]
    paths:
      - 'src/lab/stage5_reference_fixture.py'
      - 'tests/test_stage5_trait_battery.py'
      - 'docs/research/stage5-firstperson-perseverance-fix-2026-10-15.fr.md'
      - '.github/workflows/stage5-local-perseverance-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firstperson-observable-stage5:
    name: observable Stage5 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - name: Stage5 trait battery positive, negative, and invariant copy cases
        run: python -m unittest discover -s tests -p 'test_stage5*.py' -v
      - name: Parent PR205 Stage4 local perception, agency and rollback protections
        run: python -m unittest discover -s tests -p 'test_stage4_runtime.py' -v
      - name: Stage9 DC-05 physical first-person confound regression
        run: python -m unittest discover -s tests -p 'test_stage9_concurrent_cause_audit.py' -v
      - name: Stage3 physical/perceptual boundary
        run: python -m unittest discover -s tests -p 'test_stage3*.py' -v
      # Keep the full 1600+ test historical replay available by explicit opt-in.
      # Normal PR checks already execute focused Stage3/4/5/9 regressions plus CI.
      - name: Retrieve immutable A2.30-O source evidence required by the common unit suite
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.action == 'labeled' &&
           github.event.label.name == 'stage5-full')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/a230o-py311 /tmp/a230o-py312
          gh run download 38726664498 --repo "$GITHUB_REPOSITORY" --name a230n-py3.11 --dir /tmp/a230o-py311
          gh run download 38726664498 --repo "$GITHUB_REPOSITORY" --name a230n-py3.12 --dir /tmp/a230o-py312
      - name: Full software unit-suite compatibility (explicit stage5-full opt-in)
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.action == 'labeled' &&
           github.event.label.name == 'stage5-full')
        env:
          A230O_SOURCE_A: /tmp/a230o-py311
          A230O_SOURCE_B: /tmp/a230o-py312
        run: python -m unittest discover -s tests -q
