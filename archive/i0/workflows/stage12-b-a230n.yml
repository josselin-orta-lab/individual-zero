name: Stage12 A2.30-N offline uncertain predictor evaluation
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit_stage12_issue110_b_a230n_uncertain_predictor.py'
      - 'scripts/run_stage12_issue110_b_a230n_predictor_evaluation.py'
      - 'tests/test_stage12_a230n_uncertain_predictor.py'
      - 'docs/research/stage12-issue110-b-a230n-*.md'
      - '.github/workflows/stage12-b-a230n.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Validate safety abstention and independent physical heldout controls
        run: |
          python -m unittest discover -s tests -p test_stage12_a230n_uncertain_predictor.py -v
      - name: Execute one preregistered laboratory train/test suite
        run: |
          python -u scripts/run_stage12_issue110_b_a230n_predictor_evaluation.py \
            --output-dir /tmp/a230n-eval > /tmp/a230n.log 2>&1 \
            || { tail -n 150 /tmp/a230n.log; exit 2; }
          grep A230N_SUMMARY /tmp/a230n.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a230n-py${{ matrix.python-version }}
          path: |
            /tmp/a230n-eval
            /tmp/a230n.log
          retention-days: 30
