name: Issue110 A2 external obstacle physical contract
on:
  pull_request:
    branches:
      - science/stage12-issue110-sleep-window-20261014
    paths:
      - 'src/lab/world.py'
      - 'src/lab/stage12_a2_causal_audit.py'
      - 'tests/test_stage12_a2_causal_audit.py'
      - 'src/lab/injected_scenario.py'
      - 'src/lab/stage2_runtime.py'
      - 'src/i0/modules/stage12_goal_agency.py'
      - 'src/lab/stage12_first_person_agency_audit.py'
      - 'tests/test_stage12_a2_after_admission.py'
      - 'tests/test_stage12_a2_external_obstacle.py'
      - '.github/workflows/stage12-issue110-a2-physical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a2-world-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pin exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Execute A2 external geometry and atomicity tests
        run: |
          python -m unittest discover -s tests -p 'test_stage12_a2_causal_audit.py' -v
          python -m unittest discover -s tests -p 'test_stage12_a2_external_obstacle.py' -v
          python -m unittest discover -s tests -p 'test_stage12_a2_after_admission.py' -v
          python -m unittest discover -s tests -p 'test_stage12_spatial_cognitive_agency.py' -v
          python -m unittest discover -s tests -p 'test_stage12_spatial_integrated_rehash.py' -v
          python -m unittest discover -s tests -p 'test_stage12_spatial_cue_worldbody.py' -v
          python -m unittest discover -s tests -p 'test_stage12_spatial_world_reachability.py' -v
