name: Stage12 issue110 A2.25 autonomous lived outcome contrasts
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_stage12_issue110_a225.py'
      - 'docs/research/stage12-issue110-a225-*.md'
      - '.github/workflows/stage12-issue110-a225.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a225-autonomous-physical:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Run autonomous lives with independently audited goal and physical outcomes
        run: |
          python scripts/run_stage12_issue110_a225.py \
            --output-dir /tmp/a225 > /tmp/a225.log 2>&1 \
            || { tail -n 120 /tmp/a225.log; exit 2; }
          grep 'A225_SUMMARY' /tmp/a225.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage12-a225-py${{ matrix.python-version }}
          path: |
            /tmp/a225
            /tmp/a225.log
          retention-days: 30
          if-no-files-found: warn
