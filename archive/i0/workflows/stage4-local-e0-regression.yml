name: Stage4 local first-person planning regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/test_stage4_runtime.py'
      - '.github/workflows/stage4-local-e0-regression.yml'
  push:
    branches: [main]
    paths:
      - 'tests/test_stage4_runtime.py'
      - '.github/workflows/stage4-local-e0-regression.yml'
permissions:
  contents: read
jobs:
  local-e0:
    name: local-E0 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Stage4 positive, negative, rollback and agency contracts
        run: python -m unittest discover -s tests -p 'test_stage4_runtime.py' -v
      - name: Stage3 physical and local-perception regressions
        run: python -m unittest discover -s tests -p 'test_stage3*.py' -v
