name: Issue110 A2 prospective autonomous campaign
on:
  pull_request:
    branches:
      - science/stage12-issue110-sleep-window-20261014
    paths:
      - 'scripts/run_stage12_issue110_a2.py'
      - 'scripts/run_stage12_issue110_first_planning_state.py'
      - 'src/lab/injected_scenario.py'
      - 'src/lab/stage2_runtime.py'
      - 'src/i0/modules/stage12_goal_agency.py'
      - 'src/lab/stage12_first_person_agency_audit.py'
      - '.github/workflows/stage12-issue110-a2-autonomous.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-physical-lives:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Run preregistered A2 lives and independent audits
        env:
          COHORT: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/run_stage12_issue110_a2.py \
            --output-dir /tmp/stage12-a2 \
            --cohort-id "$COHORT"
      - name: Preserve negatives, canonical journals and WAL files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage12-a2-py${{ matrix.python-version }}
          path: /tmp/stage12-a2/
          if-no-files-found: warn
          retention-days: 30
