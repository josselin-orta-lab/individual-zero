name: Stage12 issue110 A2.27 dual-scope evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_stage12_issue110_a227.py'
      - 'docs/research/stage12-issue110-a227-*.md'
      - '.github/workflows/stage12-issue110-a227.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dual-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Audit live proximal/distal separation and negative controls
        run: |
          python scripts/run_stage12_issue110_a227.py \
            --output-dir /tmp/a227 > /tmp/a227.log 2>&1 \
            || { tail -n 100 /tmp/a227.log; exit 2; }
          grep 'A227_SUMMARY' /tmp/a227.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a227-py${{ matrix.python-version }}
          path: |
            /tmp/a227
            /tmp/a227.log
          retention-days: 30
