name: Stage12 A2.6 genuine diagnostic tampering regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/test_stage12_a26_long_horizon.py'
      - 'tests/test_stage12_attribution_sleep_expiry.py'
      - '.github/workflows/stage12-a26-smoke-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a26-and-sleep-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Genuine short-life paired diagnostic and independent sleep gap forgery
        run: |
          python -m unittest discover -s tests -p 'test_stage12_a26_long_horizon.py' -v
          python -m unittest discover -s tests -p 'test_stage12_attribution_sleep_expiry.py' -v
