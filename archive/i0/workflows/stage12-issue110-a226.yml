name: Stage12 issue110 A2.26 temporal confounding replication
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_stage12_issue110_a226.py'
      - 'docs/research/stage12-issue110-a226-*.md'
      - '.github/workflows/stage12-issue110-a226.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a226-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Autonomous outcomes with independent exogenous timing audit
        run: |
          python scripts/run_stage12_issue110_a226.py \
            --output-dir /tmp/a226 > /tmp/a226.log 2>&1 \
            || { tail -n 100 /tmp/a226.log; exit 2; }
          grep 'A226_SUMMARY' /tmp/a226.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage12-a226-py${{ matrix.python-version }}
          path: |
            /tmp/a226
            /tmp/a226.log
          retention-days: 30
          if-no-files-found: warn
