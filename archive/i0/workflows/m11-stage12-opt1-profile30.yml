name: Issue133 M11 verified-anchor OPT1 H30
# The preregistered comparison is triggered once; future runs only by operator.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opt1-profile30:
    name: Verified-anchor 30-step profile (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Profile original unchanged 30-step scientific scenario with optimized M11
        run: python scripts/profile_m11_stage12_30.py --output-dir /tmp/issue133-m11-opt1-profile30
      - name: Preserve profile, current DB and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue133-m11-opt1-profile30-python-${{ matrix.python-version }}
          path: /tmp/issue133-m11-opt1-profile30/
          retention-days: 30
          if-no-files-found: warn
