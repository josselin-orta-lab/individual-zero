name: Stage12 A2.30-O independent archived scorer
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit_stage12_issue110_b_a230o_independent_scoring.py'
      - 'tests/test_stage12_a230o_independent_archive_scoring.py'
      - 'docs/research/stage12-issue110-b-a230o-*.md'
      - '.github/workflows/stage12-b-a230o.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  offline-scorer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Download both independent-language N source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/a230o-py311 /tmp/a230o-py312
          gh run download 38726664498 --repo "$GITHUB_REPOSITORY" --name a230n-py3.11 --dir /tmp/a230o-py311
          gh run download 38726664498 --repo "$GITHUB_REPOSITORY" --name a230n-py3.12 --dir /tmp/a230o-py312
      - name: Adversarial negative controls and fully independent physical-record scoring
        env:
          A230O_SOURCE_A: /tmp/a230o-py311
          A230O_SOURCE_B: /tmp/a230o-py312
        run: python -m unittest discover -s tests -p test_stage12_a230o_independent_archive_scoring.py -v
      - name: Verify and independently recompute source corpus, forecasts, uncertainty and safety
        run: |
          python -u scripts/audit_stage12_issue110_b_a230o_independent_scoring.py \
            --source-a /tmp/a230o-py311 \
            --source-b /tmp/a230o-py312 \
            --output-dir /tmp/a230o-output > /tmp/a230o.log 2>&1 \
            || { tail -n 180 /tmp/a230o.log; exit 2; }
          grep A230O_SUMMARY /tmp/a230o.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a230o-py${{ matrix.python-version }}
          path: |
            /tmp/a230o-output
            /tmp/a230o.log
          retention-days: 30
