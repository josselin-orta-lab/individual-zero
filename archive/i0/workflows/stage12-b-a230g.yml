name: Stage12 A2.30-G offline graph witness
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit_stage12_issue110_b_a230g_graph_witness.py'
      - 'tests/test_stage12_a230g_graph_witness.py'
      - 'docs/research/stage12-issue110-b-a230g-*.md'
      - '.github/workflows/stage12-b-a230g.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  graph-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Adversarial model-graph witness tests
        run: python -m unittest discover -s tests -p test_stage12_a230g_graph_witness.py -v
      - name: Download immutable source archive from original A2.30-E run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/a230g-original
          gh run download 38715999434 --repo "$GITHUB_REPOSITORY" --name a230e-py3.11 --dir /tmp/a230g-original
          find /tmp/a230g-original -name a230e-summary.json -print
      - name: Independently verify old journals and exhausted Stage6 search graph
        run: |
          python -u scripts/audit_stage12_issue110_b_a230g_graph_witness.py \
            --source-dir /tmp/a230g-original \
            --output-dir /tmp/a230g-output > /tmp/a230g.log 2>&1 \
            || { tail -n 150 /tmp/a230g.log; exit 2; }
          grep A230G_SUMMARY /tmp/a230g.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a230g-py${{ matrix.python-version }}
          path: |
            /tmp/a230g-output
            /tmp/a230g.log
          retention-days: 30
