name: M11 Stage12 paid-index 120-step intermediate horizon

# Costly, pre-registered H120 must not re-run for unrelated PR commits.
# PR 'paths' evaluates cumulative changes and would trigger repeatedly.
# H120 OPT1 already launched once on frozen commit 082e7008;
# use manual dispatch for any explicitly justified rerun.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-h120:
    name: Actual 120-step paid-index SQLite life (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Run preregistered fully physical SQLite-owned Stage12 life
        run: python scripts/run_m11_stage12_atomic_h120.py --output-dir /tmp/m11-stage12-h120
      - name: Preserve complete current SQLite generation, journal and failed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m11-stage12-h120-python-${{ matrix.python-version }}
          path: /tmp/m11-stage12-h120/
          if-no-files-found: warn
          retention-days: 30
