name: Issue110 agency independence branch smoke
on:
  push:
    branches:
      - implementation/stage12-subjective-agency-20261013
    paths:
      - 'tests/test_stage12_goal_agency_independence.py'
      - '.github/workflows/stage12-issue110-ga-independence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Goal agency no-circularity and existing owner regression
        run: |
          python -m unittest discover -s tests -p 'test_stage12_goal_agency_independence.py' -v
          python -m unittest discover -s tests -p 'test_stage12_goal_agency.py' -v
          python -m unittest discover -s tests -p 'test_stage12_attribution_pairs.py' -v
