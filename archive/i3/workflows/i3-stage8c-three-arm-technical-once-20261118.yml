# Stage8-C three-arm FULL engineering only. No science job, no reused cohort.
name: I3 Stage8-C three-arm native technical rehearsals (NO SCIENCE)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/i3-stage8c-three-arm-technical-once-20261118.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: i3-stage8c-native-technical-first-only-20261118
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.run_attempt == 1 && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify one-shot ADD and frozen method, no native life
        run: |
          python -m unittest discover -s tests/i3 -p 'test_stage8c_three_arm_transport.py' -v
          python -m unittest discover -s tests/i3 -p 'test_stage8c_parent_multiplicity_control.py' -v
          python - <<'PY'
          import os,subprocess
          from i3.runtime.provenance import source_snapshot
          from i3.lab import stage8c_three_arm_transport as C
          head=os.environ["GITHUB_SHA"]
          snapshot=source_snapshot()
          assert snapshot["git_head"]==head and snapshot["working_tree_dirty"] is False
          assert not subprocess.check_output(["git","status","--porcelain","--untracked-files=all"]).strip()
          path=".github/workflows/i3-stage8c-three-arm-technical-once-20261118.yml"
          assert subprocess.check_output(["git","log","--format=%H","--",path],text=True).splitlines()==[head]
          assert subprocess.check_output(["git","diff-tree","--no-commit-id","--name-status","-r",head,"--",path],text=True).strip().split()==["A",path]
          assert C.POPULATIONS==32 and C.TOTAL_LIVES==32256 and C.MUTATIONS==4608
          assert C.HOLDOUT_WORLDS==192 and C.METHOD["alpha_one_sided"]==.025
          assert C.METHOD["t_critical"]==2.0395134463964077
          assert C.METHOD["planning_minimum_relevant_effect_steps"]==10
          print("STAGE8C_TECH_ONLY_FIRST_EXPOSURE_PREFLIGHT_PASS")
          PY

  engineering:
    if: ${{ github.run_attempt == 1 }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: src
      PYVERSION: ${{ matrix.python-version }}
      CUSTODY: /tmp/i3-stage8c-technical-${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Allocate independent source-locked root with 192 G2 holdouts
        run: |
          mkdir -p "$CUSTODY"
          SOURCE=$(python -c 'from i3.runtime.provenance import source_snapshot; print(source_snapshot()["sha256"])')
          python -m i3.lab.stage8c_three_arm_transport allocate-engineering "$GITHUB_SHA" "$SOURCE" "$CUSTODY/PLAN.json" "$CUSTODY/originals"
          python -m i3.lab.stage8c_three_arm_transport verify "$CUSTODY/PLAN.json"
      - name: PUBLISH plan, source, Worlds and mutations BEFORE first G0 life
        uses: actions/upload-artifact@v4
        with:
          name: stage8c-technical-preexposure-${{ matrix.python-version }}-${{ github.run_id }}
          path: /tmp/i3-stage8c-technical-${{ matrix.python-version }}/PLAN.json
          if-no-files-found: error
          retention-days: 90
      - name: Run ONE full 32256-life S/M/U G0-G1-G2 native rehearsal
        run: |
          PLAN_SHA=$(python -c 'import os,json; print(json.load(open(os.environ["CUSTODY"]+"/PLAN.json"))["allocation_sha256"])')
          python -m i3.lab.stage8c_three_arm_transport run-engineering "$CUSTODY/PLAN.json" "$CUSTODY/originals" "$PLAN_SHA" > "$CUSTODY/CORE.json"
      - name: Rehash all 32256 gzip originals, all 4608 mutations and 18 seals
        run: |
          python -m i3.lab.stage8c_three_arm_transport rehearsal-receipt "$CUSTODY/PLAN.json" "$CUSTODY/originals" "$CUSTODY/CORE.json" "$CUSTODY/TECH_RECEIPT.json" "$PYVERSION" "$GITHUB_RUN_ID"
      - name: Publish full technical receipt without biological contrasts
        uses: actions/upload-artifact@v4
        with:
          name: stage8c-technical-receipt-${{ matrix.python-version }}-${{ github.run_id }}
          path: /tmp/i3-stage8c-technical-${{ matrix.python-version }}/TECH_RECEIPT.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve ALL technical original lives, deaths and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage8c-technical-originals-${{ matrix.python-version }}-${{ github.run_id }}
          path: /tmp/i3-stage8c-technical-${{ matrix.python-version }}/originals
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90

  technical_gate_only:
    if: ${{ github.run_attempt == 1 }}
    needs: engineering
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      CUSTODY: /tmp/i3-stage8c-technical-gate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Import complete source exact Python 3.11 technical receipt
        uses: actions/download-artifact@v4
        with:
          name: stage8c-technical-receipt-3.11-${{ github.run_id }}
          path: /tmp/i3-stage8c-technical-gate/311
      - name: Import complete source exact Python 3.12 technical receipt
        uses: actions/download-artifact@v4
        with:
          name: stage8c-technical-receipt-3.12-${{ github.run_id }}
          path: /tmp/i3-stage8c-technical-gate/312
      - name: Gate both 32256-life repetitions independently, no science
        run: |
          python -m i3.lab.stage8c_three_arm_transport combine-rehearsals "$CUSTODY/311/TECH_RECEIPT.json" "$CUSTODY/312/TECH_RECEIPT.json" "$CUSTODY/REHEARSALS_COMPLETE.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path(os.environ["CUSTODY"])/"REHEARSALS_COMPLETE.json").read_bytes())
          assert r["status"]=="STAGE8C_TWO_TECHNICAL_REPETITIONS_COMPLETE_NO_SCIENCE"
          assert r["source_git_head"]==os.environ["GITHUB_SHA"]
          assert r["workflow_run_id"]==int(os.environ["GITHUB_RUN_ID"])
          assert r["native_original_lives_rehashed"]==64512
          assert r["scientific_admission"] is False and r["science_lives_generated"]==0
          print("TWO_STAGE8C_SOURCE_EXACT_TECHNICAL_REPETITIONS_SEALED_NO_SCIENCE")
          PY
      - name: Preserve both technical receipts, NEVER a scientific admission
        uses: actions/upload-artifact@v4
        with:
          name: stage8c-both-technical-receipts-NO-SCIENCE-${{ github.run_id }}
          path: /tmp/i3-stage8c-technical-gate/REHEARSALS_COMPLETE.json
          if-no-files-found: error
          retention-days: 90
