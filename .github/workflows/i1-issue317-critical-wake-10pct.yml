name: I1 issue317 paired 10pct biological wake protection
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'tools/run_i1_317_critical_wake_guard.py'
      - 'tests/i1/test_i1_317_critical_wake_guard.py'
      - '.github/workflows/i1-issue317-critical-wake-10pct.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        preset: [oasis, foraging, memory-corridor]
        seed: [9601, 9631]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual I1
        run: python -m pip install -e .
      - name: Test critical observation guards
        run: python -m unittest discover -s tests/i1 -p test_i1_317_critical_wake_guard.py -v
      - name: Birth distinct mortal canonical and guarded lives
        env:
          PRESET: ${{ matrix.preset }}
          SEED: ${{ matrix.seed }}
        run: |
          python tools/run_i1_317_critical_wake_guard.py --preset "$PRESET" --seed "$SEED" --output-dir "pairs/$PRESET/$SEED"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path('pairs')/os.environ['PRESET']/os.environ['SEED']/'report.json').read_text())
          assert d['status']=='PAIRED_MORTAL_DIAGNOSTIC_COMPLETE'
          assert d['ordinary_wake_rules_unchanged'] is True
          assert d['no_motor_orders_or_sleep_ban'] is True
          assert d['scientific_verdict']=='NO-GO'
          print('PAIR_TECHNICALLY_CERTIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-317-critical-wake-${{ matrix.preset }}-${{ matrix.seed }}
          path: pairs/
          retention-days: 30
          if-no-files-found: warn
