name: I3 P5d one-shot development verification

on:
  pull_request:
    paths:
      - '.github/workflows/i3-p5d-one-shot.yml'
      - 'src/i3/runtime/**'
      - 'src/i3/lab/p5d_development.py'
      - 'tests/i3/test_p5d_resource_observer.py'

permissions:
  contents: read

concurrency:
  group: i3-p5d-one-shot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  p5d-tests:
    name: I3 P5d focused and isolation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact source identity
        run: |
          git rev-parse HEAD
          git status --porcelain
      - name: Complete I3 focused software checks
        run: PYTHONPATH=src python -m unittest discover -s tests/i3 -p 'test_*.py'
      - name: Generation ownership and isolation
        run: |
          python scripts/check_engine_repository.py --json
          python scripts/check_engine_contracts.py --json

  p5d-development:
    name: I3 P5d 24 development-only lives (Python 3.11)
    runs-on: ubuntu-latest
    needs: [p5d-tests]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Print source and allocation before opening any life
        run: |
          git rev-parse HEAD
          PYTHONPATH=src python -m i3.lab.p5d_development --manifest
      - name: Execute ONLY the declared 24 development lives
        run: |
          PYTHONPATH=src python -m i3.lab.p5d_development --run-development > p5d-development.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          raw = Path("p5d-development.json").read_bytes()
          obj = json.loads(raw)
          assert obj["validation"] == "NOT_OPENED"
          assert obj["reserve"] == "LOCKED"
          assert len(obj["receipts"]) == 24
          assert len(obj["paired_chronology"]) == 12
          assert {r["development_index"] for r in obj["receipts"]} == set(range(32, 38))
          print("P5D_DEVELOPMENT_RAW_SHA256:", hashlib.sha256(raw).hexdigest())
          print("P5D_DEVELOPMENT_SUMMARY:", json.dumps(obj["summary"], sort_keys=True))
          print("P5D_PAIRED_CHRONOLOGY:", json.dumps(obj["paired_chronology"], sort_keys=True))
          print("P5D_WORLD_FINGERPRINTS:", json.dumps(sorted({(r["development_index"], r["world_sha256"]) for r in obj["receipts"]})))
          PY
      - name: Preserve full original development-only observer receipts
        uses: actions/upload-artifact@v4
        with:
          name: i3-p5d-development-original
          path: p5d-development.json
          if-no-files-found: error
          retention-days: 90
