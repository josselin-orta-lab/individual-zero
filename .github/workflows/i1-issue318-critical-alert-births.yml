name: I1 issue318 prospective critical-alert mortal cohort
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'tools/run_i1_318_critical_alert_sleep_cohort.py'
      - 'tests/i1/test_i1_318_critical_alert_cohort.py'
      - '.github/workflows/i1-issue318-critical-alert-births.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-mortal-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        preset: [memory-corridor, water-isolated-corridor]
        seed: [19121, 19237, 19373, 19489]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests/i1 -p test_i1_318_critical_alert_cohort.py -v
      - name: Start two independent irrevocable mortal lives
        env:
          PRESET: ${{ matrix.preset }}
          SEED: ${{ matrix.seed }}
        run: |
          python tools/run_i1_318_critical_alert_sleep_cohort.py --preset "$PRESET" --seed "$SEED" --output-dir "results/$PRESET/$SEED"
          python - <<'PY'
          from pathlib import Path
          import os,json
          r=json.loads((Path('results')/os.environ['PRESET']/os.environ['SEED']/'report.json').read_text())
          assert r['schema']=='i1-318-critical-alert-sleep-mortal/v1'
          assert r['status']=='COMPLETE_PAIRED_PHYSICAL_DIAGNOSTIC'
          assert r['preregistered_arms']==['baseline','critical_alert_gate']
          assert r['only_critical_alert_sleep_registration_gate_changed'] is True
          assert r['scientific_verdict']=='NO-GO'
          print('TWO_NEW_CRITICAL_ALERT_MORTAL_LIVES_COMPLETE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-318-alert-gate-${{ matrix.preset }}-${{ matrix.seed }}
          path: results/
          retention-days: 30
          if-no-files-found: warn
