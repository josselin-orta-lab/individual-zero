name: I1 visible-resource movement investigation
on:
  push:
    branches: [science/i1-need-movement-investigation-20261018]
    paths:
      - 'tools/run_i1_need_movement_investigation.py'
      - 'tools/analyze_i1_need_movement.py'
      - '.github/workflows/i1-need-movement-investigation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        world: [longlife-garden, oasis, foraging]
        novelty: ['0.15', '0.3', '0.6', '0.9']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify core contracts and scenario
        run: |
          python -m pip install -e .
          python scripts/check_engine_repository.py --json
          python tools/run_i1_need_movement_investigation.py --preset "${{ matrix.world }}" --validate-only
      - name: Born mortal I1 with one preregistered novelty intervention
        shell: bash
        env:
          WORLD: ${{ matrix.world }}
          NOVELTY: ${{ matrix.novelty }}
        run: |
          set -euo pipefail
          for variant in 1 2; do
            folder="reports/${WORLD}/novelty-${NOVELTY}/variant-${variant}"
            python tools/run_i1_need_movement_investigation.py \
              --preset "$WORLD" --seed "$((773000 + variant))" \
              --world-variant "$variant" --steps 300 --lives 1 \
              --custody wal --experimental-fatigue-weight 0.0 \
              --geographic-novelty-weight "$NOVELTY" \
              --output-dir "$folder"
            python tools/analyze_i1_need_movement.py \
              --input "$folder" --output "$folder/investigation.json"
          done
      - name: Preserve full physical evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1-movement-${{ matrix.world }}-${{ matrix.novelty }}-${{ github.run_id }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
