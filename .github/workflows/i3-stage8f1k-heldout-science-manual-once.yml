# F1K scientific population: manual-only, no PR, push, schedule or rerun.
name: I3 Stage8-F1K manual one-shot source-reserved T60

on:
  workflow_dispatch:
    inputs:
      approved_source_sha:
        description: Exact reviewed SHA on main (after separate DEV_R T60 rehearsal)
        type: string
        required: true
      consume_ack:
        description: Type CONSUME_F1K_16_ROOTS_NO_SCIENTIFIC_RETRY
        type: string
        required: true

concurrency:
  group: i3-stage8f1k-t60-consumed-once
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  F1K_TAG: i3-stage8f1k-t60-heldout-once

jobs:
  source_reservation_and_native_original:
    if: ${{ github.run_attempt == 1 && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
      actions: read
    env:
      PYTHONPATH: 'src:.'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      F1K_APPROVED_SOURCE_SHA: ${{ inputs.approved_source_sha }}
      F1K_CONSUME_ACK: ${{ inputs.consume_ack }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify sources and context before any K World.step
        run: |
          set -euo pipefail
          python -c 'from tools import stage8f1k_one_shot_reservation as R; from tools import stage8f1k_policy_cost_value_prospective as P; R.context(); R.source_blobs(); assert len(P.release_grid()["origins"])==16; print("F1K_NO_EXPOSURE_PREFLIGHT_PASS")'
      - name: Create atomic GitHub consumed-once reference
        id: claim
        run: |
          set -euo pipefail
          python -m tools.stage8f1k_one_shot_reservation --reserve "$RUNNER_TEMP/F1K_RESERVATION.json"
          python -m tools.stage8f1k_one_shot_reservation --verify "$RUNNER_TEMP/F1K_RESERVATION.json"
      - name: One original 16-root T60 native population plus technical reproduction
        run: |
          set -euo pipefail
          python -m tools.stage8f1k_one_shot_evidence --release --reservation "$RUNNER_TEMP/F1K_RESERVATION.json" --output-dir "$RUNNER_TEMP/f1k-originals"
          python -c 'import os,pathlib; from tools.stage8f1k_one_shot_evidence import verify_bundle; x=verify_bundle(pathlib.Path(os.environ["RUNNER_TEMP"])/"f1k-originals"); assert x["roots"]==16 and x["original_native_gzips"]==64'
      - name: Preserve any partial raw case gzips and one-shot reservation
        if: ${{ always() && steps.claim.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/f1k-preservation"
          if [ -d "$RUNNER_TEMP/f1k-originals/original_cases" ]; then
            tar -C "$RUNNER_TEMP/f1k-originals" --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/f1k-preservation/F1K_PARTIAL_CASES.tar.gz" original_cases
            sha256sum "$RUNNER_TEMP/f1k-preservation/F1K_PARTIAL_CASES.tar.gz" > "$RUNNER_TEMP/f1k-preservation/F1K_PARTIAL_CASES.sha256"
          fi
      - if: ${{ always() && steps.claim.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: f1k-once-raw-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/F1K_RESERVATION.json
            ${{ runner.temp }}/f1k-originals/
            ${{ runner.temp }}/f1k-preservation/
          if-no-files-found: error
          retention-days: 90
      - name: Publish originals or partial failure records without clobber
        if: ${{ always() && steps.claim.outcome == 'success' }}
        run: |
          set -euo pipefail
          RES_SHA=$(python -c 'import json,os,pathlib; print(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"F1K_RESERVATION.json").read_bytes())["reservation_commit"])')
          gh release create "$F1K_TAG" --repo "$GITHUB_REPOSITORY" --target "$RES_SHA" --prerelease --latest=false --title 'F1K once-only original T60' --notes 'Scientific allocation consumed; no retry even after error. Originals and negative outcomes retained. Cold verdict requires separate verification. Internal GitHub custody, not external escrow.'
          assets=("$RUNNER_TEMP/F1K_RESERVATION.json")
          for file in "$RUNNER_TEMP/f1k-originals"/F1K_* "$RUNNER_TEMP/f1k-preservation"/F1K_*; do
            if [ -f "$file" ]; then assets+=("$file"); fi
          done
          gh release upload "$F1K_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"

  independent_python312_cold:
    needs: source_reservation_and_native_original
    if: ${{ always() && needs.source_reservation_and_native_original.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: '.'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: f1k-once-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/f1k-source
      - name: Verify one-shot identity, all 64 gzip and native body transitions
        run: |
          set -euo pipefail
          python -m tools.stage8f1k_one_shot_cold_entry "$RUNNER_TEMP/f1k-source" "$RUNNER_TEMP/f1k-cold"
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: f1k-once-cold-${{ github.run_id }}
          path: ${{ runner.temp }}/f1k-cold/
          if-no-files-found: warn
          retention-days: 90

  final_cold_publication:
    needs: [source_reservation_and_native_original, independent_python312_cold]
    if: ${{ always() && needs.source_reservation_and_native_original.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COLD_JOB_RESULT: ${{ needs.independent_python312_cold.result }}
    steps:
      - if: ${{ needs.independent_python312_cold.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: f1k-once-cold-${{ github.run_id }}
          path: ${{ runner.temp }}/f1k-cold-publish
      - name: Release independently verified cold result OR explicit no-retry failure
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f1k-cold-publish"
          python -m tools.stage8f1k_one_shot_publish_status --dir "$RUNNER_TEMP/f1k-cold-publish" --cold-job "$COLD_JOB_RESULT"
          gh release view "$F1K_TAG" --repo "$GITHUB_REPOSITORY" --json tagName
          files=("$RUNNER_TEMP/f1k-cold-publish/F1K_FINAL_STATUS.json")
          for p in "$RUNNER_TEMP/f1k-cold-publish/F1K_INDEPENDENT_COLD_T60.json" "$RUNNER_TEMP/f1k-cold-publish/F1K_BYTE_CUSTODY_COLD.json"; do
            if [ -f "$p" ]; then files+=("$p"); fi
          done
          gh release upload "$F1K_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY"
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: f1k-once-final-status-${{ github.run_id }}
          path: ${{ runner.temp }}/f1k-cold-publish/
          if-no-files-found: warn
          retention-days: 90
