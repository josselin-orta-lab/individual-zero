name: I1 issue317 held-out WAL-only replay
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - '.github/workflows/i1-issue317-heldout-replay.yml'
      - 'tools/audit_i1_317_remote_journey_cohort.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch original unmodified sixteen authenticated WAL artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p heldout/baseline heldout/interrupted
          gh run download 39198827810 --repo "$GITHUB_REPOSITORY" --pattern 'i1-317-remote-heldout-baseline-*' --dir heldout/baseline
          gh run download 39198827810 --repo "$GITHUB_REPOSITORY" --pattern 'i1-317-remote-heldout-interrupted-*' --dir heldout/interrupted
      - name: Verify matched SHA, physics, custody and remote outcomes
        run: |
          python tools/audit_i1_317_remote_journey_cohort.py \
            --baseline heldout/baseline \
            --interruption-aware heldout/interrupted \
            --baseline-sha 1446a78a54c95b289e1f5654313d84849f5383df \
            --interruption-sha eef98704569e44e0c026aebbeeb2eae2396911d8 \
            --seeds 3011 3023 3041 3067 3083 3109 3121 3137 \
            --output heldout/issue317-remote-heldout-replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-317-heldout-replayed-report
          path: heldout/issue317-remote-heldout-replay.json
          if-no-files-found: warn
          retention-days: 30
