name: 'I1 #318 local-Q factorial contract'
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'src/i1/runtime/i1_active_runtime.py'
      - 'src/i1/runtime/i1_natural_runtime.py'
      - 'tests/i1/test_i1_318_local_q_factorial.py'
      - 'tests/i1/test_i1_318_matched_temperament.py'
      - 'src/i1/runtime/i1_birth_temperament.py'
      - 'src/i1/runtime/m11_transactional_mortal.py'
      - '.github/workflows/i1-issue318-local-q-factorial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factorial-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests/i1 -p test_i1_318_local_q_factorial.py -v
      - run: python -m unittest discover -s tests/i1 -p test_i1_318_local_q_ablation.py -v
      - run: python -m unittest discover -s tests/i1 -p test_i1_318_matched_temperament.py -v
