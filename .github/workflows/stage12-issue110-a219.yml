name: Stage12 Issue110 A2.19 passive revision laboratory
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_stage12_issue110_a219.py'
      - 'docs/research/stage12-issue110-a219-*.md'
      - '.github/workflows/stage12-issue110-a219.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  passive-physical-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Audit 32 physical worlds and non-destructive epistemic revision probe
        run: |
          python scripts/run_stage12_issue110_a219.py \
            --output-dir /tmp/a219-physical > /tmp/a219.log 2>&1 \
            || { tail -n 120 /tmp/a219.log; exit 2; }
          grep 'A219_SUMMARY' /tmp/a219.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage12-a219-py${{ matrix.python-version }}
          path: |
            /tmp/a219-physical
            /tmp/a219.log
          retention-days: 30
          if-no-files-found: warn
