# NEW Stage8-E2 source-locked native engineering only: no science, no reruns.
name: I3 Stage8-E2 new native technical repetitions (two full cold-audited archives)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/i3-stage8e2-two-native-technical-once-20261119.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: stage8e2-source-locked-one-shot-20261119
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: First-add exact frozen source, software-only tests, zero births
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/i3 -p 'test_stage8e2_*.py' -v
          python - <<'PY'
          import os, subprocess
          from i3.runtime.provenance import source_snapshot
          from i3.lab import stage8e2_technical_transport as T
          from i3.lab import stage8e2_two_technical_receipts as G
          p=".github/workflows/i3-stage8e2-two-native-technical-once-20261119.yml"
          h=os.environ["GITHUB_SHA"]
          assert source_snapshot()["git_head"]==h
          assert source_snapshot()["working_tree_dirty"] is False
          assert not subprocess.check_output(["git","status","--porcelain","--untracked-files=all"]).strip()
          assert subprocess.check_output(["git","log","--format=%H","--",p], text=True).splitlines()==[h]
          assert subprocess.check_output(["git","diff-tree","--no-commit-id","--name-status","-r",h,"--",p],text=True).strip().split()==["A",p]
          assert T.P.EXPECTED_TOTAL==64512 and T.MUTATIONS==6144
          assert T.METHOD["two_sided_alpha"]==0.025 and G.PASS==T.TECH_PASS
          print("STAGE8E2_EXACT_SOURCE_FROZEN_NO_BIRTHS")
          PY

  native:
    if: ${{ github.run_attempt == 1 }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        py: ['3.11','3.12']
    env:
      PYTHONPATH: src
      CUSTODY: /tmp/stage8e2-native-${{ matrix.py }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Allocate root and source-locked plan WITHOUT lives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CUSTODY"
          SOURCE=$(python -c 'from i3.runtime.provenance import source_snapshot; print(source_snapshot()["sha256"])')
          python -m i3.lab.stage8e2_technical_transport allocate "$GITHUB_SHA" "$SOURCE" "$CUSTODY/originals" "$CUSTODY/PLAN.json" > "$CUSTODY/ALLOCATION.json"
          sha256sum "$CUSTODY/PLAN.json" | cut -d' ' -f1 > "$CUSTODY/PLAN.sha256"
          python - "$CUSTODY/PLAN.json" <<'PY'
          import json,sys
          from i3.lab.stage8e2_technical_transport import verify_plan
          p=json.load(open(sys.argv[1]))
          assert verify_plan(p)==p and p["planned_lives"]==64512
          assert p["scientific_admission"] is False
          PY
      - name: Publish preexposure file BEFORE G0, mandatory barrier
        uses: actions/upload-artifact@v4
        with:
          name: stage8e2-preexposure-${{ matrix.py }}-${{ github.run_id }}
          path: |
            /tmp/stage8e2-native-${{ matrix.py }}/PLAN.json
            /tmp/stage8e2-native-${{ matrix.py }}/PLAN.sha256
            /tmp/stage8e2-native-${{ matrix.py }}/ALLOCATION.json
          if-no-files-found: error
          retention-days: 90
      - name: Run once native 64512 original lives, G0 G1 G2 in order
        shell: bash
        run: |
          set -euo pipefail
          python -m i3.lab.stage8e2_technical_transport run "$CUSTODY/PLAN.json" "$(cat "$CUSTODY/PLAN.sha256")" > "$CUSTODY/RUN_RECEIPT.json"
      - name: Prepare ALL native gzip archive generations and metadata on any exit
        if: always()
        shell: bash
        run: |
          mkdir -p "$CUSTODY"
          if test -d "$CUSTODY/originals"; then
            for g in 0 1 2; do
              if test -d "$CUSTODY/originals/PHYSICAL_G$g"; then
                tar -cf "$CUSTODY/G$g.tar" -C "$CUSTODY/originals" "PHYSICAL_G$g"
              fi
            done
            tar --exclude='life-*.json.gz' -cf "$CUSTODY/metadata.tar" -C "$CUSTODY/originals" .
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage8e2-originals-G0-${{ matrix.py }}-${{ github.run_id }}
          path: /tmp/stage8e2-native-${{ matrix.py }}/G0.tar
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage8e2-originals-G1-${{ matrix.py }}-${{ github.run_id }}
          path: /tmp/stage8e2-native-${{ matrix.py }}/G1.tar
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage8e2-originals-G2-${{ matrix.py }}-${{ github.run_id }}
          path: /tmp/stage8e2-native-${{ matrix.py }}/G2.tar
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage8e2-metadata-${{ matrix.py }}-${{ github.run_id }}
          path: |
            /tmp/stage8e2-native-${{ matrix.py }}/metadata.tar
            /tmp/stage8e2-native-${{ matrix.py }}/RUN_RECEIPT.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90

  independent_cold_audit:
    if: ${{ github.run_attempt == 1 }}
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        py: ['3.11','3.12']
    env:
      PYTHONPATH: src
      COLD: /tmp/stage8e2-cold-${{ matrix.py }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: stage8e2-preexposure-${{ matrix.py }}-${{ github.run_id }}
          path: /tmp/stage8e2-cold-${{ matrix.py }}/plan
      - uses: actions/download-artifact@v4
        with:
          name: stage8e2-metadata-${{ matrix.py }}-${{ github.run_id }}
          path: /tmp/stage8e2-cold-${{ matrix.py }}/meta
      - uses: actions/download-artifact@v4
        with:
          name: stage8e2-originals-G0-${{ matrix.py }}-${{ github.run_id }}
          path: /tmp/stage8e2-cold-${{ matrix.py }}/G0
      - uses: actions/download-artifact@v4
        with:
          name: stage8e2-originals-G1-${{ matrix.py }}-${{ github.run_id }}
          path: /tmp/stage8e2-cold-${{ matrix.py }}/G1
      - uses: actions/download-artifact@v4
        with:
          name: stage8e2-originals-G2-${{ matrix.py }}-${{ github.run_id }}
          path: /tmp/stage8e2-cold-${{ matrix.py }}/G2
      - name: Cold independent verification of ALL 64512 original gzip and ancestry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$COLD/complete"
          tar -xf "$COLD/meta/metadata.tar" -C "$COLD/complete"
          for g in 0 1 2; do
            tar -xf "$COLD/G$g/G$g.tar" -C "$COLD/complete"
          done
          python -m i3.lab.stage8e2_cold_original_archive_audit "$COLD/plan/PLAN.json" "$(cat "$COLD/plan/PLAN.sha256")" "$COLD/complete" > "$COLD/COLD_AUDIT.json"
          python - "$COLD/COLD_AUDIT.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          assert a["original_lives_rehashed"]==64512
          assert a["status"]=="ALL_64512_NATIVE_ORIGINAL_GZIP_REAUDITED_NO_SCIENCE"
          assert a["scientific_admission"] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage8e2-cold-audit-${{ matrix.py }}-${{ github.run_id }}
          path: /tmp/stage8e2-cold-${{ matrix.py }}/COLD_AUDIT.json
          if-no-files-found: warn
          retention-days: 90

  two_repetition_gate:
    if: ${{ github.run_attempt == 1 }}
    needs: independent_cold_audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      GATE: /tmp/stage8e2-two-repetition-gate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: stage8e2-metadata-3.11-${{ github.run_id }}
          path: /tmp/stage8e2-two-repetition-gate/meta311
      - uses: actions/download-artifact@v4
        with:
          name: stage8e2-metadata-3.12-${{ github.run_id }}
          path: /tmp/stage8e2-two-repetition-gate/meta312
      - uses: actions/download-artifact@v4
        with:
          name: stage8e2-cold-audit-3.11-${{ github.run_id }}
          path: /tmp/stage8e2-two-repetition-gate/audit311
      - uses: actions/download-artifact@v4
        with:
          name: stage8e2-cold-audit-3.12-${{ github.run_id }}
          path: /tmp/stage8e2-two-repetition-gate/audit312
      - name: Compare original-level independent results and disjoint receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GATE/data311" "$GATE/data312"
          tar -xf "$GATE/meta311/metadata.tar" -C "$GATE/data311"
          tar -xf "$GATE/meta312/metadata.tar" -C "$GATE/data312"
          python - <<'PY'
          import json,os
          from pathlib import Path
          from i3.runtime.provenance import source_snapshot
          from i3.lab.stage8e2_two_technical_receipts import combine
          root=Path(os.environ["GATE"])
          receipts={
              "3.11":json.loads((root/"data311/TECHNICAL_RECEIPT.json").read_bytes()),
              "3.12":json.loads((root/"data312/TECHNICAL_RECEIPT.json").read_bytes()),
          }
          for version,suffix in (("3.11","311"),("3.12","312")):
              audit=json.loads((root/f"audit{suffix}/COLD_AUDIT.json").read_bytes())
              receipt=receipts[version]
              assert audit["original_lives_rehashed"]==64512
              assert audit["source_git_head"]==receipt["source_git_head"]
              assert audit["source_files_sha256"]==receipt["source_files_sha256"]
              assert audit["phase_chain_sha256"]==receipt["phase_chain_sha256"]
              assert audit["allocation_sha256"]==receipt["allocation_sha256"]
              assert audit["scientific_admission"] is False
          checked=combine(os.environ["GITHUB_SHA"],source_snapshot()["sha256"],receipts)
          assert checked["total_original_lives_claimed"]==129024
          assert checked["scientific_admission"] is False
          (root/"TECHNICAL_GATE.json").write_text(json.dumps(checked,sort_keys=True,separators=(",",":")))
          print("STAGE8E2_TWO_NATIVE_SOURCE_EXACT_TECHNICAL_REPETITIONS_COLD_AUDITED_NO_SCIENCE")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage8e2-TECHNICAL-GATE-NO-SCIENCE-${{ github.run_id }}
          path: /tmp/stage8e2-two-repetition-gate/TECHNICAL_GATE.json
          if-no-files-found: error
          retention-days: 90
