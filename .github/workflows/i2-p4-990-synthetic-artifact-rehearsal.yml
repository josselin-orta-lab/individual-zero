# Synthetic recovery rehearsal for #990. NEVER starts I2, no Git tag claim.
name: I2 P4 #990 synthetic evidence round-trip (NO BIRTH)

on:
  pull_request:
    paths:
      - '.github/workflows/i2-p4-990-synthetic-artifact-rehearsal.yml'
      - 'tools/i2_p4_990_synthetic_artifact_custody.py'
      - 'tests/i2/test_i2_p4_990_synthetic_artifact_custody_999.py'
      - 'tools/i2_p4_990_secondary_evidence_copy.py'
      - 'tests/i2/test_i2_p4_990_secondary_evidence_copy_1000.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit-test synthetic custody with no engine calls
        run: |
          python -B -m unittest discover -s tests/i2 -p 'test_i2_p4_990_synthetic_artifact_custody_999.py' -v
      - name: Test secondary export contract using no-birth fixtures
        run: |
          python -B -m unittest discover -s tests/i2 -p 'test_i2_p4_990_secondary_evidence_copy_1000.py' -v
      - name: Produce completed and aborted SYNTHETIC SQLite evidence
        env:
          EVIDENCE: ${{ runner.temp }}/p4-990-synthetic-evidence
        run: |
          set -euo pipefail
          python -B tools/i2_p4_990_synthetic_artifact_custody.py make "$EVIDENCE"
      - name: Make secondary copy of fake evidence on same device (TEST ONLY)
        env:
          EVIDENCE: ${{ runner.temp }}/p4-990-synthetic-evidence
          SECONDARY: ${{ runner.temp }}/p4-990-synthetic-secondary-copy
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/i2_p4_990_secondary_evidence_copy.py copy "$EVIDENCE" "$SECONDARY" \
            --confirm COPY-P4-990-TO-SECONDARY-STORAGE \
            --synthetic-allow-same-device
          python -B tools/i2_p4_990_secondary_evidence_copy.py verify "$SECONDARY"
      - name: Simulate command failure after journals exist (NO BIRTH)
        id: expected_failure
        continue-on-error: true
        shell: bash
        run: exit 23
      - name: Assert fixture failure was observed, not concealed
        if: ${{ always() }}
        env:
          OUTCOME: ${{ steps.expected_failure.outcome }}
        run: |
          test "$OUTCOME" = failure
      - name: Upload forensic fixtures after simulated command failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: i2-p4-990-synthetic-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/p4-990-synthetic-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload fake secondary copy for independent readback
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: i2-p4-990-synthetic-secondary-${{ github.run_id }}
          path: ${{ runner.temp }}/p4-990-synthetic-secondary-copy/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  independent-downloader:
    needs: synthetic-producer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download artifact in a different fresh job
        uses: actions/download-artifact@v4
        with:
          name: i2-p4-990-synthetic-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/p4-990-restored-evidence
      - name: Download independently readback-verifiable fake secondary copy
        uses: actions/download-artifact@v4
        with:
          name: i2-p4-990-synthetic-secondary-${{ github.run_id }}
          path: ${{ runner.temp }}/p4-990-restored-secondary
      - name: Verify downloaded secondary receipt, bytes and fixture identities
        env:
          RESTORED_SECONDARY: ${{ runner.temp }}/p4-990-restored-secondary
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/i2_p4_990_secondary_evidence_copy.py verify "$RESTORED_SECONDARY"
          grep -q 'SYNTHETIC_SAME_DEVICE_ONLY' "$RESTORED_SECONDARY/SECONDARY_COPY_RECEIPT.json"
      - name: Verify relocated manifest and both synthetic SQLite files
        env:
          RESTORED: ${{ runner.temp }}/p4-990-restored-evidence
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/i2_p4_990_synthetic_artifact_custody.py verify "$RESTORED"
          (cd "$RESTORED" && sha256sum --check SHA256SUMS.txt)
          test ! -f "$RESTORED/study/results.json"
          echo 'SYNTHETIC_ONLY; no native I2 birth; no independent M11 witness'
