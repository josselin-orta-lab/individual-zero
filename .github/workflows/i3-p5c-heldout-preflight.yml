name: I3 P5c prospective addends preflight NO validation exposure
on:
  push:
    branches: [automation/i3-p5c-heldout-preflight-20261106]
    paths: [.github/workflows/i3-p5c-heldout-preflight.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout pinned P5c engineering source
        uses: actions/checkout@v4
        with:
          ref: 674f4f05ddab8ebcc5412632d0caed7df299a8bd
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test all I3 controls and generation isolation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/i3 -p 'test_*.py' -q
          python scripts/check_engine_repository.py --json
      - name: Confirm unchanged G2 and prospective pure P5c allocation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m i3.lab.p5c_heldout --preflight
      - name: Original P4a P4b P5a P5b full evidence integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,hashlib
          from pathlib import Path
          root=Path("src/i3/docs/studies")
          for filename,expected in (
            ("p4a-g2-heldout/validation-full.json.gz","44adb1192d1aea87cf5d96a547f794de6f7fe33a566a5de90747a34429e8e8d6"),
            ("p4b-paid-outcome-learning/learning-full.json.gz","688463e4fbb71cb88d57d0cafbe70eb033adeafe8ae8551d42bec58dfa9e395c"),
            ("p5a-paid-component-screen/mechanisms-full.json.gz","21719dcc89f83f3984ccc32b3d203d2152ff8c7dd8c2c8a76318ce84d60113d8"),
            ("p5b-paid-readout-heldout/readout-full.json.gz","98d21bc18d88f26743ae9ca07cc0d966605d14de826b73a91b9d24b675c9a8df")):
              observed=hashlib.sha256(gzip.decompress((root/filename).read_bytes())).hexdigest()
              assert observed==expected,(filename,observed)
              print("UNCHANGED",filename)
          PY
