name: I0 historical archive validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserved-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - name: Run archived tests with original repository-relative paths
        run: |
          mkdir -p /tmp/i0-historical-tests
          cp archive/i0/tests/test_*.py /tmp/i0-historical-tests/
          PYTHONPATH="$PWD/src:$PWD" python -m unittest discover -s /tmp/i0-historical-tests -p 'test_*.py' -q
