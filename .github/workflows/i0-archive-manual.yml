name: I0 historical archive validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserved-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - name: Run archived tests with original repository-relative paths
        run: |
          cp -a archive/i0/lab src/lab
          mkdir -p .archive-i0-manual-hold
          mv tests/test_i1_*.py tests/test_engine_repository.py .archive-i0-manual-hold/
          cp archive/i0/tests/test_*.py tests/
          PYTHONPATH="$PWD/src:$PWD" python -m unittest discover -s tests -p 'test_*.py' -q
