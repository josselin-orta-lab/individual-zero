name: I3 archived next-action original READ ONLY

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/i3/lab/stage2_next_action_original_archive_bridge.py'
      - 'tests/i3/test_stage2_next_action_original_archive_bridge.py'
      - '.github/workflows/i3-next-action-archive-readonly.yml'

permissions:
  contents: read

concurrency:
  group: i3-archival-next-action-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-previous-originals-without-rebirth:
    name: I3 READ ONLY original next-action (Python ${{ matrix.python-version }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: src
      ARCHIVED_BRANCH: evidence/i3-next-decision-24-development-20261110-originals
      ARCHIVED_COMMIT: 20ca7efbf7797fa7b1f12983ce68906b754b312c
      ARCHIVE_DIR: archive/i3/stage2-next-decision-development-2026-11-10
    steps:
      - name: Checkout proposed CODE at exact PR SHA, no write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fetch ONLY previously consumed immutable archive commit
        shell: bash
        run: |
          set -euo pipefail
          # Neither generator, runner nor World is imported here.
          git fetch --no-tags --depth=1 \
            "https://github.com/josselin-orta-lab/individual-zero.git" \
            "refs/heads/$ARCHIVED_BRANCH"
          observed="$(git rev-parse FETCH_HEAD)"
          test "$observed" = "$ARCHIVED_COMMIT" || {
            echo "EVIDENCE_BRANCH_MOVED__NO_ARCHIVE_VERDICT"
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/i3-old-originals"
          git archive FETCH_HEAD "$ARCHIVE_DIR" | \
            tar -xf - -C "$RUNNER_TEMP/i3-old-originals"
      - name: Verify all 48 previously lived source bytes and interpret without new Worlds
        shell: bash
        run: |
          set -euo pipefail
          python -m i3.lab.stage2_next_action_original_archive_bridge \
            "$RUNNER_TEMP/i3-old-originals/$ARCHIVE_DIR" \
            > "$RUNNER_TEMP/i3-archived-next-action-summary.json"
          python - "$RUNNER_TEMP/i3-archived-next-action-summary.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              line = stream.read().strip()
          assert line.startswith("I3_ARCHIVED_NEXT_ACTION_BRIDGE_RESULT=")
          result = json.loads(line.split("=", 1)[1])
          assert result["status"] == (
              "OLD_ORIGINALS_VERIFIED_ACTUAL_RANDOM_VS_DETACHED_PRIORITY")
          assert result["archived_original_commit_expected"] == (
              "20ca7efbf7797fa7b1f12983ce68906b754b312c")
          assert result["existing_original_archive_content_verified"] is True
          assert result["existing_original_packed_sha_verified"] == 48
          assert result["existing_original_unpacked_sha_verified"] == 48
          assert result["assigned_original_pairs"] == 24
          assert result["different_funded_replay"] == 20
          assert result["no_different_fork"] == 4
          assert result["living_random_next_claim"] == 20
          assert result["priority_detached_next_claim"] == 20
          assert result["different_detached_priority_alternative"] == 1
          assert result["priority_alternative_executed_in_world"] == 0
          assert result["new_readout_delivered_into_living_decision"] is False
          assert result["new_paid_discarded_readout_treatment"] is False
          assert result["eligible_for_new_visible_discard_causal_comparison"] is False
          assert result["new_worlds_opened"] == 0
          assert result["new_born_originals"] == 0
          assert result["scientific_lives"] == 0
          assert result["causal_information_benefit"] is None
          assert result["survival_mediation"] is None
          assert result["scientific_verdict"] == "NOT_ISSUED"
          assert result["stage2_2_go"] is False
          # Logs contain only aggregate bounded metadata, never original
          # born-life records, genomes, seeds, controls or alternate paths.
          print("I3_ARCHIVED_ACTUAL_VS_DETACHED_READONLY_24_PAIRS_PASS")
          print("old_originals_verified=48, old_observed_next=20, "
                "old_detached_alternative_differences=1, new_Worlds=0")
          print("aggregate_report_sha256="+result["aggregate_report_sha256"])
          PY
