name: I1 issue203 first-person active-model audit
on:
  push:
    branches:
      - audit/i1-issue203-active-firstperson-20261016
  workflow_dispatch:
permissions:
  contents: read
jobs:
  i1-first-person:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - name: Original I0 Stage9 independent auditor and regression
        run: python -m unittest discover -s tests -p 'test_stage9_concurrent_cause_audit.py' -v
      - name: New generated I1 first-person inherited and active-on checks
        run: python -m unittest discover -s tests -p 'test_i1_issue203_firstperson.py' -v
