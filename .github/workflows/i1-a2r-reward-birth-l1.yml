name: I1 A2-R reward birth contract (L1, not cohort)
on:
  pull_request:
    paths:
      - 'tools/i1_eco_a2r_birth.py'
      - 'tools/a2r_tests/test_i1_a2r_reward_birth.py'
      - 'docs/research/audits/I1_ECO_A2R_REWARD_BIRTH_CONTRACT_2026-10-30.md'
      - '.github/workflows/i1-a2r-reward-birth-l1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: i1-a2r-reward-birth-l1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  reward_birth_l1:
    name: A2-R no-cohort birth contracts Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install current research-compatible I1 without running cohorts
        run: python -m pip install -e .
      - name: Compile the isolated birth contract, not canonical engine tests
        run: python -m py_compile tools/i1_eco_a2r_birth.py tools/a2r_tests/test_i1_a2r_reward_birth.py
      - name: Test reward math, owner-mode contract and 2-step M11 cold smoke only
        run: python -m unittest discover -s tools/a2r_tests -p test_i1_a2r_reward_birth.py -v
      - name: Assert no A2-R cohort was launched
        run: test ! -d reports/i1-eco-a2r-cohort
