name: M11 OPT2 H120 comparison once
on:
  pull_request:
    branches: [exp/m11-stage12-atomic-paid-index-20261013]
    paths:
      - '.github/workflows/m11-opt2-h120.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  opt2-h120:
    name: Unmodified M11 Stage12 H120 OPT2 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Run 120 actual steps with identical preregistered physical and cognitive parameters
        run: python -u scripts/run_m11_stage12_atomic_h120.py --output-dir /tmp/m11-opt2-h120
      - name: Retain SQLite, journal, cold recovery and summary, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue133-m11-opt2-h120-python-${{ matrix.python-version }}
          path: /tmp/m11-opt2-h120/
          if-no-files-found: warn
          retention-days: 30
