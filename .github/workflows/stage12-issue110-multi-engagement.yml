name: Issue110 multi-engagement physical calibration
on:
  pull_request:
    branches: [science/stage12-issue110-sleep-window-20261014]
    paths:
      - 'scripts/run_stage12_issue110_multi_engagement.py'
      - 'scripts/run_stage12_issue110_first_planning_state.py'
      - 'docs/research/stage12-issue110-multi-engagement-prereg-2026-10-14.fr.md'
      - '.github/workflows/stage12-issue110-multi-engagement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  autonomous-worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Execute six preregistered independent lives
        env:
          COHORT: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/run_stage12_issue110_multi_engagement.py \
            --output-dir /tmp/issue110-multi --cohort-id "$COHORT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue110-multi-py${{ matrix.python-version }}
          path: /tmp/issue110-multi
          retention-days: 30
          if-no-files-found: warn
