name: I1 A1-C full 12-feature native M11 Q replay (focused only)
on:
  pull_request:
    paths:
      - 'tools/research/i1_a1c_td_full.py'
      - 'tools/research/i1_a1c_td_full_audit.py'
      - 'tools/research/tests/test_i1_a1c_td_full.py'
      - 'docs/research/audits/I1_ECO_A1C_FULL_VECTOR_M11_Q_REPLAY_2026-10-29.md'
      - '.github/workflows/i1-a1c-full-vector-observer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: i1-a1c-full-vector-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pure_read_only:
    name: M11 replay adversarial contracts Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax (no I1 engine execution)
        run: |
          python -m py_compile tools/research/i1_a1c_td_full.py tools/research/i1_a1c_td_full_audit.py
      - name: Positive and adversarial replay contracts only
        run: |
          python -m unittest discover -s tools/research/tests -p test_i1_a1c_td_full.py -v
      - name: Never rerun A1-C newborn cohort as a CI
        run: test ! -d reports/i1-eco-a1c-cohort
