name: 'I1 #318 four-arm factorial 32 unique mortal births'
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'tools/run_i1_318_local_q_factorial_cohort.py'
      - 'tests/i1/test_i1_318_local_q_factorial_cohort.py'
      - '.github/workflows/i1-issue318-local-q-factorial-births.yml'
permissions:
  contents: read
jobs:
  factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        preset: [memory-corridor, water-isolated-corridor]
        seed: [23111, 23239, 23357, 23473]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests/i1 -p test_i1_318_local_q_factorial_cohort.py -v
      - name: Run four new mortal I1 births without retries
        env:
          PRESET: ${{ matrix.preset }}
          SEED: ${{ matrix.seed }}
        run: |
          python tools/run_i1_318_local_q_factorial_cohort.py --preset "$PRESET" --seed "$SEED" --output-dir "results/$PRESET/$SEED"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("results")/os.environ["PRESET"]/os.environ["SEED"]/"report.json"
          r=json.loads(p.read_text())
          assert r["schema"]=="i1-318-local-Q-factorial-mortal/v1"
          assert r["status"]=="COMPLETE_FACTORIAL_PHYSICAL_DIAGNOSTIC"
          assert r["preregistered_arms"]==["local_q_neutral","local_q_rank_only","local_q_evidence_only","local_q_learned"]
          assert r["all_lives_distinct_and_mortal"] is True
          assert r["scientific_verdict"]=="NO-GO"
          print("I1_318_FACTORIAL_FOUR_MORTAL_BIRTHS_COMPLETE")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-318-factorial-${{ matrix.preset }}-${{ matrix.seed }}
          path: results/
          retention-days: 30
          if-no-files-found: warn
