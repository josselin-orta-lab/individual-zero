name: A2-R native Q smoke
on:
  pull_request:
    paths:
      - 'tools/research/tests/test_i1_a2r_q_native_smoke.py'
      - 'tools/research/i1_a2r_m11_cold.py'
      - 'tools/research/i1_a2r_q_replay.py'
      - '.github/workflows/i1-a2r-native-q-smoke.yml'
permissions:
  contents: read
jobs:
  native_q_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: PYTHONPATH=tools/research python -m unittest discover -s tools/research/tests -p test_i1_a2r_q_native_smoke.py -v
