# Temporary, read-only, sanitized audit. Do not merge this workflow into main.
# Runs only for this audit branch's PR; no secrets or findings are uploaded.
name: Security Gitleaks one-shot
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - '.github/workflows/security-gitleaks-one-shot.yml'

permissions:
  contents: read

jobs:
  gitleaks-history:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/gitleaks-one-shot-2026-10-11' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch public repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all advertised heads and tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
          echo "Available refs: $(git for-each-ref --format='%(refname)' | wc -l)"
      - name: Download and verify Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            -o "$RUNNER_TEMP/gitleaks.tgz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tgz" > "$RUNNER_TEMP/expected.sha"
          sha256sum -c "$RUNNER_TEMP/expected.sha" >/dev/null
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan all fetched Git refs without publishing secrets
        shell: bash
        run: |
          set -uo pipefail
          result="$RUNNER_TEMP/gitleaks-findings.json"
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact=100 \
            --report-format=json --report-path="$result" . \
            >"$RUNNER_TEMP/gitleaks-internal.log" 2>&1
          status=$?
          if [[ "$status" -gt 1 ]]; then
            echo "Gitleaks execution failed (status=$status). Raw diagnostics are withheld."
            echo "Gitleaks execution error, status $status." >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          if [[ -f "$result" ]]; then
            count=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$result")
          else
            count=0
          fi
          echo "Scan scope: all locally fetched refs; Git history only."
          echo "Gitleaks candidate findings: $count"
          {
            echo "### Sanitized Gitleaks history scan"
            echo "- Version: 8.30.1"
            echo "- Scope: all fetched Git refs (not Actions logs or artifacts)"
            echo "- Candidate findings: $count"
            echo "- Raw matches, paths and report were **not uploaded**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" -eq 1 || "$count" -gt 0 ]]; then
            echo "Candidate findings need private triage; job marked unsuccessful."
            exit 1
          fi
          echo "Gitleaks reported zero candidate findings within the scanned refs."
