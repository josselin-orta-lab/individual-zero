name: Stage6 A2.30-E discriminant controls
on:
  pull_request:
    branches: [science/stage12-b-a229-choice-arbitration-20261015]
    paths:
      - 'tests/test_stage6_a230e_discriminants.py'
      - 'docs/research/stage12-issue110-b-a230-edge-necessity-prereg-2026-10-15.fr.md'
      - '.github/workflows/stage6-a230e-discriminants.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discriminants:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Test Stage6 controlled food cases
        run: python -m unittest discover -s tests -p test_stage6_a230e_discriminants.py -v
      - name: Test existing Stage6 contracts
        run: python -m unittest discover -s tests -p test_stage6_planning.py -v
