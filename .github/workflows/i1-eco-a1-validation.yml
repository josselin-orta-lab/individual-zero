name: I1 ECO-v1 A1 observer-only focused validation
on:
  pull_request:
    paths:
      - 'tools/run_i1_eco_a1.py'
      - 'tools/aggregate_i1_eco_a1.py'
      - 'tools/i1_eco_a1_decision_join.py'
      - 'tests/i1/test_i1_eco_a1_*.py'
      - '.github/workflows/i1-eco-a1-validation.yml'
      - 'src/i1/docs/I1_ECO_V1_A1_VERIFICATION_POLICY_2026-10-29.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: i1-eco-a1-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  observer:
    name: A1 observer-only tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install current scientific model
        run: python -m pip install -e .
      - name: Syntax of observer and independent verifier
        run: |
          python -m py_compile tools/run_i1_eco_a1.py tools/aggregate_i1_eco_a1.py tools/i1_eco_a1_decision_join.py
      - name: Focused A1 contracts only, including M11 and negative controls
        run: |
          python -m unittest discover -s tests/i1 -p 'test_i1_eco_a1_*.py' -v
      - name: Explicitly prevent accidental A1-P pilot birth in CI
        run: |
          test ! -d reports/i1-eco-a1-pilot
