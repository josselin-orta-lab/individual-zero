name: I1 isolated issue 326 technical validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/i1/experimental/**'
      - 'scripts/test_i1_artifact_parity.py'
      - 'tests/i1/test_i1_issue_326_isolated.py'
      - 'tests/i1/test_i1_adverse_lived_ranking_368.py'
      - 'tests/i1/test_i1_expired_option_lifecycle_369.py'
      - 'tests/i1/test_i1_option_success_contract_370.py'
      - 'tests/i1/test_i1_option_success_canonical_m11_371.py'
      - 'tests/i1/test_i1_spatial_confirmation_guard_372.py'
      - 'tests/i1/test_i1_spatial_intent_premise_374.py'
      - 'tests/i1/test_i1_spatial_intent_source_375.py'
      - 'tests/i1/test_i1_spatial_resumption_site_376.py'
      - 'tests/i1/test_i1_natural_spatial_m11_377.py'
      - 'tests/i1/test_i1_natural_local_site_m11_380.py'
      - '.github/workflows/i1-issue-326-technical.yml'
permissions:
  contents: read
jobs:
  isolated-326:
    name: I1 isolated 326 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install current engine
        run: python -m pip install -e .
      - name: Technical unit contract only
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/i1 -p test_i1_issue_326_isolated.py -v
      - name: Natural adverse-memory regression on generated I1
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/i1 -p test_i1_adverse_lived_ranking_368.py -v

      - name: Expired first-person intention lifecycle and M11 contract
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/i1 -p test_i1_expired_option_lifecycle_369.py -v

      - name: No false success for applied semantic options
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/i1 -p test_i1_option_success_contract_370.py -v

      - name: Canonical two-step M11 option-success cold recovery
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/i1 -p test_i1_option_success_canonical_m11_371.py -v

      - name: Spatial confirmation before Competition residual
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/i1 -p test_i1_spatial_confirmation_guard_372.py -v

      - name: Invalidated personally contradicted spatial intention
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/i1 -p test_i1_spatial_intent_premise_374.py -v

      - name: Spatial intention source consistency and canonical M11 recovery
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/i1 -p test_i1_spatial_intent_source_375.py -v

      - name: Spatial intention resumption must match remembered site
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/i1 -p test_i1_spatial_resumption_site_376.py -v

      - name: Authentic natural spatial pipeline and M11 cold parity
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/i1 -p test_i1_natural_spatial_m11_377.py -v

      - name: Canonical six-step local-site M11 cold recovery
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/i1 -p test_i1_natural_local_site_m11_380.py -v
