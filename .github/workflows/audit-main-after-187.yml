name: Post-187 merged main independent regression
on:
  push:
    branches: ['audit/main-after-187-20261015']
permissions:
  contents: read
jobs:
  merged-stage6:
    name: Main Stage6 A2.30 (Python ${{ matrix.py }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        py: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'be9df8771ad493c5aafce5ec8339cdc551518dd5'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py }}
      - run: python -m pip install -e . pytest
      - name: A2.30 root-first-edge and epistemic safety
        run: |
          python -m unittest discover -s tests -p 'test_stage6_a230*.py' -v
          python -m unittest discover -s tests -p 'test_stage6*.py' -v
          python -m unittest discover -s tests -p 'test_stage9_concurrent_cause_audit.py' -v
          python -m unittest discover -s tests -p 'test_stage12_dual_scope*.py' -v
