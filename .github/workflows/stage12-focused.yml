  issue133-multipass:
    name: issue133 paid 1 vs 3 passes per sleep step (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Two independently born 240-step mortal lives and external proof audits
        run: python scripts/run_stage10_multipass_sleep.py --output-dir /tmp/issue133-multipass
      - name: Preserve WAL and all results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue133-multipass-python-${{ matrix.python-version }}
          path: /tmp/issue133-multipass/
          retention-days: 30
          if-no-files-found: warn

  issue133-longscan:
    name: issue133 long-lived paid incremental scan (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
