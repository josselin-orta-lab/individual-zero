      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Run four prospectively paired independently born mortal lives
        run: python scripts/run_stage10_issue133_paid_index.py --output-dir /tmp/issue133-paid-index
      - name: Preserve all source journals WAL and negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue133-paid-index-python-${{ matrix.python-version }}
          path: /tmp/issue133-paid-index/
          retention-days: 30
          if-no-files-found: warn

  issue133-horizon600:
    name: issue133 P6B6 aging 600 steps in two worlds (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
