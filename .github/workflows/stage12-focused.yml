        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Execute two born-separately mortal lives and external audits
        run: python scripts/run_stage12_issue133_batch.py --output-dir /tmp/issue133-batch
      - name: Retain all evidence and software failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue133-batch-python-${{ matrix.python-version }}
          path: /tmp/issue133-batch/
          retention-days: 30
          if-no-files-found: warn

  issue133-calibration:
    name: issue133 calibrated weight 12 lives (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: 12 independent mortal lives and archived journal audits
        run: python scripts/run_stage12_issue133_calibration.py --output-dir /tmp/i0-issue133-calibration
      - name: Preserve full causal evidence and all failures
        if: always()
