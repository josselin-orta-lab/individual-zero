      - run: python -m pip install -e .
      - name: Four distinct pre-registered 240-step mortal lives
        run: python scripts/run_stage10_issue133_capacity.py --output-dir /tmp/issue133-capacity
      - name: Preserve all evidence including negative outcomes
        if: always()
