      - run: python -m pip install -e .
      - name: Two isolated 240-step mortal lives; compare actual selection and budget failures
        run: python scripts/run_stage12_issue133_longscan.py --output-dir /tmp/issue133-longscan
      - name: Retain each life even on failed audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue133-longscan-python-${{ matrix.python-version }}
          path: /tmp/issue133-longscan/
