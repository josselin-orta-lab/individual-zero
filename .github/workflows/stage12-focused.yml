name: Stage12 focused physical and operator checks

# Verify the exact source SHA, independent from an unrelated moving main.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stage12-focused.yml'
      - 'src/i0/modules/stage12_*'
      - 'src/lab/stage12_*'
      - 'scripts/report_stage12*'
      - 'scripts/run_stage12*'
      - 'tests/test_stage12*'
      - 'tests/test_v131_stage12*'
      - 'scripts/run_stage12_exploratory_science.py'
      - 'scripts/run_stage12_issue133_sleep_deep.py'
      - 'scripts/run_stage12_issue133_calibration.py'
      - 'scripts/run_stage12_issue133_batch.py'
      - 'scripts/run_stage12_issue133_longscan.py'
      - 'scripts/run_stage10_multipass_sleep.py'
      - 'scripts/run_stage10_issue133_capacity.py'
      - 'scripts/run_stage10_issue133_horizon600.py'
      - 'scripts/run_stage10_issue133_paid_index.py'
      - 'docs/research/stage10-multipass-sleep-prereg-2026-10-13.fr.md'
      - 'docs/research/stage12-issue133-longscan-prereg-2026-10-13.fr.md'
      - 'docs/research/stage12-issue133-batch-prereg-2026-10-13.fr.md'
      - 'docs/research/stage12-issue133-calibration-prereg-2026-10-12.fr.md'
      - 'scripts/run_stage12_issue132_water.py'
      - 'scripts/run_stage12_issue132_horizon.py'
      - 'docs/research/stage12-issue132-horizon-prereg-2026-10-12.fr.md'
      - 'docs/research/stage12-issue132-water-prereg-2026-10-12.fr.md'
      - 'docs/research/stage12-issue133-sleep-prereg-2026-10-12.fr.md'
      - 'scripts/run_stage12_water_sleep_followup.py'
      - 'docs/research/stage12-water-sleep-followup-prereg-2026-10-12.fr.md'
      - 'docs/research/stage12-exploratory-behavior-preregistration-2026-10-12.fr.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage12-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-stage12:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install checked source
        run: python -m pip install -e .
      - name: Provision immutable A2.30-O physical source archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/a230o-py311 /tmp/a230o-py312
          gh run download 38726664498 --repo "$GITHUB_REPOSITORY" --name a230n-py3.11 --dir /tmp/a230o-py311
          gh run download 38726664498 --repo "$GITHUB_REPOSITORY" --name a230n-py3.12 --dir /tmp/a230o-py312
      - name: Complete Stage12 diagnostics and operator audit suite
        env:
          A230O_SOURCE_A: /tmp/a230o-py311
          A230O_SOURCE_B: /tmp/a230o-py312
        run: |
          python -m unittest discover -s tests -p 'test_stage12_*.py' -q
      - name: Contrasted Stage12 and P-47 evidence contracts
        run: |
          python -m unittest discover -s tests -p 'test_stage12_alignment.py' -v
          python -m unittest discover -s tests -p 'test_stage12_occupancy_runtime.py' -v
          python -m unittest discover -s tests -p 'test_stage9_agency_comparator.py' -v
          python -m unittest discover -s tests -p 'test_stage12_goal_progress.py' -v
      - name: One-step outcome and externally audited operator packet
        run: |
          python -m unittest discover -s tests -p 'test_stage12_goal_progress.py' -v
          python -m unittest discover -s tests -p 'test_stage12_operator_packet.py' -v
          python -m unittest discover -s tests -p 'test_stage12_observer_mortal_interop.py' -v
      - name: Provenance and no-resurrection trial
        run: python -m unittest discover -s tests -p 'test_stage12_operator_trial.py' -v
      - name: Alert adjacency and sleeping sixpass integration
        run: |
          python -m unittest discover -s tests -p 'test_stage12_operator_alert_runtime.py' -v
          python -m unittest discover -s tests -p 'test_v131_stage12_sixpass_operator_integration.py' -v

  water-sleep-followup:
    name: model-support and sleep duration follow-up (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Four separately born physical lives and offline audits
        run: python scripts/run_stage12_water_sleep_followup.py --output-dir /tmp/stage12-water-sleep-followup
      - name: Preserve all four lives and negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage12-water-sleep-followup-python-${{ matrix.python-version }}
          path: /tmp/stage12-water-sleep-followup/
          retention-days: 30
          if-no-files-found: warn

  issue132-horizon:
    name: issue132 two-step motive evidence (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Compare two separately born mortal lives and their audits
        run: python scripts/run_stage12_issue132_horizon.py --output-dir /tmp/stage12-horizon
      - name: Preserve all outcomes and full causal proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage12-issue132-horizon-python-${{ matrix.python-version }}
          path: /tmp/stage12-horizon/
          retention-days: 30
          if-no-files-found: warn

