name: I3 P5c original-only active mortality posthoc audit ZERO new lives
on:
  push:
    branches: [automation/i3-p5c-posthoc-mortality-audit-20261106]
    paths: [.github/workflows/i3-p5c-posthoc-mortality-audit.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout exact P5c original-only diagnostic source
        uses: actions/checkout@v4
        with:
          ref: 22cbe688164b9cfb235fb5d785b195c11c00d0fb
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test all I3 and generation boundaries
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/i3 -p 'test_*.py' -q
          python scripts/check_engine_repository.py --json
      - name: Recompute original-only death causes and early physical actions
        shell: bash
        run: |
          set -euo pipefail
          folder=src/i3/docs/studies/p5c-paid-score-addends
          test "$(gzip -dc "$folder/addends-full.json.gz" | sha256sum | cut -d ' ' -f1)" = "9ef699c1b8e5396ca4132ca526bfb09b3ae01bda524a33fb218a6e51473fa6a7"
          PYTHONPATH=src python -m i3.lab.p5c_posthoc_mortality "$folder/addends-full.json.gz" > "$RUNNER_TEMP/mortality.json"
          python - <<'PY'
          import json,os
          a=json.load(open(os.environ["RUNNER_TEMP"]+"/mortality.json"))
          assert a["status"]=="POSTHOC_DESCRIPTIVE_ONLY_NO_NEW_LIVES"
          assert a["original_canonical_sha256"]=="4774b3c890bba4b6b06efa5d955ec81ed3abcbc652ae7b2169ecd7ddb241bc0d"
          assert a["original_lives"]==1152
          assert a["missing_data_limit"]=="NO_COMPLETE_POST_STEP_RESOURCE_CONTACT_OR_BODY_TRAJECTORIES"
          for mode,metrics in a["by_mode"].items():
              print("POSTHOC",mode,"censored",metrics["censored"],
                    "dead",metrics["deaths"],"steps",metrics["total_steps_lived"],
                    "inactive",metrics["total_inactive_steps"],
                    "early_actions",metrics["first_12_step_action_families"],
                    "death_causes",metrics["death_causes_multi_label"],
                    "death_by_time",metrics["dead_by_horizon"])
          for mode,eco in a["by_ecology"].items():
              for name,row in eco.items():
                  print("ECOLOGY",mode,name,"censored",row["censored"],
                        "death_causes",row["death_causes_multi_label"])
          for mode,pair in a["paired_lifetime"].items():
              print("PAIR",mode,pair)
          PY
