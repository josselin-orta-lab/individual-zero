name: Stage12 Issue110 A2.7 real food and partial-plan revalidation
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/i0/modules/stage6_planning.py'
      - 'src/lab/stage6_runtime.py'
      - 'scripts/run_stage12_issue110_first_planning_state.py'
      - 'scripts/run_stage12_issue110_a27.py'
      - 'tests/test_stage12_a27_revalidation.py'
      - 'docs/research/stage12-issue110-a27-unexecuted-prefix-revalidation-prereg-2026-10-14.fr.md'
      - '.github/workflows/stage12-issue110-a27.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a27-physical-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Contracts and real-mortal smoke
        run: |
          python -m unittest discover -s tests -p 'test_stage12_progressive_planning.py' -v
          python -m unittest discover -s tests -p 'test_stage12_a27_revalidation.py' -v
      - name: Preregistered 16 independent mortal lives of 42 steps
        env:
          COHORT: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/run_stage12_issue110_a27.py \
            --output-dir /tmp/i0-stage12-a27 --cohort-id "$COHORT" \
            > /tmp/i0-stage12-a27.log 2>&1 || { tail -n 120 /tmp/i0-stage12-a27.log; exit 2; }
          grep 'A27_SUMMARY' /tmp/i0-stage12-a27.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage12-a27-py${{ matrix.python-version }}
          path: |
            /tmp/i0-stage12-a27
            /tmp/i0-stage12-a27.log
          retention-days: 30
          if-no-files-found: warn
