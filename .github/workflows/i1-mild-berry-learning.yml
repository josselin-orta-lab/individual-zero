name: I1 mild berry toxicity learning pilot
on:
  push:
    branches: [science/i1-mild-berry-learning-20261018]
    paths:
      - 'tools/run_i1_need_movement_investigation.py'
      - 'tools/audit_i1_berry_learning.py'
      - '.github/workflows/i1-mild-berry-learning.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        world: [longlife-garden, oasis]
        toxicity: ['-100.0', '-10.0', '0.0']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source and scenarios
        run: |
          python -m pip install -e .
          python scripts/check_engine_repository.py --json
          python tools/run_i1_need_movement_investigation.py --preset "${{ matrix.world }}" --validate-only
      - name: New mortal lives, no synthetic encounters
        env:
          WORLD: ${{ matrix.world }}
          TOXICITY: ${{ matrix.toxicity }}
        shell: bash
        run: |
          set -euo pipefail
          for variant in 61 62 63; do
            folder="reports/${WORLD}/toxicity-${TOXICITY}/variant-${variant}"
            python tools/run_i1_need_movement_investigation.py \
              --preset "$WORLD" --seed "$((992000 + variant))" \
              --world-variant "$variant" --steps 800 --lives 1 \
              --custody wal --geographic-novelty-weight 0.3 \
              --experimental-fatigue-weight 0.0 \
              --experimental-berry-b-damage "$TOXICITY" \
              --output-dir "$folder"
            python tools/analyze_i1_need_movement.py \
              --input "$folder" --output "$folder/observation.json"
            python tools/audit_i1_berry_learning.py \
              --input "$folder" --output "$folder/toxic-learning.json"
          done
      - name: Preserve death-inclusive physical WAL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1-berry-${{ matrix.world }}-${{ matrix.toxicity }}-${{ github.run_id }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
