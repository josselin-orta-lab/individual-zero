name: I1 A2.37-R1 corrected D2 mixed-needs regression

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/i1-a237-r1-science.yml'
      - 'src/i1_overlays/i1_d2_runtime.py'
      - 'tests/test_i1_a237_d2_no_geography.py'
      - 'scripts/run_i1_a237_mixed_needs.py'
      - 'docs/research/i1-a237-fault-amendment-1-2026-10-16.en.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a237-r1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repaired-physical:
    name: R1 preserved 96 case identities Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: D2 no-geography actually mortal I1 regression
        run: |
          python -m unittest discover -s tests -p 'test_i1_a237_d2_no_geography.py' -v
          python -m unittest discover -s tests -p 'test_i1_a236_combined_m11_water.py' -v
      - name: Re-execute locked mixed food and water worlds without protocol retuning
        run: |
          python scripts/run_i1_a237_mixed_needs.py --output "a237-r1-py${{ matrix.python-version }}" --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Preserve all 96 repaired mortal lives including negative cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a237-r1-py${{ matrix.python-version }}
          path: a237-r1-py${{ matrix.python-version }}/
          if-no-files-found: warn
          retention-days: 90
