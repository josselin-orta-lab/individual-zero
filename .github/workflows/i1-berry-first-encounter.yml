name: I1 berry first encounter prospective cohort
on:
  push:
    branches: [science/i1-mild-berry-learning-20261018]
    paths:
      - '.github/workflows/i1-berry-first-encounter.yml'
      - 'tools/run_i1_need_movement_investigation.py'
      - 'tools/audit_i1_berry_learning.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  natural-encounter:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        toxicity: ['-100.0','-10.0','0.0']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify physical contracts
        run: |
          python -m pip install -e .
          python scripts/check_engine_repository.py --json
          python tools/run_i1_need_movement_investigation.py --preset longlife-garden --validate-only
      - name: Independent newborns with real nearby unfamiliar berry
        shell: bash
        env:
          TOXICITY: ${{ matrix.toxicity }}
        run: |
          set -euo pipefail
          for variant in 71 72 73; do
            folder="reports/berry-b-first/toxicity-${TOXICITY}/variant-${variant}"
            python tools/run_i1_need_movement_investigation.py \
              --preset longlife-garden --seed "$((993000 + variant))" \
              --world-variant "$variant" --steps 800 --lives 1 \
              --custody wal --geographic-novelty-weight 0.3 \
              --experimental-fatigue-weight 0.0 \
              --experimental-berry-b-damage "$TOXICITY" \
              --berry-exposure-ecology berry-b-first-v1 \
              --output-dir "$folder"
            python tools/audit_i1_berry_learning.py \
              --input "$folder" --output "$folder/toxic-learning.json"
          done
      - name: Preserve mortal life histories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1-berry-first-${{ matrix.toxicity }}-${{ github.run_id }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
