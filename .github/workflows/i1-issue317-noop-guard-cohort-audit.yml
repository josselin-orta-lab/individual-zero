name: I1 issue317 independent no-op guard 12 WAL audit
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'tools/audit_i1_317_noop_guard_cohort.py'
      - 'tests/i1/test_i1_317_noop_guard_cohort.py'
      - '.github/workflows/i1-issue317-noop-guard-cohort-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/i1 -p test_i1_317_noop_guard_cohort.py -v
      - name: Collect immutable original matched mortal WAL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sealed result
          for world in oasis foraging memory-corridor; do
            for seed in 14083 14107; do
              gh run download 39315789674 --repo "$GITHUB_REPOSITORY" --name "i1-317-place-noop-guard-$world-$seed" --dir sealed
            done
          done
      - name: Certify independently original WAL and competition evidence
        run: |
          python tools/audit_i1_317_noop_guard_cohort.py --root sealed --output result/noop-guard-certificate.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('result/noop-guard-certificate.json').read_text())
          assert r['authenticated_original_WAL_paths']==12
          assert r['scientific_verdict']=='NO-GO'
          assert r['research_rank_changes_independently_proven'] is False
          assert all(r['summary'][arm]['lives']==6 for arm in ('canonical','guarded_recall'))
          print('TWELVE_IRREVERSIBLE_NOOP_GUARD_WAL_CERTIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-317-sealed-noop-guard-12-life-certificate
          path: result/
          retention-days: 30
          if-no-files-found: warn
