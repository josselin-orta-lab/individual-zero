name: I1 natural population calibration
on:
  push:
    branches: [science/i1-natural-population-calibration-20261018]
    paths:
      - 'tools/run_i1_population_calibration.py'
      - 'tests/i1/test_i1_population_calibration.py'
      - 'tools/audit_i1_birth_capabilities.py'
      - '.github/workflows/i1-natural-population-calibration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        candidate: [0, 1, 2, 3, 4, 5]
        world: [oasis, foraging]
        seed: [911, 912]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Natural I1 isolation and optimizer tests
        run: |
          python scripts/check_engine_repository.py --json
          python -m unittest discover -s tests/i1 -p test_i1_population_calibration.py -v
      - name: Independent mortal I1 candidate
        env:
          CANDIDATE: ${{ matrix.candidate }}
          WORLD: ${{ matrix.world }}
          SEED: ${{ matrix.seed }}
        run: |
          python tools/run_i1_population_calibration.py evaluate \
            --candidate "$CANDIDATE" --world "$WORLD" --seed "$SEED" \
            --steps 300 --output-dir "reports/candidate-${CANDIDATE}/${WORLD}/seed-${SEED}"
      - name: Preserve full WAL and report even after death
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1-population-${{ matrix.candidate }}-${{ matrix.world }}-${{ matrix.seed }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
  rank:
    needs: evaluate
    if: ${{ needs.evaluate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: i1-population-*
          path: paired-lives
          merge-multiple: false
      - name: Fail closed on missing or mixed cohorts, rank outcomes
        shell: bash
        run: |
          mapfile -t REPORTS < <(find paired-lives -name report.json -type f | sort)
          test "${#REPORTS[@]}" -eq 24
          mkdir -p ranking
          python tools/run_i1_population_calibration.py aggregate "${REPORTS[@]}" > ranking/scoreboard.json
          cat ranking/scoreboard.json
      - uses: actions/upload-artifact@v4
        with:
          name: i1-population-scoreboard
          path: ranking/scoreboard.json
          retention-days: 30
