name: Issue110 prospective prefix A-B
on:
  pull_request:
    branches: [science/stage12-issue110-sleep-window-20261014]
    paths:
      - 'src/i0/modules/stage6_planning.py'
      - 'src/lab/stage6_runtime.py'
      - 'scripts/run_stage12_issue110_first_planning_state.py'
      - 'scripts/run_stage12_issue110_prefix_ab.py'
      - '.github/workflows/stage12-issue110-prefix-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prospective-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Existing bounded planning regression contracts
        run: python -m unittest discover -s tests -p 'test_stage12_progressive_planning.py' -v
      - name: Eight predeclared prospective-prefix lives
        env:
          COHORT: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/run_stage12_issue110_prefix_ab.py --output-dir /tmp/prefix-ab --cohort-id "$COHORT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue110-prefix-py${{ matrix.python-version }}
          path: /tmp/prefix-ab
          retention-days: 30
          if-no-files-found: warn
