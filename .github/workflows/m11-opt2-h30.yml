name: M11 OPT2 H30 unchanged causal benchmark
# OPT2 H30 was queued as run #38421708559 at code SHA
# 445c71896d4d1840bb13cdae4b7882d945256f56. Future reruns manual.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opt2-h30:
    name: Real SQLite M11 OPT2 profile H30 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Run the exact pre-OPT2 H30 benchmark script, unchanged
        run: python -u scripts/profile_m11_stage12_30.py --output-dir /tmp/issue133-opt2-h30
      - name: Keep raw profile, canonical SQLite state and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue133-opt2-h30-python-${{ matrix.python-version }}
          path: /tmp/issue133-opt2-h30/
          if-no-files-found: warn
          retention-days: 30
