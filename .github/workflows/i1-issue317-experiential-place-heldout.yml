name: I1 issue317 held-out experiential memory replication
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'tools/run_i1_317_experiential_place_heldout.py'
      - 'src/i1/lab/world_presets/water-isolated-corridor.json'
      - 'tests/i1/test_i1_317_experiential_place_heldout.py'
      - '.github/workflows/i1-issue317-experiential-place-heldout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-mortal-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        preset: [oasis, foraging, memory-corridor, water-isolated-corridor]
        seed: [16127, 16249, 16381, 16513]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests/i1 -p test_i1_317_experiential_place_heldout.py -v
      - name: Born two independent mortal lives per locked world and seed
        env:
          PRESET: ${{ matrix.preset }}
          SEED: ${{ matrix.seed }}
        run: |
          python tools/run_i1_317_experiential_place_heldout.py --preset "$PRESET" --seed "$SEED" --output-dir "results/$PRESET/$SEED"
          python - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path('results')/os.environ['PRESET']/os.environ['SEED']/'report.json').read_text())
          assert r['schema']=='i1-317-experiential-place-heldout-mortal/v1'
          assert r['status']=='COMPLETE_PAIRED_PHYSICAL_DIAGNOSTIC'
          assert r['heldout_validation_not_promotion'] is True
          assert r['water_berry_colocation_ablated_in_isolated_corridor'] is True
          assert r['preregistered_arms']==['guard_control','guard_experiential']
          assert r['scientific_verdict']=='NO-GO'
          print('HELDOUT_EXPERIENTIAL_MORTAL_PAIR_COMPLETE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-317-heldout-${{ matrix.preset }}-${{ matrix.seed }}
          path: results/
          retention-days: 30
          if-no-files-found: warn
