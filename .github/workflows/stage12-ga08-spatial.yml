name: Stage12 GA08 spatial-provenance foundation
on:
  pull_request:
    branches:
      - research/stage12-issue110-attribution-provenance-20261013
    paths:
      - 'src/i0/modules/stage12_spatial_goal_evidence.py'
      - 'src/i0/modules/stage12_goal_progress.py'
      - 'src/i0/modules/stage12_goal_agency.py'
      - 'src/lab/stage3_runtime.py'
      - 'src/lab/stage12_runtime.py'
      - 'src/lab/stage12_spatial_provenance_audit.py'
      - 'src/lab/stage12_goal_progress_audit.py'
      - 'src/lab/stage12_first_person_agency_audit.py'
      - 'tests/test_stage12_ga08_owner_runtime.py'
      - 'tests/test_stage12_ga08_spatial_evidence.py'
      - 'tests/test_stage12_ga08_physical_fixture.py'
      - '.github/workflows/stage12-ga08-spatial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spatial-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Run GA08 source kernel and existing first-person guardrails
        run: |
          python -m unittest discover -s tests -p 'test_stage12_ga08_spatial_evidence.py' -v
          python -m unittest discover -s tests -p 'test_stage12_ga08_physical_fixture.py' -v
          python -m unittest discover -s tests -p 'test_stage12_ga08_owner_runtime.py' -v
          python -m unittest discover -s tests -p 'test_stage12_goal_progress.py' -q
          python -m unittest discover -s tests -p 'test_stage12_goal_agency_runtime.py' -q
          python -m unittest discover -s tests -p 'test_stage12_goal_agency.py' -q
          python -m unittest discover -s tests -p 'test_stage12_attribution_pairs.py' -q
