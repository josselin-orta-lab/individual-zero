name: I1 deficit reward prospective validation
on:
  push:
    branches: [science/i1-deficit-reward-validation-20261018]
    paths:
      - 'tools/run_i1_deficit_reward_validation.py'
      - '.github/workflows/i1-deficit-reward-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        world: [oasis, foraging]
        seed: [811, 812, 813, 814]
        reward: [absolute, deficit-only-v1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Single independent mortal life
        env:
          WORLD: ${{ matrix.world }}
          SEED: ${{ matrix.seed }}
          REWARD: ${{ matrix.reward }}
        run: |
          python tools/run_i1_deficit_reward_validation.py --world "$WORLD" \
            --seed "$SEED" --reward "$REWARD" --steps 300 \
            --output-dir "reports/$WORLD/$SEED/$REWARD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reward-${{ matrix.world }}-${{ matrix.seed }}-${{ matrix.reward }}
          path: reports/
          retention-days: 30
