name: I1 isolated fork software gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/i1/**'
      - 'src/i1_overlays/**'
      - 'scripts/build_i1_fork.py'
      - 'tests/test_i1_source_snapshot.py'
      - 'tests/test_i1_generated_isolation.py'
      - 'tests/test_i1_first_physical_step.py'
      - 'tests/test_i1_active_birth.py'
      - 'tests/test_i1_model_m11_contract.py'
      - 'tests/test_i1_m11_cold_recovery.py'
      - 'tests/test_i1_decision_witness.py'
      - '.github/workflows/i1-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i1-fork-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fork-imports:
    name: I1 fork imports (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install baseline
        run: python -m pip install -e .
      - name: Verify separate packages, imports and exact snapshot
        run: |
          python -m unittest discover -s tests -p 'test_i1_source_snapshot.py' -v
          python -m unittest discover -s tests -p 'test_i1_generated_isolation.py' -v
          python -m unittest discover -s tests -p 'test_i1_first_physical_step.py' -v
          python -m unittest discover -s tests -p 'test_i1_active_birth.py' -v
          python -m unittest discover -s tests -p 'test_i1_model_m11_contract.py' -v
          python -m unittest discover -s tests -p 'test_i1_m11_cold_recovery.py' -v
          python -m unittest discover -s tests -p 'test_i1_decision_witness.py' -v
      - name: Verify historical I0 planning
        run: python -m unittest discover -s tests -p 'test_stage6_planning.py' -q
