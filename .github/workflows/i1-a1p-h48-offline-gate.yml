name: A1-P H48 offline replay pure gate
on:
  pull_request:
    paths:
      - 'tools/research/i1_a1p_h48_reproduce.py'
      - 'tests/research/a1p/test_i1_a1p_h48_reproduce.py'
      - '.github/workflows/i1-a1p-h48-offline-gate.yml'
permissions:
  contents: read
jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Strictly synthetic offline gate only, never download original lives
        run: PYTHONPATH=tools/research python -m unittest discover -s tests/research/a1p -p test_i1_a1p_h48_reproduce.py -v
