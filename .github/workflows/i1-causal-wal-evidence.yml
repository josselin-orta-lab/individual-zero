name: 'I1 read-only causal WAL evidence gate'
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/audit_i1_causal_wal.py'
      - 'tests/i1/test_i1_causal_wal_audit.py'
      - '.github/workflows/i1-causal-wal-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests/i1 -p test_i1_causal_wal_audit.py -v
      - name: Authenticate genuine fresh I1 WAL without motor intervention
        run: |
          python tools/run_i1_world_preset.py --preset oasis --seed 2473 --steps 3 --lives 1 --custody wal --output-dir reports/i1-wal-audit
          python tools/audit_i1_causal_wal.py reports/i1-wal-audit/life-01.wal --output reports/i1-wal-audit/causal-certificate.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('reports/i1-wal-audit/causal-certificate.json').read_text())
          assert report['independent_hash_chain_verified'] is True
          assert report['physical_steps']==3
          assert report['scientific_verdict']=='INCONCLUSIVE'
          assert report['claim_of_survival_improvement'] is False
          print('I1_INDEPENDENT_CAUSAL_WAL_AUDIT_OK')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-readonly-causal-wal-report
          path: reports/i1-wal-audit/causal-certificate.json
          retention-days: 14
          if-no-files-found: warn
