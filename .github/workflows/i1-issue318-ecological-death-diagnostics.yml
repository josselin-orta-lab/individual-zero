name: 'I1 #318 physical ecological mortality diagnostics'
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'tools/audit_i1_318_ecological_death_diagnostics.py'
      - '.github/workflows/i1-issue318-ecological-death-diagnostics.yml'
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          run-id: 39429962526
          github-token: ${{ github.token }}
          pattern: i1-318-longholdout-*
          path: original
          merge-multiple: true
      - name: Verify all 24 original WAL and classify actual mortality
        run: |
          python tools/audit_i1_318_ecological_death_diagnostics.py --root original --output ecological-deaths.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("ecological-deaths.json").read_text())
          assert r["authenticated_original_WAL"]==24
          assert len(r["pairs"])==12
          assert r["scientific_verdict"]=="INCONCLUSIVE"
          print("I1_318_PHYSICAL_DEATH_DIAGNOSTICS_DONE")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-318-ecological-original-24-death-diagnostics
          path: ecological-deaths.json
          retention-days: 30
          if-no-files-found: warn
