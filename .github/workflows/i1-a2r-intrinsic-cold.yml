name: A2-R Stage11 cold source arithmetic
on:
  pull_request:
    paths:
      - 'tools/research/i1_a2r_intrinsic_cold.py'
      - 'tools/research/tests/test_i1_a2r_intrinsic_cold.py'
      - 'tools/research/i1_a2r_source_birth_audit.py'
      - '.github/workflows/i1-a2r-intrinsic-cold.yml'
permissions:
  contents: read
jobs:
  arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=tools/research python -m unittest discover -s tools/research/tests -p test_i1_a2r_intrinsic_cold.py -v
