name: I1 #317 out-of-sight corridor experiment
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - '.github/workflows/i1-issue317-corridor.yml'
      - 'src/i1/modules/competition.py'
      - 'tests/i1/test_i1_memory_competition_317.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corridor:
    strategy:
      fail-fast: false
      matrix:
        seed: [1141, 1142, 2027, 2028]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Unscripted mortal I1 within witnessed corridor
        env:
          SEED: ${{ matrix.seed }}
        run: |
          python tools/run_i1_world_preset.py --preset memory-corridor --seed "$SEED" --steps 300 --lives 1 --custody wal --output-dir "reports/$SEED"
          python tools/audit_i1_spatial_navigation_314.py "reports/$SEED/life-01.wal" --output "reports/$SEED/memory-audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-317-corridor-${{ matrix.seed }}
          path: reports/
          retention-days: 30
          if-no-files-found: error
