name: I1 issue318 physical alert wake sleep loop audit
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'tools/audit_i1_318_alert_sleep_reentry.py'
      - 'tests/i1/test_i1_318_alert_sleep_reentry.py'
      - '.github/workflows/i1-issue318-alert-sleep-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/i1 -p test_i1_318_alert_sleep_reentry.py -v
      - name: Read original 16 irrevocable physical WAL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sealed result
          for world in memory-corridor water-isolated-corridor; do
            for seed in 18121 18233 18367 18481; do
              gh run download 39328430028 --repo "$GITHUB_REPOSITORY" --name "i1-317-native-mortal-$world-$seed" --dir sealed
            done
          done
      - name: Independently authenticate cohort and physical sleep decisions
        run: |
          python tools/audit_i1_318_alert_sleep_reentry.py --root sealed --output result/alert-sleep-original-wal.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-318-native-alert-sleep-16-certificate
          path: result/
          retention-days: 30
          if-no-files-found: warn
