name: Stage12 A2.30-L adversarial physical safety evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_stage12_issue110_b_a230l_counterexamples.py'
      - 'tests/test_stage12_a230l_counterexamples.py'
      - 'docs/research/stage12-issue110-b-a230l-*.md'
      - '.github/workflows/stage12-b-a230l.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hidden-physical-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Verify contradictory hidden safety and body-state cases
        run: python -m unittest discover -s tests -p test_stage12_a230l_counterexamples.py -v
      - name: Capture independent physical counterexample hashes
        run: |
          python -u scripts/run_stage12_issue110_b_a230l_counterexamples.py \
            --output-dir /tmp/a230l > /tmp/a230l.log 2>&1 \
            || { tail -n 160 /tmp/a230l.log; exit 2; }
          grep A230L_SUMMARY /tmp/a230l.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a230l-py${{ matrix.python-version }}
          path: |
            /tmp/a230l
            /tmp/a230l.log
          retention-days: 30
