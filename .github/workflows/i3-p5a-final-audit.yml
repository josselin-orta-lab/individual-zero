name: I3 P5a final evidence and science handoff audit NO new lives
on:
  push:
    branches: [automation/i3-p5a-final-audit-20261106]
    paths: [.github/workflows/i3-p5a-final-audit.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout exact candidate including archived P5a results
        uses: actions/checkout@v4
        with:
          ref: 16ebf81f1e35da373f1bf55fd7349c4e63f9c80a
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test all 144 I3 controls and generation isolation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/i3 -p 'test_*.py' -q
          python scripts/check_engine_repository.py --json
      - name: Verify original P5a JSON and independently recalculate outcomes
        shell: bash
        run: |
          set -euo pipefail
          root=src/i3/docs/studies/p5a-paid-component-screen
          gzip -dc "$root/mechanisms-full.json.gz" > "$RUNNER_TEMP/p5a-original.json"
          test "$(sha256sum "$RUNNER_TEMP/p5a-original.json" | cut -d ' ' -f1)" = "21719dcc89f83f3984ccc32b3d203d2152ff8c7dd8c2c8a76318ce84d60113d8"
          test "$(sha256sum "$root/mechanisms-summary.json" | cut -d ' ' -f1)" = "362c0dce5116d7b1148f4deae0016b096960872fd747f351fafca8cfa14808ff"
          PYTHONPATH=src python -m i3.lab.p5a_custody "$RUNNER_TEMP/p5a-original.json" > "$RUNNER_TEMP/p5a-custody.json"
          python - <<'PY'
          import json,os
          p=json.load(open(os.environ["RUNNER_TEMP"]+"/p5a-custody.json"))
          assert p["original_canonical_sha256"]=="06217b9f96da28c2ba34034f43b4800005346abeca4c88cc5b47184a3597bd96"
          assert p["total_lives"]==1152 and p["worlds"]==24
          assert p["status"]=="ORIGINAL_VERIFIED_NO_NEW_LIVES"
          assert p["comparisons"]["discard_effects"]["per_population_difference_in_censored_lives"]==[17,36,21,38]
          assert p["comparisons"]["discard_values"]["per_population_difference_in_censored_lives"]==[2,-3,2,-6]
          assert p["comparisons"]["discard_replay"]["per_population_difference_in_censored_lives"]==[1,-5,3,-6]
          print("P5a original evidence and all three predeclared population contrasts verified")
          PY
