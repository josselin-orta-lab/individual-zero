# TEMPORARY PR-only source transfer for local code development. DELETE before merge.
name: I3 F1N temporary source checkout bundle no births
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/i3-f1n-dev-source-snapshot-temporary.yml'
permissions:
  contents: read
jobs:
  source_snapshot_only_no_birth:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/i3-stage8-f1n-paid-margin-dev-cold-transport-20261126' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Zip source and tests only, absolutely no execution
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/i3-f1n-sources.tar.gz" src tools tests docs/research/studies/stage8f1-paid-microdecision .github/workflows pyproject.toml
          ls -lh "$RUNNER_TEMP/i3-f1n-sources.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: i3-f1n-internal-source-transfer-${{ github.run_id }}
          path: ${{ runner.temp }}/i3-f1n-sources.tar.gz
          if-no-files-found: error
          retention-days: 1
