name: M11 SQLite transaction gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lab/sqlite_*.py'
      - 'tests/test_sqlite_*.py'
      - '.github/workflows/m11-sqlite-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m11-sqlite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-custody:
    name: SQLite hard-crash tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Validate private physical staging and SQLite crash fences
        run: python -m unittest discover -s tests -p 'test_sqlite_*.py' -v
