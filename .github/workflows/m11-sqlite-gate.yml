name: M11 SQLite transaction gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lab/sqlite_*.py'
      - 'src/lab/m11_transactional_mortal.py'
      - 'tests/test_sqlite_*.py'
      - 'tests/test_m11_*.py'
      - 'scripts/run_m11_transactional_trial.py'
      - 'scripts/audit_i0_sqlite.py'
      - '.github/workflows/m11-sqlite-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m11-sqlite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-custody:
    name: SQLite hard-crash tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Validate SQLite storage, real mortal cold recovery and hard crashes
        run: |
          python -m unittest discover -s tests -p 'test_sqlite_*.py' -v
          python -m pytest -q \
            tests/test_m11_real_transactional_runtime.py \
            tests/test_m11_coordinated_crash_matrix.py \
            tests/test_m11_operator_trial_cli.py
