name: Main after 188 scientific postmerge
on:
  push:
    branches: ['audit/main-after-188-20261015']
permissions:
  contents: read
  actions: read
jobs:
  postmerge:
    name: verified-main-NO (Python ${{ matrix.py }})
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        py: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '72da447cc212ab6952dd150fc86bf39d13f623d6'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py }}
      - run: python -m pip install -e . pytest
      - name: Load original immutable N archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/a230o-py311 /tmp/a230o-py312
          gh run download 38726664498 --repo "$GITHUB_REPOSITORY" --name a230n-py3.11 --dir /tmp/a230o-py311
          gh run download 38726664498 --repo "$GITHUB_REPOSITORY" --name a230n-py3.12 --dir /tmp/a230o-py312
      - name: Actual merged main Stage12, Stage6, Stage9 and independent archives
        env:
          A230O_SOURCE_A: /tmp/a230o-py311
          A230O_SOURCE_B: /tmp/a230o-py312
        run: |
          python -m unittest discover -s tests -p 'test_stage12_a230*.py' -v
          python -m unittest discover -s tests -p 'test_stage12_dual_scope*.py' -v
          python -m unittest discover -s tests -p 'test_stage6_a230*.py' -v
          python -m unittest discover -s tests -p 'test_stage9_concurrent_cause_audit.py' -v
