name: Stage12 A2.30-Q independent delayed-trajectory archive audit
on:
  pull_request:
    branches: [science/stage12-b-a230n-uncertain-transition-evaluation-20261015]
    paths:
      - 'scripts/audit_stage12_issue110_b_a230q_independent_archives.py'
      - 'tests/test_stage12_a230q_archive_witness.py'
      - 'docs/research/stage12-issue110-b-a230q-*.md'
      - '.github/workflows/stage12-b-a230q.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Retrieve immutable original P records from both versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/a230q-311 /tmp/a230q-312
          gh run download 38730415503 --repo "$GITHUB_REPOSITORY" --name a230p-py3.11 --dir /tmp/a230q-311
          gh run download 38730415503 --repo "$GITHUB_REPOSITORY" --name a230p-py3.12 --dir /tmp/a230q-312
      - name: Deliberately falsify recorded terminality, safety and training evidence
        env:
          A230Q_SOURCE_311: /tmp/a230q-311
          A230Q_SOURCE_312: /tmp/a230q-312
        run: python -m unittest discover -s tests -p test_stage12_a230q_archive_witness.py -v
      - name: Independently recompute all 128 worlds, 352 steps and 80 heldouts without physics replay
        run: |
          python -u scripts/audit_stage12_issue110_b_a230q_independent_archives.py \
            --source-311 /tmp/a230q-311 \
            --source-312 /tmp/a230q-312 \
            --output-dir /tmp/a230q-output > /tmp/a230q.log 2>&1 \
            || { tail -n 160 /tmp/a230q.log; exit 2; }
          grep A230Q_SUMMARY /tmp/a230q.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a230q-py${{ matrix.python-version }}
          path: |
            /tmp/a230q-output
            /tmp/a230q.log
          retention-days: 30
