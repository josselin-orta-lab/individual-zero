name: Stage12 Issue110 A2.18 sequential first-person agency
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_stage12_issue110_a218.py'
      - 'docs/research/stage12-issue110-a218-*.md'
      - '.github/workflows/stage12-issue110-a218.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sequential-physical-agency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Audit 48 physical worlds and sequential first-person judgements
        run: |
          python scripts/run_stage12_issue110_a218.py \
            --output-dir /tmp/a218-physical > /tmp/a218.log 2>&1 \
            || { tail -n 120 /tmp/a218.log; exit 2; }
          grep 'A218_SUMMARY' /tmp/a218.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage12-a218-py${{ matrix.python-version }}
          path: |
            /tmp/a218-physical
            /tmp/a218.log
          retention-days: 30
          if-no-files-found: warn
