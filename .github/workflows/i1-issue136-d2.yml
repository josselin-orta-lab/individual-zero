name: I1 D2 epistemic risk validation
on:
  # Historical research executable by explicit dispatch only.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d2:
    name: D2 120 real mortal births Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Existing lived water M11 and owner invariants
        run: python -m unittest discover -s tests -p 'test_i1_issue136_d1_learning.py' -v
      - name: Execute preregistered D2 physical cohort
        run: python scripts/run_i1_issue136_d2.py --output "i136-d2-py${{ matrix.python-version }}" --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Preserve all mortal WAL journals and source-labeled outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i136-d2-py${{ matrix.python-version }}
          path: i136-d2-py${{ matrix.python-version }}/
          retention-days: 90
          if-no-files-found: warn
