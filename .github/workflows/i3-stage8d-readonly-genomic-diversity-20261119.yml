# Read only all Stage8-C scientific original gzip, then describe G1/G2 genotypes.
# This does not execute native World, motor, birth or experimental allocation.
name: I3 Stage8-D one-shot read-only G1 G2 genome diversity

on:
  push:
    branches: [main]
    paths: ['.github/workflows/i3-stage8d-readonly-genomic-diversity-20261119.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: i3-stage8d-genotype-readonly-once-44320492293
  cancel-in-progress: false

jobs:
  original_bound_genetic_diversity:
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: src
      CUSTODY: /tmp/i3-stage8d-existing-stage8c-originals-readonly
    steps:
      - name: Checkout exact reviewed Stage8-D reducer
        uses: actions/checkout@v4
        with:
          ref: 62b075aaee500b9e48a3eeef7a4a7eddcbdf920a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pure tests and pinned source, no new lives
        run: |
          python -m unittest discover -s tests/i3 -p 'test_stage8d_genomic_diversity_readonly.py' -v
          python - <<'PY'
          import subprocess
          from i3.lab import stage8c_independent_original_audit as A
          from i3.lab import stage8d_genomic_diversity_readonly as D
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          prior_blob=subprocess.check_output(
              ["git","hash-object","src/i3/lab/stage8c_independent_original_audit.py"],
              text=True).strip()
          assert head == "62b075aaee500b9e48a3eeef7a4a7eddcbdf920a"
          assert prior_blob == "e24d0a96af183453256966c9f371b5aba17f5d03"
          assert A.ORIGINAL_HEAD == "a32b7bf50981e0bbaf688e3caf9973525888c05d"
          assert A.ORIGINAL_RUN_ID == 44320492293 and A.LIVES == 32256
          assert D.RUN_ID == 44320492293 and D.PAIRS == 276 and D.POPULATIONS == 32
          assert D.PREVERDICT_AUDITOR == "23d0e3eabff0042123c84f4b292a2e4c72cfcc8f"
          assert not subprocess.check_output(
              ["git","status","--porcelain","--untracked-files=all"]).strip()
          print("STAGE8D_POSTHOC_SOURCE_LOCKED_ZERO_NEW_LIVES")
          PY
          mkdir -p "$CUSTODY"
      - name: Download original Stage8-C scientific PRE-exposure plan
        uses: actions/download-artifact@v4
        with:
          name: stage8c-new-science-preexposure-44320492293
          run-id: 44320492293
          repository: josselin-orta-lab/individual-zero
          github-token: ${{ github.token }}
          path: /tmp/i3-stage8d-existing-stage8c-originals-readonly/plan
      - name: Download ALL 32256 previously born scientific original gzip lives
        uses: actions/download-artifact@v4
        with:
          name: stage8c-new-prospective-original-science-lives-44320492293
          run-id: 44320492293
          repository: josselin-orta-lab/individual-zero
          github-token: ${{ github.token }}
          path: /tmp/i3-stage8d-existing-stage8c-originals-readonly/originals
      - name: Download independently completed pre-verdict Stage8-C original audit
        uses: actions/download-artifact@v4
        with:
          name: stage8c-independent-original-gzip-audit-44320492293
          run-id: 44406977082
          repository: josselin-orta-lab/individual-zero
          github-token: ${{ github.token }}
          path: /tmp/i3-stage8d-existing-stage8c-originals-readonly/previous-audit
      - name: Reverify all original gzip and describe G1 G2 genome diversity, NO World
        run: |
          python -m i3.lab.stage8d_genomic_diversity_readonly \
            "$CUSTODY/plan/SCIENCE_PLAN.json" \
            "$CUSTODY/originals" \
            "$CUSTODY/previous-audit/INDEPENDENT_ORIGINAL_AUDIT.json" \
            > "$CUSTODY/STAGE8D_READONLY_GENOMIC_DIVERSITY.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["CUSTODY"])/
                        "STAGE8D_READONLY_GENOMIC_DIVERSITY.json").read_bytes())
          assert d["status"] == "STAGE8D_POSTHOC_ORIGINAL_BOUND_DESCRIPTIVE_COMPLETE"
          assert d["interpretation"] == "EXPLORATORY_POSTHOC_ASSOCIATIONS_NOT_CONFIRMATORY"
          assert d["scientific_status_unchanged"] == "STAGE8C_G2_SCORE_IDENTITY_ADVANTAGE_F0"
          assert d["native_original_lives_reverified"] == 32256
          assert d["native_mutated_parentage_reconstructed"] == 4608
          assert d["population_units"] == 32
          assert d["genetic_pair_distances_per_population_per_arm"] == 276
          assert len(d["all_32_population_profiles"]) == 32
          assert d["adverse_population_count"] == 10
          assert d["new_lives"] == d["new_worlds"] == 0
          print(json.dumps({k:d[k] for k in (
              "status","population_units","native_original_lives_reverified",
              "G2_S_minus_M_diversity_mean",
              "G2_S_minus_M_diversity_vs_lifetime_Pearson_population_only",
              "adverse_population_ids","new_lives")},sort_keys=True))
          PY
      - name: Preserve all 32 descriptive population profiles, including adverse results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stage8d-existing-originals-genomic-diversity-44320492293
          path: /tmp/i3-stage8d-existing-stage8c-originals-readonly/STAGE8D_READONLY_GENOMIC_DIVERSITY.json
          if-no-files-found: error
          retention-days: 90
