name: I1 canonical vital goal calibration
on:
  push:
    branches: [fix/i1-natural-goal-calibration-20261018]
  pull_request:
    paths:
      - 'src/i1/runtime/i1_natural_runtime.py'
      - 'tests/i1/test_i1_natural_goal_calibration.py'
      - '.github/workflows/i1-natural-goal-calibration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install code
        run: python -m pip install -e .
      - name: Canonical I1 born-goal calibration
        run: python -m unittest discover -s tests/i1 -p test_i1_natural_goal_calibration.py -v
      - name: Natural I1 M11 recovery parity
        run: python -m unittest discover -s tests/i1 -p test_i1_natural_m11_cold_recovery.py -v
      - name: I1/I0 engine isolation
        run: python scripts/check_engine_repository.py --json
      - name: Full I1 suite
        run: python -m unittest discover -s tests/i1 -p 'test_*.py'
