name: I1 A2.35 experimental recall software gate

on:
  pull_request:
    branches: [main, experiment/i1-isolated-model-fork-20261016]
    paths:
      - 'src/i1_overlays/i1_lived_recall.py'
      - 'src/i1_overlays/i1_active_runtime.py'
      - 'tests/test_i1_a235_lived_recall.py'
      - 'tests/test_i1_a235_runtime_birth.py'
      - 'tests/test_i1_a235_physical_witness.py'
      - 'tests/test_i1_a235_m11_recall_contract.py'
      - 'tests/test_i1_a235_m11_cold_recall.py'
      - '.github/workflows/i1-a235-development.yml'
      - 'scripts/run_i1_a236_merged_active.py'
      - 'docs/research/i1-a236-main-integrated-active-prereg-2026-10-16.en.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-a235:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: I1 source and corpus provenance
        run: |
          python -m unittest discover -s tests -p 'test_i1_a235_lived_recall.py' -v
          python -m unittest discover -s tests -p 'test_i1_a235_runtime_birth.py' -v
          python -m unittest discover -s tests -p 'test_i1_a235_physical_witness.py' -v
          python -m unittest discover -s tests -p 'test_i1_a235_m11_recall_contract.py' -v
          python -m unittest discover -s tests -p 'test_i1_a235_m11_cold_recall.py' -v
          python -m unittest discover -s tests -p 'test_i1_generated_isolation.py' -v
          python -m unittest discover -s tests -p 'test_i1_active_birth.py' -v
          python -m unittest discover -s tests -p 'test_i1_m11_cold_recovery.py' -v

  a236-integrated-science:
    name: A2.36 merged-main 144 active mortal I1 lives Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Evaluate 144 mortal I1 births with four explicitly active models
        run: |
          python scripts/run_i1_a236_merged_active.py --output "a236-py${{ matrix.python-version }}" --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Archive individual WALs, source receipts and all negative lives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a236-integrated-main-py${{ matrix.python-version }}
          path: a236-py${{ matrix.python-version }}/
          if-no-files-found: warn
          retention-days: 90
