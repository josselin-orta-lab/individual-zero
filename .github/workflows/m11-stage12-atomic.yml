name: M11 Stage12 atomic current-generation experimental gate

on:
  pull_request:
    branches:
      - exp/stage10-priced-multipass-sleep-20261013
    paths:
      - 'src/lab/m11_transactional_mortal.py'
      - 'src/lab/stage11_sleep_runtime.py'
      - 'src/lab/stage12_runtime.py'
      - 'src/i0/modules/stage12_goal_progress.py'
      - 'tests/test_m11_stage12_atomic_preflight.py'
      - 'tests/test_m11_stage12_hard_crash.py'
      - '.github/workflows/m11-stage12-atomic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m11-stage12-contract:
    name: M11 Stage12 exclusive SQLite contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Execute exact current-generation Stage12 tests
        run: python -m unittest discover -s tests -p 'test_m11_stage12_atomic_preflight.py' -v
      - name: Preserve no unregistered secondary WAL
        run: python -m unittest discover -s tests -p 'test_m11_stage12_compatibility.py' -v
      - name: Regression ordinary Stage12 standalone WAL path
        run: python -m unittest discover -s tests -p 'test_stage12_mortal_runtime.py' -v
      - name: Regression priced index selection
        run: python -m unittest discover -s tests -p 'test_stage10_pending_paid_index.py' -v

  m11-stage12-crash-matrix:
    name: Six real SQLite transaction crashes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Observe real os._exit before and after one atomic SQLite generation
        run: python -m unittest discover -s tests -p 'test_m11_stage12_hard_crash.py' -v
