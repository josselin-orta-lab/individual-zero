name: I1 issue136 water readiness audit

on:
  pull_request:
    branches: [main, experiment/i1-isolated-model-fork-20261016]
    paths:
      - 'tests/test_i1_issue136_water_readiness.py'
      - 'docs/research/i1-issue136-water-d0-prereg-2026-10-16.en.md'
      - '.github/workflows/i1-issue136-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Water acquisition readiness (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Run water-acquisition readiness controls
        run: python -m unittest discover -s tests -p 'test_i1_issue136_water_readiness.py' -v
