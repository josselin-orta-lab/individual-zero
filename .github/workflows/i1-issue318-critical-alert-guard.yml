name: I1 issue318 critical alert research guard
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'src/i1/runtime/i1_natural_runtime.py'
      - 'src/i1/runtime/m11_transactional_mortal.py'
      - 'tests/i1/test_i1_318_critical_alert_guard.py'
      - '.github/workflows/i1-issue318-critical-alert-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: |
          python scripts/build_i1_fork.py --help
          python -m unittest discover -s tests/i1 -p test_i1_318_critical_alert_guard.py -v
