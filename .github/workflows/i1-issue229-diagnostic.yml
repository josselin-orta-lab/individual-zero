name: I1 issue 229 exploratory diagnosis
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/diagnose_i1_issue229.py'
      - '.github/workflows/i1-issue229-diagnostic.yml'
      - 'src/i1_overlays/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Syntax validation
        run: python -m compileall -q scripts/diagnose_i1_issue229.py
      - name: Born-life exploratory diagnosis
        run: python scripts/diagnose_i1_issue229.py --output artifacts/i1-229-diagnostic
      - name: Retain diagnostic and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1-229-diagnostic-py${{ matrix.python-version }}
          path: artifacts/i1-229-diagnostic/
          if-no-files-found: warn
          retention-days: 90
