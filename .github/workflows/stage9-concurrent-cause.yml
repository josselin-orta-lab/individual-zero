name: Stage9 lived confound regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/i0/modules/causal_model.py'
      - 'src/lab/stage9_runtime.py'
      - 'src/lab/stage9_issue89_campaign.py'
      - 'tests/test_stage9_concurrent_cause_audit.py'
      - 'tests/test_stage9_lived_evidence.py'
      - '.github/workflows/stage9-concurrent-cause.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage9-confound-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  epistemic-physics:
    name: Real-physics confounds (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install individual-zero
        run: python -m pip install -e .
      - name: Execute independent causal contrasts
        run: |
          python -m unittest discover -s tests -p 'test_stage9_concurrent_cause_audit.py' -v
          python -m unittest discover -s tests -p 'test_stage9_lived_*py' -v
      - name: Execute complete Stage9 and epistemic-boundary regressions
        run: |
          python -m unittest discover -s tests -p 'test_stage9*.py' -v
          python -m unittest tests.test_epistemic_journal_isolation -v
          python -m unittest tests.test_independent_journal_audit -v
          python -m unittest tests.test_bench_no_cognitive_imports -v
      - name: Execute 600-step contrastive development campaign
        run: |
          python -m lab.stage9_issue89_campaign > issue89-campaign-${{ matrix.python-version }}.json
          python -c "import json; p=json.load(open('issue89-campaign-${{ matrix.python-version }}.json')); assert p['physical_steps'] == 600; assert p['false_positive_promotions'] == 0; assert p['promotions'] == 0; assert p['withheld_true_toxic'] > 0; assert p['deaths'] == 0; print(json.dumps(p, sort_keys=True))"
      - name: Preserve campaign evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue89-campaign-python-${{ matrix.python-version }}
          path: issue89-campaign-${{ matrix.python-version }}.json
