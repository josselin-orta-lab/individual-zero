name: I1 A2-R full-vector Q replay (pure no-birth)
on:
  pull_request:
    paths:
      - 'tools/research/i1_a2r_q_replay.py'
      - 'tests/research/a2r/test_i1_a2r_q_replay.py'
      - 'docs/research/audits/I1_ECO_A2R_Q_REPLAY_CONTRACT_2026-10-30.md'
      - '.github/workflows/i1-a2r-q-replay-l1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: i1-a2r-q-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pure_replay:
    name: A2-R pure replay Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: tools/research
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pure twelve-feature TD/Q contracts only
        run: |
          python -m py_compile tools/research/i1_a2r_q_replay.py
          python -m unittest discover -s tests/research/a2r -p test_i1_a2r_q_replay.py -v
      - name: Prevent accidental natural cohort work
        run: test ! -d reports/i1-eco-a2r-cohort
