name: I3 P5b score witness preflight DEVELOPMENT only
on:
  push:
    branches: [automation/i3-p5b-score-witness-preflight-20261106]
    paths: [.github/workflows/i3-p5b-score-witness-preflight.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 589b9b64c04e0526d89eef4a34141bf852286bc2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test I3 and engine isolation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/i3 -p 'test_*.py' -q
          python scripts/check_engine_repository.py --json
      - name: Reproduce paired paid-score witness from development worlds only
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m i3.lab.p5b_development_diagnostic --run-development > "$RUNNER_TEMP/p5b.json"
          python - <<'PY'
          import json,os
          d=json.load(open(os.environ["RUNNER_TEMP"]+"/p5b.json"))
          assert d["validation"]=="NOT_OPENED" and d["reserve"]=="LOCKED"
          assert len(d["lives"])==84
          for mode, cases in d["first_paired_action_divergence"].items():
              assert len(cases)==12
              for field in ("first_action_divergence_step",
                            "first_scored_option_difference_step",
                            "first_shared_option_score_difference_with_same_body_step"):
                  values=[x[field] for x in cases if x[field] is not None]
                  assert all(1<=v<=120 for v in values)
                  print("DEV",mode,field,len(values),min(values) if values else None)
          PY
      - name: Verify original P4 and P5a original studies unchanged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,hashlib
          from pathlib import Path
          root=Path("src/i3/docs/studies")
          for path,expected in (
            ("p4a-g2-heldout/validation-full.json.gz","44adb1192d1aea87cf5d96a547f794de6f7fe33a566a5de90747a34429e8e8d6"),
            ("p4b-paid-outcome-learning/learning-full.json.gz","688463e4fbb71cb88d57d0cafbe70eb033adeafe8ae8551d42bec58dfa9e395c"),
            ("p5a-paid-component-screen/mechanisms-full.json.gz","21719dcc89f83f3984ccc32b3d203d2152ff8c7dd8c2c8a76318ce84d60113d8")):
              assert hashlib.sha256(gzip.decompress((root/path).read_bytes())).hexdigest()==expected
          PY
