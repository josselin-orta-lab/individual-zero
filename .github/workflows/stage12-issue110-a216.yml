name: Stage12 Issue110 A2.16 lived unknown cue audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit_stage12_issue110_a216_unknown_cues.py'
      - 'docs/research/stage12-issue110-a216-unknown-first-person-cues-prereg-2026-10-14.fr.md'
      - 'docs/research/stage12-issue110-a216-unknown-first-person-cues-results-2026-10-14.fr.md'
      - '.github/workflows/stage12-issue110-a216.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  lived-unknown-cues:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          run-id: 38607070724
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: stage12-a210b-py${{ matrix.python-version }}
          path: /tmp/a216-original-lives
      - name: Independent first-person suspended judgement audit
        run: |
          python scripts/audit_stage12_issue110_a216_unknown_cues.py \
            --input-dir /tmp/a216-original-lives/a210b-lives \
            --output /tmp/a216-unknown-cues.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage12-a216-py${{ matrix.python-version }}
          path: /tmp/a216-unknown-cues.json
          retention-days: 30
          if-no-files-found: warn
