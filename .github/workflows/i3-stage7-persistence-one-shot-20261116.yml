# Prospective inherited persistence study; no old Stage6 root may be replayed.
# Frozen methodology: src/i3/docs/studies/stage7-persistence/STAGE7_PERSISTENCE_PROTOCOL_2026-11-16.md
name: I3 Stage7 one-shot inherited persistence G0/G1/G2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/i3-stage7-persistence-one-shot-20261116.yml']

permissions:
  contents: read

concurrency:
  group: i3-stage7-persistence-once-20261116
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.run_attempt == 1 && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen Stage7 metric, failed proof, and ancestral controls (NO LIFE)
        run: |
          python -m unittest discover -s tests/i3 -p 'test_stage7_persistence_*.py' -v
          python - <<'PY'
          from i3.lab import stage7_persistence_transport as P
          from i3.runtime.provenance import source_snapshot
          import subprocess, os
          assert P.G0._pins()
          source = source_snapshot()
          assert source["git_head"] == os.environ["GITHUB_SHA"]
          assert source["working_tree_dirty"] is False
          assert source["sha256"]
          assert not subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=all"]
          ).strip()
          assert P.FIXED_METHOD["primary_sign_threshold"] == 13
          print("STAGE7_EXACT_SOURCE_AND_PRECOMMITTED_ONE_SIDED_PERSISTENCE_PASS")
          PY

  engineering:
    if: ${{ github.run_attempt == 1 }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: src
      CUSTODY: /tmp/i3-stage7-engineering-${{ matrix.python-version }}
      PYVERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Mint fresh source-specific engineering seeds, NO WORLD
        run: |
          mkdir -p "$CUSTODY"
          SOURCE=$(python -c 'from i3.runtime.provenance import source_snapshot; print(source_snapshot()["sha256"])')
          python -m i3.lab.stage7_persistence_transport allocate "$GITHUB_SHA" "$SOURCE" "$CUSTODY/PLAN.json" "$CUSTODY/originals"
          python -m i3.lab.stage7_persistence_transport verify "$CUSTODY/PLAN.json"
      - name: Publish engineering pre-exposure plan before ANY native life
        uses: actions/upload-artifact@v4
        with:
          name: stage7-engineering-plan-${{ matrix.python-version }}-${{ github.run_id }}
          path: /tmp/i3-stage7-engineering-${{ matrix.python-version }}/PLAN.json
          if-no-files-found: error
          retention-days: 90
      - name: Run complete native G0-SELECT-G1-SELECT-G2 and sealed blind R ONCE
        run: |
          PLAN_SHA=$(python -c 'import json,os; print(json.load(open(os.environ["CUSTODY"]+"/PLAN.json"))["allocation_sha256"])')
          python -m i3.lab.stage7_persistence_transport run-engineering "$CUSTODY/PLAN.json" "$CUSTODY/originals" "$PLAN_SHA" > "$CUSTODY/CORE.json"
      - name: Verify 11,520 originals, three seals and all nine phases
        run: |
          python -m i3.lab.stage7_persistence_transport rehearsal-receipt "$CUSTODY/PLAN.json" "$CUSTODY/originals" "$CUSTODY/CORE.json" "$CUSTODY/REHEARSAL_RECEIPT.json" "$PYVERSION" "$GITHUB_RUN_ID"
      - name: Publish source-exact sealed technical PASS receipt
        uses: actions/upload-artifact@v4
        with:
          name: stage7-engineering-receipt-${{ matrix.python-version }}-${{ github.run_id }}
          path: /tmp/i3-stage7-engineering-${{ matrix.python-version }}/REHEARSAL_RECEIPT.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve all engineering original traces, deaths and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-engineering-originals-${{ matrix.python-version }}-${{ github.run_id }}
          path: /tmp/i3-stage7-engineering-${{ matrix.python-version }}/originals
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90

  science:
    if: ${{ github.run_attempt == 1 }}
    needs: engineering
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: src
      CUSTODY: /tmp/i3-stage7-prospective-science
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare science custody OUTSIDE source
        run: mkdir -p "$CUSTODY"
      - name: Download exact-source 3.11 full engineering receipt
        uses: actions/download-artifact@v4
        with:
          name: stage7-engineering-receipt-3.11-${{ github.run_id }}
          path: /tmp/i3-stage7-prospective-science/receipts/311
      - name: Download exact-source 3.12 full engineering receipt
        uses: actions/download-artifact@v4
        with:
          name: stage7-engineering-receipt-3.12-${{ github.run_id }}
          path: /tmp/i3-stage7-prospective-science/receipts/312
      - name: Admit only two complete NEW Stage7 rehearsals before ANY birth
        run: |
          python -m i3.lab.stage7_persistence_transport combine "$CUSTODY/receipts/311/REHEARSAL_RECEIPT.json" "$CUSTODY/receipts/312/REHEARSAL_RECEIPT.json" "$CUSTODY/REHEARSALS.json"
          SOURCE=$(python -c 'from i3.runtime.provenance import source_snapshot; print(source_snapshot()["sha256"])')
          python -m i3.lab.stage7_persistence_transport allocate-science "$GITHUB_SHA" "$SOURCE" "$CUSTODY/SCIENCE_PLAN.json" "$CUSTODY/originals" "$CUSTODY/REHEARSALS.json"
          python -m i3.lab.stage7_persistence_transport verify "$CUSTODY/SCIENCE_PLAN.json"
      - name: Publish FROZEN 16-population persistence estimand and seeds before births
        uses: actions/upload-artifact@v4
        with:
          name: stage7-persistence-science-preexposure-${{ github.run_id }}
          path: |
            /tmp/i3-stage7-prospective-science/SCIENCE_PLAN.json
            /tmp/i3-stage7-prospective-science/REHEARSALS.json
          if-no-files-found: error
          retention-days: 90
      - name: Execute separate source-exact G0 G1 G2 persistence cohort ONCE
        run: |
          PLAN_SHA=$(python -c 'import json,os; print(json.load(open(os.environ["CUSTODY"]+"/SCIENCE_PLAN.json"))["allocation_sha256"])')
          python -m i3.lab.stage7_persistence_transport run-science "$CUSTODY/SCIENCE_PLAN.json" "$CUSTODY/originals" "$PLAN_SHA" > "$CUSTODY/SCIENCE_CORE.json"
      - name: Verify all native originals and reduce 16 independent populations
        run: |
          python -m i3.lab.stage7_persistence_transport science-receipt "$CUSTODY/SCIENCE_PLAN.json" "$CUSTODY/originals" "$CUSTODY/SCIENCE_CORE.json" "$CUSTODY/SCIENCE_RESULT.json"
      - name: Publish negative, positive, zero and exploratory cross-generation results
        uses: actions/upload-artifact@v4
        with:
          name: stage7-persistence-result-${{ github.run_id }}
          path: |
            /tmp/i3-stage7-prospective-science/SCIENCE_RESULT.json
            /tmp/i3-stage7-prospective-science/originals/R_FINAL_PERSISTENCE_SCIENCE.json
            /tmp/i3-stage7-prospective-science/originals/PHASES.jsonl
          if-no-files-found: error
          retention-days: 90
      - name: Preserve all scientific death, censored, and failure originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-persistence-originals-${{ github.run_id }}
          path: /tmp/i3-stage7-prospective-science/originals
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
