name: I1 geographic stable identity regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/i1/modules/geographic_planning.py'
      - 'src/i1/modules/geographic_exploration.py'
      - 'src/i1/modules/stage11_evaluator.py'
      - 'tests/i1/test_i1_330_geographic_identity.py'
      - '.github/workflows/i1-330-geographic-identity.yml'
permissions:
  contents: read
jobs:
  geographic-identity:
    name: Geographic identity (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Same-hop identity and perceptual freshness
        run: python -m unittest discover -s tests/i1 -p test_i1_330_geographic_identity.py -v
