name: I1 manual preset world laboratory
on:
  workflow_dispatch:
    inputs:
      world:
        description: Registered I1 world
        required: true
        type: choice
        options: [oasis, foraging, dry-valley, empty-land, hazard-edge, blocked-route]
        default: oasis
      seed:
        description: Reproducible birth identity seed (0..4294967295)
        required: true
        default: "246"
        type: string
      steps:
        description: Maximum world steps per life (1..300)
        required: true
        default: "24"
        type: string
      lives:
        description: Independent newborn individuals (1..3)
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3"]
      custody:
        description: Durability mode
        required: true
        default: wal
        type: choice
        options: [wal, m11]
permissions:
  contents: read
concurrency:
  group: i1-world-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  run-world:
    name: Natural I1 / ${{ inputs.world }} / ${{ inputs.custody }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install current model
        run: python -m pip install -e .
      - name: Validate engine and world catalog
        run: |
          python scripts/check_engine_repository.py --json
          python scripts/check_engine_contracts.py --json
          python tools/run_i1_world_preset.py --list
          python tools/run_i1_world_preset.py --preset "${{ inputs.world }}" --validate-only
      - name: Run autonomous mortal world with durable evidence
        env:
          PRESET: ${{ inputs.world }}
          SEED: ${{ inputs.seed }}
          STEPS: ${{ inputs.steps }}
          LIVES: ${{ inputs.lives }}
          CUSTODY: ${{ inputs.custody }}
        run: |
          python tools/run_i1_world_preset.py --preset "$PRESET" --seed "$SEED" --steps "$STEPS" --lives "$LIVES" --custody "$CUSTODY" --output-dir reports/preset-world
      - name: Archive execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1-preset-world-${{ github.run_id }}
          path: reports/preset-world/
          if-no-files-found: warn
          retention-days: 14
