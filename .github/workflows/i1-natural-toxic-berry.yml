name: I1 toxic berry natural physics
on:
  push:
    branches: [fix/i1-natural-toxic-berry-10-20261018]
  pull_request:
    paths:
      - 'src/i1/runtime/i1_natural_sleep.py'
      - 'tests/i1/test_i1_natural_toxic_berry.py'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests/i1 -p test_i1_natural_toxic_berry.py -v
      - run: python scripts/check_engine_repository.py --json
      - run: python -m unittest discover -s tests/i1 -p test_i1_natural_goal_calibration.py -v
