# F1L development fixtures ONLY. No L01..L32, no scientific source release.
name: I3 Stage8-F1L DEV_ONLY native memory-content smoke

on:
  pull_request:
    paths:
      - 'tools/stage8f1l_paid_content_body_value_dev.py'
      - 'tools/stage8f1l_one_shot_reservation.py'
      - 'tools/stage8f1l_scientific_native.py'
      - 'tools/stage8f1l_one_shot_evidence.py'
      - 'tools/stage8f1l_independent_scientific_cold.py'
      - 'tools/stage8f1l_one_shot_cold_entry.py'
      - 'tools/stage8f1l_one_shot_publish_status.py'
      - 'tests/i3/test_stage8f1l_one_shot_safety.py'
      - '.github/workflows/i3-stage8f1l-heldout-science-manual-once.yml'
      - 'tests/i3/test_stage8f1l_dev_content_value.py'
      - 'tools/stage8f1l_independent_paid_content_cold_audit.py'
      - 'tests/i3/test_stage8f1l_cold_dev_only.py'
      - '.github/workflows/i3-stage8f1l-dev-only.yml'
  workflow_dispatch:
    inputs:
      full_dev_t60:
        description: Produce additional DEV_L 8-root T60 technical rehearsal only
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  f1l_native_dev_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: 'src:.'
      I3_F1L_DEV_CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original P1.3, F1J, preregistration and DEV-only security gates
        run: python -m unittest discover -s tests/i3 -p 'test_stage8f1l_dev_content_value.py' -v
      - name: Native DEV_ONLY two-root proof, no scientific conclusion
        run: |
          set -euo pipefail
          python -m tools.stage8f1l_paid_content_body_value_dev --smoke --output "$RUNNER_TEMP/F1L_DEV_SMOKE_NATIVE.json"
          gzip -n -9 "$RUNNER_TEMP/F1L_DEV_SMOKE_NATIVE.json"
          sha256sum "$RUNNER_TEMP/F1L_DEV_SMOKE_NATIVE.json.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: f1l-DEV_ONLY-native-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/F1L_DEV_SMOKE_NATIVE.json.gz
          if-no-files-found: error
          retention-days: 30

  f1l_full_dev_t60:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.full_dev_t60 == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONPATH: 'src:.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native full DEV_L T60, explicitly non-scientific
        run: |
          set -euo pipefail
          python -m tools.stage8f1l_paid_content_body_value_dev --full-rehearsal --output "$RUNNER_TEMP/F1L_DEV_T60_NATIVE.json"
          gzip -n -9 "$RUNNER_TEMP/F1L_DEV_T60_NATIVE.json"
          sha256sum "$RUNNER_TEMP/F1L_DEV_T60_NATIVE.json.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: f1l-DEV_ONLY-t60-${{ github.run_id }}
          path: ${{ runner.temp }}/F1L_DEV_T60_NATIVE.json.gz
          if-no-files-found: error
          retention-days: 30

  f1l_independent_python312_cold:
    needs: [f1l_native_dev_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: f1l-DEV_ONLY-native-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/f1l-native
      - name: Engine-free reconstruction of native memory, paid rounds and body
        env:
          I3_F1L_COLD_INPUT: ${{ runner.temp }}/f1l-native/F1L_DEV_SMOKE_NATIVE.json.gz
        run: |
          set -euo pipefail
          python -m tools.stage8f1l_independent_paid_content_cold_audit --input "$I3_F1L_COLD_INPUT" --output "$RUNNER_TEMP/F1L_DEV_COLD.json"
          python -m unittest discover -s tests/i3 -p 'test_stage8f1l_cold_dev_only.py' -v
          sha256sum "$RUNNER_TEMP/F1L_DEV_COLD.json"
      - uses: actions/upload-artifact@v4
        with:
          name: f1l-DEV_ONLY-independent-cold-${{ github.run_id }}
          path: ${{ runner.temp }}/F1L_DEV_COLD.json
          if-no-files-found: error
          retention-days: 30

  f1l_full_t60_independent_python312_cold:
    needs: [f1l_full_dev_t60]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: f1l-DEV_ONLY-t60-${{ github.run_id }}
          path: ${{ runner.temp }}/f1l-native-t60
      - name: Cold audit of all eight distinct DEV_L roots at T60
        env:
          I3_F1L_COLD_INPUT: ${{ runner.temp }}/f1l-native-t60/F1L_DEV_T60_NATIVE.json.gz
        run: |
          set -euo pipefail
          # All six adversarial tests run against the 2-root original in
          # f1l_independent_python312_cold. The 8-root T60 cold reconstructs
          # every native step ONCE to avoid redundant heavy T60 reaudits.
          python -m tools.stage8f1l_independent_paid_content_cold_audit --input "$I3_F1L_COLD_INPUT" --output "$RUNNER_TEMP/F1L_DEV_T60_COLD.json"
          sha256sum "$RUNNER_TEMP/F1L_DEV_T60_COLD.json"
      - uses: actions/upload-artifact@v4
        with:
          name: f1l-DEV_ONLY-t60-independent-cold-${{ github.run_id }}
          path: ${{ runner.temp }}/F1L_DEV_T60_COLD.json
          if-no-files-found: error
          retention-days: 30
