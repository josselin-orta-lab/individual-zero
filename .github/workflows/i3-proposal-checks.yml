name: I3 proposal software checks

on:
  pull_request:
    # Keep the same software checks on generation-owned stacked PRs.
    branches: [main, 'i3/**']
    paths:
      - 'src/i3/**/*.py'
      - 'src/i3/engine.json'
      - 'src/i3/ACTIVE_SURFACE.json'
      - 'tests/i3/**'
      - 'src/i3/docs/studies/stage2-replay-gate-selected-design/ENGINEERING_B1_PLAN.json'
      - 'scripts/check_engine_repository.py'
      - 'tests/test_engine_repository.py'
      - '.github/workflows/i3-proposal-checks.yml'

  push:
    branches: [main]
    # The single frozen archival trigger is deliberately never modified again.
    paths:
      - 'src/i3/docs/studies/stage2-replay-gate-selected-design/B1_ARCHIVE_ONCE.json'
      - 'src/i3/docs/studies/stage2-replay-gate-selected-design/THREE_ARM_LAUNCH_ONCE.json'
      - 'src/i3/docs/studies/stage2-replay-gate-selected-design/CONTENT_48_LAUNCH_ONCE.json'
      - 'src/i3/docs/studies/stage2-replay-gate-selected-design/WATER_DIVERGENCE_24_LAUNCH_ONCE.json'

permissions:
  contents: read

concurrency:
  # Never cancel an irreversible source-claimed scientific main push because
  # a separate push or PR arrived while its original lives were running.
  group: i3-proposal-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  software:
    if: github.event_name == 'pull_request'
    name: I3 software (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact candidate, including history for generation guards
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify engine contracts and immutable generation ownership
        run: |
          python scripts/check_engine_contracts.py --json
          python scripts/check_engine_repository.py --json
          python -m unittest discover -s tests -p test_engine_repository.py -v
      - name: Run I3 software tests, not scientific study entrypoints
        run: python -m unittest discover -s tests/i3 -p 'test_*.py' -v
      - name: Check current navigation
        if: matrix.python-version == '3.11'
        run: python tools/check_repo_navigation.py --scope entrypoints

  b1-engineering:
    # Keep expensive engineering replay separate from normal I3 software
    # tests, only for explicitly named B1 survival-development branches.
    if: startsWith(github.head_ref, 'research/i3-survival-')
    name: I3 B1 G/R engineering (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: src
      PLAN: src/i3/docs/studies/stage2-replay-gate-selected-design/ENGINEERING_B1_PLAN.json
    steps:
      - name: Checkout exact survival candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify engineering plan has zero scientific allocation
        run: |
          python - <<'PY'
          import json, os
          with open(os.environ["PLAN"]) as stream:
              p = json.load(stream)
          assert p["protocol_id"] == "I3_SURVIVAL_B1_NON_EVIDENTIARY_ENGINEERING_SMOKE"
          assert p["scientific"]["indices"] == []
          assert p["scientific"]["genome_seeds"] == []
          assert p["engineering"]["cohort"] == "engineering"
          assert p["arms"] == ["reference", "p13_replay_gate_v1"]
          assert len(p["engineering"]["indices"]) == 4
          assert len(p["engineering"]["genome_seeds"]) == 1
          assert p["no_engineering_outcomes_publish"] is True
          PY
      - name: Execute pure synthetic exact paired power campaign
        run: |
          python -m unittest discover -s tests/i3 -p 'test_stage2_exact_paired_survival.py' -v
          python -m i3.lab.stage2_exact_paired_survival > "$RUNNER_TEMP/b1-power-synthetic.json"
          python - "$RUNNER_TEMP/b1-power-synthetic.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              data = json.load(stream)
          assert data["conditions"] == "PURE_SYNTHETIC_IID_PAIRED_SURVIVAL_DRAWS"
          assert data["no_actual_survival_data_read"]
          assert len(data["simulated_cells"]) == 16
          assert all(c["scientific_lives"] == 0 and c["worlds_opened"] == 0
                     and c["scientific_verdict"] == "NOT_ISSUED"
                     for c in data["simulated_cells"])
          print("B1_SYNTHETIC_CALIBRATION_16_SCENARIOS_COMPLETE")
          PY
      - name: Run sealed G/R against 24 temporary engineering lives
        run: |
          python -m i3.lab.stage2_panel rehearse "$PLAN" > "$RUNNER_TEMP/b1-engineering-structure.json"
          python - "$RUNNER_TEMP/b1-engineering-structure.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              report = json.load(stream)
          allowed = {
              "schema", "planned", "phase_G", "generated", "generation_failure",
              "phase_R", "reduced", "reduction_failure", "invariant_failures",
              "manifest_sha256", "mean_step_ms", "status", "runner",
              "protocol_id", "transport_fingerprint", "plan_sha256", "namespace",
          }
          assert set(report) <= allowed, "non-structural engineering data cannot leave G/R"
          # Only preallowed structural fields can appear in CI logs.
          print(json.dumps(report, sort_keys=True))
          assert report["status"] == "PASS", "engineering G/R FAIL, not a scientific death"
          assert report["planned"] == report["generated"] == report["reduced"] == 24
          assert report["phase_G"] == "GENERATED" and report["phase_R"] == "COMPLETE"
          assert report["namespace"] == "engineering"
          assert report["generation_failure"] is None
          assert report["reduction_failure"] is None
          assert report["invariant_failures"] and not any(report["invariant_failures"].values())
          print("B1_ENGINEERING_STRUCTURAL_PASS_24_OF_24_NO_SCIENTIFIC_WORLD")
          PY
      - name: Archive allowlisted structural and synthetic data only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: i3-b1-non-evidentiary-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/b1-engineering-structure.json
            ${{ runner.temp }}/b1-power-synthetic.json
          if-no-files-found: error
          retention-days: 30


  b1-sampling-preflight:
    # Pure future allocation *metadata*, not World generation or approval.
    if: startsWith(github.head_ref, 'research/i3-survival-b1-')
    name: I3 B1 prospective sample dry-run (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout the exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove metadata only and reject prospectively tampered pairs
        run: |
          python -m unittest discover -s tests/i3 -p 'test_stage2_survival_b1_sampling.py' -v
          python -m i3.lab.stage2_survival_b1_sampling > "$RUNNER_TEMP/b1-sampling-preview-structure.json"
          python - "$RUNNER_TEMP/b1-sampling-preview-structure.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              s = json.load(stream)
          assert s["status"] == "DRY_RUN_ALLOCATION_ONLY_NO_WORLD_EXPOSURE"
          assert s["pair_count"] == 1500
          assert s["maximum_proposed_lives"] == 3000
          assert s["maximum_horizon_steps"] == 1200000
          assert sum(s["family_counts"].values()) == 1500
          assert s["world_instances_created"] == 0
          assert s["individual_lives_executed"] == 0
          assert s["independent_iid_world_pairs_verified"] is False
          assert s["witness_is_authorized_for_scientific_births"] is False
          assert s["scientific_verdict"] == "NOT_ISSUED"
          assert set(s) == {
              "schema", "status", "witness_sha256", "pair_count",
              "family_counts", "maximum_proposed_lives", "maximum_horizon_steps",
              "allocation_sha256", "world_instances_created",
              "individual_lives_executed", "scientific_verdict",
              "independent_iid_world_pairs_verified",
              "witness_is_authorized_for_scientific_births",
          }
          print("B1_PROPOSED_1500_PAIR_METADATA_ONLY_NO_WORLD_PASS")
          PY
      - name: Archive the synthetic structural metadata digest only
        uses: actions/upload-artifact@v4
        with:
          name: i3-b1-prospective-sample-dryrun
          path: ${{ runner.temp }}/b1-sampling-preview-structure.json
          if-no-files-found: error
          retention-days: 30


  b1-worldspec-preflight:
    # NON-EVIDENTIARY: create/validate only synthetic WorldSpecs,
    # never a Mind, life, World step or scientific original archive.
    if: startsWith(github.head_ref, 'research/i3-survival-b1-worldspec-')
    name: I3 B1 WorldSpec structural preflight (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact synthetic WorldSpec candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify frozen P2 parity and duplicate-name-independent worlds
        run: |
          python -m unittest discover -s tests/i3 -p 'test_stage2_survival_b1_worldspec_audit.py' -v
          python -m i3.lab.stage2_survival_b1_worldspec_audit > "$RUNNER_TEMP/b1-synthetic-worldspec-audit.json"
          python - "$RUNNER_TEMP/b1-synthetic-worldspec-audit.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              r = json.load(stream)
          assert r["status"] == "SYNTHETIC_SPEC_PREFLIGHT_NOT_PROSPECTIVE_AUTHORITY"
          assert r["worldspec_structures_generated"] == 1500
          assert r["structural_world_validations"] == 1500
          assert r["unique_full_worldspec_digests"] == 1500
          assert r["unique_name_independent_worldspec_digests"] == 1500
          assert sum(r["ecological_families"].values()) == 1500
          assert r["worlds_stepped"] == r["scientific_lives_executed"] == 0
          assert r["originals_written"] == 0
          assert r["independent_world_sampling_verified"] is False
          assert r["target_ecology_superpopulation_verified"] is False
          assert r["scientific_margin_approved"] is False
          assert r["external_witness_and_owner_admission"] is False
          assert r["scientific_verdict"] == "NOT_ISSUED"
          assert len(r["aggregate_worldspec_digest_sha256"]) == 64
          assert set(r) == {
              "schema", "status", "public_synthetic_allocation_sha256",
              "aggregate_worldspec_digest_sha256", "worldspec_structures_generated",
              "structural_world_validations", "unique_full_worldspec_digests",
              "unique_name_independent_worldspec_digests", "ecological_families",
              "worlds_stepped", "scientific_lives_executed", "originals_written",
              "independent_world_sampling_verified",
              "target_ecology_superpopulation_verified", "scientific_margin_approved",
              "external_witness_and_owner_admission", "scientific_verdict",
          }, "unexpected nonstructural audit field"
          print("B1_SYNTHETIC_WORLDSPEC_1500_PARITY_AND_COLLISION_PASS")
          PY
      - name: Upload synthetic structural SHA/counts only
        uses: actions/upload-artifact@v4
        with:
          name: i3-b1-synthetic-worldspecs-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/b1-synthetic-worldspec-audit.json
          if-no-files-found: error
          retention-days: 30


  b1-newworld-paired-gr:
    # Real new-world ENGINEERING actions and G/R receipt sealing only.
    # This is not an inferential study or access to scientific cohorts.
    if: startsWith(github.head_ref, 'research/i3-survival-b1-newworld-')
    name: I3 B1 96-pair new-world engineering G/R (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact prospective transport source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check paired source admission and fail-closed science
        run: |
          python -m unittest discover -s tests/i3 -p 'test_stage2_survival_b1_engineering.py' -v
      - name: Launch 192 new-world technical lives through sealed G/R
        run: |
          python -m i3.lab.stage2_survival_b1_engineering rehearse > "$RUNNER_TEMP/b1-newworld-gr-structural.json"
          python - "$RUNNER_TEMP/b1-newworld-gr-structural.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              r = json.load(stream)
          allowed = {
              "schema", "planned", "phase_G", "generated", "generation_failure",
              "phase_R", "reduced", "reduction_failure", "invariant_failures",
              "manifest_sha256", "mean_step_ms", "status", "runner",
              "source_fingerprint", "protocol_id", "cohort", "pair_count",
              "unique_worlds_expected", "public_root_synthetic",
              "world_source_external_attestation", "observed_survival_results_published",
              "independent_pairs_proven", "scientific_lives", "scientific_admission",
              "scientific_verdict"
          }
          assert set(r) <= allowed, "unexpected engineering life field in public report"
          # Structural-only receipt is printed even if G/R has a failure.
          print(json.dumps(r, sort_keys=True))
          assert r["cohort"] == "engineering"
          assert r["pair_count"] == r["unique_worlds_expected"] == 96
          assert r["public_root_synthetic"] is True
          assert r["world_source_external_attestation"] is False
          assert r["observed_survival_results_published"] is False
          assert r["independent_pairs_proven"] is False
          assert r["scientific_lives"] == 0
          assert r["scientific_admission"] == "BLOCKED"
          assert r["scientific_verdict"] == "NOT_ISSUED"
          assert r["status"] == "PASS", "new-world G/R engineering failure, NOT a death"
          assert r["planned"] == r["generated"] == r["reduced"] == 192
          assert r["phase_G"] == "GENERATED"
          assert r["phase_R"] == "COMPLETE"
          assert r["generation_failure"] is None
          assert r["reduction_failure"] is None
          assert r["invariant_failures"] and not any(r["invariant_failures"].values())
          print("B1_NEW_WORLDS_FIXED_FIRST_96_PAIRS_ENGINEERING_PASS_192_LIVES")
          PY
      - name: Upload structural-only temporary engineering receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i3-b1-newworld-gr-structure-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/b1-newworld-gr-structural.json
          if-no-files-found: warn
          retention-days: 30


  b1-exploratory-development:
    # New, outcome-retaining DEVELOPMENT experiment ONLY. Never validation,
    # selection, reserve or the exhausted 80/81. Single GitHub run attempt.
    if: startsWith(github.head_ref, 'research/i3-b1-development-')
    name: I3 B1 96-pair prospective exploratory DEVELOPMENT (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact new B1 source with no credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject reruns and verify prospective allocation, guarded tickets and analysis
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          python -m unittest discover -s tests/i3 -p 'test_stage2_b1_development.py' -v
      - name: Execute first and only B1 96-pair DEVELOPMENT original G then R
        run: |
          mkdir -p "$RUNNER_TEMP/b1-development-archive"
          python -m i3.lab.stage2_b1_development execute "$RUNNER_TEMP/b1-development-archive" > "$RUNNER_TEMP/b1-development-console.json"
          python - "$RUNNER_TEMP/b1-development-archive/B1_EXECUTION_REPORT.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              report = json.load(stream)
          assert report["status"] == "COMPLETE_EXPLORATORY_DEVELOPMENT"
          assert report["planned"] == report["generated"] == report["reduced"] == 192
          assert report["scientific_verdict"] == "NOT_ISSUED"
          assert report["analysis"]["scientific_decision"] == "EXPLORATORY_ONLY_NOT_CONFIRMATORY"
          print(json.dumps(report["analysis"], sort_keys=True))
          PY
      - name: Retain original sealed lives and non-favorable failures, even if G/R fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i3-b1-development-originals-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/b1-development-archive/
            ${{ runner.temp }}/b1-development-console.json
          if-no-files-found: warn
          retention-days: 90


  b1-original-custody:
    # Run only on trusted merged main, never on untrusted PR code or a rerun.
    # Do NOT replay any life; retrieve the immutable existing Actions original.
    # B1 original archive completed in run #42775154043; NEVER rerun.
    if: false
    name: Archive sealed B1 originals once, without World exposure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_BRANCH: evidence/i3-b1-96pair-development-20261110-originals
      ZIP_SHA256: 2aff70fff077be04042379355cda8c798ed9ec81745413563bc88e4320615361
      MANIFEST_SHA256: 5a173d1ad2a7ea3980cb27f79fada44d4e9f7855af63d08a21d118acce21da9a
      EXECUTION_SHA: 713d4621d28ed668bf5f5a37f2d105a38d19fb57
      ORIGINAL_FINGERPRINT: 3a533ebcf8657716bcd759aaa0c0ec1c694aed82862abeb1eb175b593cd8ede3
      PLAN_SHA: 37bee5deeb75e7e4ab481f3019b63c54b9d6f8bdabba6f7bb1de135e62f021dc
      EVIDENCE_DIR: archive/i3/stage2-b1-development-2026-11-10
    steps:
      - name: Checkout trusted merged main without experimental execution
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Fail closed if custody was already attempted on a branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/main"
          if git ls-remote --heads origin "$ARCHIVE_BRANCH" | grep -q .; then
            echo "B1 evidence branch already exists; no overwriting or replacement."
            exit 2
          fi
          test ! -e "$EVIDENCE_DIR"
      - name: Download exactly the existing original artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b1-evidence"
          curl -fLSs --retry 2 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/josselin-orta-lab/individual-zero/actions/artifacts/13725454291/zip" \
            --output "$RUNNER_TEMP/b1-evidence/original.zip"
          printf "%s  %s\n" "$ZIP_SHA256" "$RUNNER_TEMP/b1-evidence/original.zip" | sha256sum --check --status
      - name: Verify all original gzip bytes, identities, terminal events and complete pairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          from hashlib import sha256
          from pathlib import Path
          import gzip, json, os
          from zipfile import ZipFile
          root=Path(os.environ["RUNNER_TEMP"])/"b1-evidence"
          artifact=root/"original.zip"
          prefix="b1-development-archive/"
          def digest(b): return sha256(b).hexdigest()
          with ZipFile(artifact) as z:
              names=z.namelist()
              files={prefix+"originals/life-%03d.json.gz"%i for i in range(192)}
              other={prefix+x for x in ("ATTEMPT_CLAIM.json",
                      "B1_EXECUTION_REPORT.json","REDUCED_ROWS.json",
                      "originals/MANIFEST.json","originals/MANIFEST.sha256")}
              other.add("b1-development-console.json")
              assert len(names)==198 and set(names)==files|other
              raw=z.read(prefix+"originals/MANIFEST.json")
              assert digest(raw)==os.environ["MANIFEST_SHA256"]
              assert z.read(prefix+"originals/MANIFEST.sha256").decode().strip()==digest(raw)
              manifest=json.loads(raw)
              assert manifest["status"]=="GENERATED" and manifest["planned"]==manifest["generated"]==192
              assert manifest["failure"] is None and len(manifest["files"])==192
              claim=json.loads(z.read(prefix+"ATTEMPT_CLAIM.json"))
              report=json.loads(z.read(prefix+"B1_EXECUTION_REPORT.json"))
              rows=json.loads(z.read(prefix+"REDUCED_ROWS.json"))
              assert claim["status"]=="CONSUMED_BEFORE_FIRST_BIRTH" and claim["no_retry"] is True
              assert claim["source_fingerprint"]==report["source_fingerprint"]==os.environ["ORIGINAL_FINGERPRINT"]
              assert claim["plan_sha256"]==report["plan_sha256"]==os.environ["PLAN_SHA"]
              assert report["status"]=="COMPLETE_EXPLORATORY_DEVELOPMENT"
              assert report["generated"]==report["reduced"]==192 and len(rows)==192
              original=[]
              for i,entry in enumerate(manifest["files"]):
                  assert entry["file"]=="life-%03d.json.gz"%i
                  packed=z.read(prefix+"originals/"+entry["file"])
                  assert digest(packed)==entry["sha256"]
                  unpacked=gzip.decompress(packed)
                  assert digest(unpacked)==entry["uncompressed_sha256"]
                  life=json.loads(unpacked)
                  assert life["identity"]==entry["identity"]
                  m=life["life"]["manifest"]
                  assert m["source"]["git_head"]==os.environ["EXECUTION_SHA"]
                  assert m["source"]["working_tree_dirty"] is False
                  assert m["world_sha256"]==life["life"]["admission_receipt"]["world_sha256"]
                  assert life["life"]["admission_receipt"]["transport_fingerprint"]==os.environ["ORIGINAL_FINGERPRINT"]
                  ca=life["life"]["cognitive_accounting"]
                  assert ca["shortfall_steps"]==0 and ca["status"]=="SETTLED_FOR_DECLARED_WORK"
                  for currency in ("energy","vigilance"): assert ca["totals"][currency]["unpaid"]<=1e-12
                  assert life["life"]["terminal"] in ("dead","censored")
                  assert life["life"]["terminal"]!="censored" or life["life"]["steps_lived"]==400
                  r=rows[i]
                  assert all(r[k]==life["identity"][k] for k in ("index","pair_id","policy","family","genome_seed","world_seed","life_seed","cohort"))
                  assert r["terminal"]==life["life"]["terminal"] and r["steps_lived"]==life["life"]["steps_lived"]
                  assert abs(r["paid_energy"]-ca["totals"]["energy"]["paid"])<1e-9
                  assert abs(r["paid_vigilance"]-ca["totals"]["vigilance"]["paid"])<1e-9
                  original.append(life)
              pairs=Counter()
              families=Counter()
              for i in range(96):
                  f,g=original[2*i:2*i+2]
                  x,y=f["identity"],g["identity"]
