name: I3 proposal software checks

on:
  pull_request:
    # Keep the same software checks on generation-owned stacked PRs.
    branches: [main, 'i3/**']
    paths:
      - 'src/i3/**/*.py'
      - 'src/i3/engine.json'
      - 'src/i3/ACTIVE_SURFACE.json'
      - 'tests/i3/**'
      - 'src/i3/docs/studies/stage2-replay-gate-selected-design/ENGINEERING_B1_PLAN.json'
      - 'scripts/check_engine_repository.py'
      - 'tests/test_engine_repository.py'
      - '.github/workflows/i3-proposal-checks.yml'

permissions:
  contents: read

concurrency:
  group: i3-proposal-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  software:
    name: I3 software (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact candidate, including history for generation guards
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify engine contracts and immutable generation ownership
        run: |
          python scripts/check_engine_contracts.py --json
          python scripts/check_engine_repository.py --json
          python -m unittest discover -s tests -p test_engine_repository.py -v
      - name: Run I3 software tests, not scientific study entrypoints
        run: python -m unittest discover -s tests/i3 -p 'test_*.py' -v
      - name: Check current navigation
        if: matrix.python-version == '3.11'
        run: python tools/check_repo_navigation.py --scope entrypoints

  b1-engineering:
    # Keep expensive engineering replay separate from normal I3 software
    # tests, only for explicitly named B1 survival-development branches.
    if: startsWith(github.head_ref, 'research/i3-survival-')
    name: I3 B1 G/R engineering (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: src
      PLAN: src/i3/docs/studies/stage2-replay-gate-selected-design/ENGINEERING_B1_PLAN.json
    steps:
      - name: Checkout exact survival candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify engineering plan has zero scientific allocation
        run: |
          python - <<'PY'
          import json, os
          with open(os.environ["PLAN"]) as stream:
              p = json.load(stream)
          assert p["protocol_id"] == "I3_SURVIVAL_B1_NON_EVIDENTIARY_ENGINEERING_SMOKE"
          assert p["scientific"]["indices"] == []
          assert p["scientific"]["genome_seeds"] == []
          assert p["engineering"]["cohort"] == "engineering"
          assert p["arms"] == ["reference", "p13_replay_gate_v1"]
          assert len(p["engineering"]["indices"]) == 4
          assert len(p["engineering"]["genome_seeds"]) == 1
          assert p["no_engineering_outcomes_publish"] is True
          PY
      - name: Execute pure synthetic exact paired power campaign
        run: |
          python -m unittest discover -s tests/i3 -p 'test_stage2_exact_paired_survival.py' -v
          python -m i3.lab.stage2_exact_paired_survival > "$RUNNER_TEMP/b1-power-synthetic.json"
          python - "$RUNNER_TEMP/b1-power-synthetic.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              data = json.load(stream)
          assert data["conditions"] == "PURE_SYNTHETIC_IID_PAIRED_SURVIVAL_DRAWS"
          assert data["no_actual_survival_data_read"]
          assert len(data["simulated_cells"]) == 16
          assert all(c["scientific_lives"] == 0 and c["worlds_opened"] == 0
                     and c["scientific_verdict"] == "NOT_ISSUED"
                     for c in data["simulated_cells"])
          print("B1_SYNTHETIC_CALIBRATION_16_SCENARIOS_COMPLETE")
          PY
      - name: Run sealed G/R against 24 temporary engineering lives
        run: |
          python -m i3.lab.stage2_panel rehearse "$PLAN" > "$RUNNER_TEMP/b1-engineering-structure.json"
          python - "$RUNNER_TEMP/b1-engineering-structure.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              report = json.load(stream)
          allowed = {
              "schema", "planned", "phase_G", "generated", "generation_failure",
              "phase_R", "reduced", "reduction_failure", "invariant_failures",
              "manifest_sha256", "mean_step_ms", "status", "runner",
              "protocol_id", "transport_fingerprint", "plan_sha256", "namespace",
          }
          assert set(report) <= allowed, "non-structural engineering data cannot leave G/R"
          # Only preallowed structural fields can appear in CI logs.
          print(json.dumps(report, sort_keys=True))
          assert report["status"] == "PASS", "engineering G/R FAIL, not a scientific death"
          assert report["planned"] == report["generated"] == report["reduced"] == 24
          assert report["phase_G"] == "GENERATED" and report["phase_R"] == "COMPLETE"
          assert report["namespace"] == "engineering"
          assert report["generation_failure"] is None
          assert report["reduction_failure"] is None
          assert report["invariant_failures"] and not any(report["invariant_failures"].values())
          print("B1_ENGINEERING_STRUCTURAL_PASS_24_OF_24_NO_SCIENTIFIC_WORLD")
          PY
      - name: Archive allowlisted structural and synthetic data only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: i3-b1-non-evidentiary-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/b1-engineering-structure.json
            ${{ runner.temp }}/b1-power-synthetic.json
          if-no-files-found: error
          retention-days: 30


  b1-sampling-preflight:
    # Pure future allocation *metadata*, not World generation or approval.
    if: startsWith(github.head_ref, 'research/i3-survival-b1-')
    name: I3 B1 prospective sample dry-run (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout the exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove metadata only and reject prospectively tampered pairs
        run: |
          python -m unittest discover -s tests/i3 -p 'test_stage2_survival_b1_sampling.py' -v
          python -m i3.lab.stage2_survival_b1_sampling > "$RUNNER_TEMP/b1-sampling-preview-structure.json"
          python - "$RUNNER_TEMP/b1-sampling-preview-structure.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              s = json.load(stream)
          assert s["status"] == "DRY_RUN_ALLOCATION_ONLY_NO_WORLD_EXPOSURE"
          assert s["pair_count"] == 1500
          assert s["maximum_proposed_lives"] == 3000
          assert s["maximum_horizon_steps"] == 1200000
          assert sum(s["family_counts"].values()) == 1500
          assert s["world_instances_created"] == 0
          assert s["individual_lives_executed"] == 0
          assert s["independent_iid_world_pairs_verified"] is False
          assert s["witness_is_authorized_for_scientific_births"] is False
          assert s["scientific_verdict"] == "NOT_ISSUED"
          assert set(s) == {
              "schema", "status", "witness_sha256", "pair_count",
              "family_counts", "maximum_proposed_lives", "maximum_horizon_steps",
              "allocation_sha256", "world_instances_created",
              "individual_lives_executed", "scientific_verdict",
              "independent_iid_world_pairs_verified",
              "witness_is_authorized_for_scientific_births",
          }
          print("B1_PROPOSED_1500_PAIR_METADATA_ONLY_NO_WORLD_PASS")
          PY
      - name: Archive the synthetic structural metadata digest only
        uses: actions/upload-artifact@v4
        with:
          name: i3-b1-prospective-sample-dryrun
          path: ${{ runner.temp }}/b1-sampling-preview-structure.json
          if-no-files-found: error
          retention-days: 30


  b1-worldspec-preflight:
    # NON-EVIDENTIARY: create/validate only synthetic WorldSpecs,
    # never a Mind, life, World step or scientific original archive.
    if: startsWith(github.head_ref, 'research/i3-survival-b1-worldspec-')
    name: I3 B1 WorldSpec structural preflight (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact synthetic WorldSpec candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify frozen P2 parity and duplicate-name-independent worlds
        run: |
          python -m unittest discover -s tests/i3 -p 'test_stage2_survival_b1_worldspec_audit.py' -v
          python -m i3.lab.stage2_survival_b1_worldspec_audit > "$RUNNER_TEMP/b1-synthetic-worldspec-audit.json"
          python - "$RUNNER_TEMP/b1-synthetic-worldspec-audit.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              r = json.load(stream)
          assert r["status"] == "SYNTHETIC_SPEC_PREFLIGHT_NOT_PROSPECTIVE_AUTHORITY"
          assert r["worldspec_structures_generated"] == 1500
          assert r["structural_world_validations"] == 1500
          assert r["unique_full_worldspec_digests"] == 1500
          assert r["unique_name_independent_worldspec_digests"] == 1500
          assert sum(r["ecological_families"].values()) == 1500
          assert r["worlds_stepped"] == r["scientific_lives_executed"] == 0
          assert r["originals_written"] == 0
          assert r["independent_world_sampling_verified"] is False
          assert r["target_ecology_superpopulation_verified"] is False
          assert r["scientific_margin_approved"] is False
          assert r["external_witness_and_owner_admission"] is False
          assert r["scientific_verdict"] == "NOT_ISSUED"
          assert len(r["aggregate_worldspec_digest_sha256"]) == 64
          assert set(r) == {
              "schema", "status", "public_synthetic_allocation_sha256",
              "aggregate_worldspec_digest_sha256", "worldspec_structures_generated",
              "structural_world_validations", "unique_full_worldspec_digests",
              "unique_name_independent_worldspec_digests", "ecological_families",
              "worlds_stepped", "scientific_lives_executed", "originals_written",
              "independent_world_sampling_verified",
              "target_ecology_superpopulation_verified", "scientific_margin_approved",
              "external_witness_and_owner_admission", "scientific_verdict",
          }, "unexpected nonstructural audit field"
          print("B1_SYNTHETIC_WORLDSPEC_1500_PARITY_AND_COLLISION_PASS")
          PY
      - name: Upload synthetic structural SHA/counts only
        uses: actions/upload-artifact@v4
        with:
          name: i3-b1-synthetic-worldspecs-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/b1-synthetic-worldspec-audit.json
          if-no-files-found: error
          retention-days: 30
