name: I3 proposal software checks

on:
  pull_request:
    # Keep the same software checks on generation-owned stacked PRs.
    branches: [main, 'i3/**']
    paths:
      - 'src/i3/**/*.py'
      - 'src/i3/engine.json'
      - 'tests/i3/**'
      - 'scripts/check_engine_repository.py'
      - 'tests/test_engine_repository.py'
      - '.github/workflows/i3-proposal-checks.yml'

permissions:
  contents: read

concurrency:
  group: i3-proposal-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  software:
    name: I3 software (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact candidate, including history for generation guards
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify engine contracts and immutable generation ownership
        run: |
          python scripts/check_engine_contracts.py --json
          python scripts/check_engine_repository.py --json
          python -m unittest discover -s tests -p test_engine_repository.py -v
      - name: Run I3 software tests, not scientific study entrypoints
        run: python -m unittest discover -s tests/i3 -p 'test_*.py' -v
      - name: Check current navigation
        if: matrix.python-version == '3.11'
        run: python tools/check_repo_navigation.py --scope entrypoints


  stage1-cost-vs-policy-development-once:
    name: Frozen Stage-1 cost-vs-policy development diagnostic (one shot)
    needs: software
    if: >-
      github.event.action == 'opened' && github.run_attempt == '1' &&
      github.event.pull_request.head.repo.full_name == 'josselin-orta-lab/individual-zero' &&
      github.head_ref == 'i3/stage1-cost-vs-policy-dev52-53-execute-20261107' &&
      github.event.pull_request.base.sha == 'd4ec51d772cbbf2a04130add099b5a7a0050b0f9'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONPATH: src
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute frozen 36-life cost-vs-policy panel once
        run: >-
          python -m i3.lab.stage1_candidate_f_cost_vs_policy_diagnostic
          --expected-sha "$SOURCE_SHA"
          --expected-protocol 81a02daf0e18a98f31d044b11c4d62300e826ea60dbc16ac4eb40b8277373c47
          --output "$RUNNER_TEMP/i3-stage1-cost-vs-policy-original"
      - name: Preserve all originals including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i3-stage1-cost-vs-policy-original-${{ github.run_id }}
          path: ${{ runner.temp }}/i3-stage1-cost-vs-policy-original/
          if-no-files-found: error
          retention-days: 90
      - name: Archive only original outputs to a new evidence branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          if repo != 'josselin-orta-lab/individual-zero':
              raise RuntimeError('wrong repository')
          head = os.environ['SOURCE_SHA']
          if subprocess.check_output(
                  ['git','rev-parse','HEAD'], text=True).strip() != head:
              raise RuntimeError('wrong archive parent')
          folder = (
              Path(os.environ['RUNNER_TEMP'])
              / 'i3-stage1-cost-vs-policy-original')
          files = sorted(p for p in folder.iterdir() if p.is_file())
          if not files:
              raise RuntimeError('no originals to archive')

          def api(path, data):
              req = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + path,
                  data=json.dumps(data).encode(), method='POST',
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          entries = []
          for p in files:
              blob = api('/git/blobs', {
                  'encoding': 'base64',
                  'content': base64.b64encode(p.read_bytes()).decode()})
              entries.append({
                  'path':
                      'src/i3/docs/studies/'
                      'stage1-candidate-f-cost-vs-policy-development-52-53/'
                      'original/' + p.name,
                  'mode': '100644',
                  'type': 'blob',
                  'sha': blob['sha']})
          base = subprocess.check_output(
              ['git','rev-parse','HEAD^{tree}'], text=True).strip()
          tree = api('/git/trees', {
              'base_tree': base,
              'tree': entries})
          commit = api('/git/commits', {
              'message':
                  'research(i3): archive original 52-53 cost-vs-policy diagnostic, no rerun',
              'tree': tree['sha'],
              'parents': [head]})
          ref = (
              'refs/heads/i3/evidence-stage1-cost-vs-policy-'
              + os.environ['GITHUB_RUN_ID'])
          api('/git/refs', {'ref': ref, 'sha': commit['sha']})
          print('ORIGINAL_ARCHIVE ' + json.dumps({
              'ref': ref,
              'sha': commit['sha'],
              'tree': tree['sha'],
              'files': len(entries)}))
          PY
