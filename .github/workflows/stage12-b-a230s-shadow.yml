name: Stage12 A2.30-S shadow causal confounding
on:
  pull_request:
    branches: [science/stage12-b-a230p-multiconsequence-delayed-20261015]
    paths:
      - 'scripts/run_stage12_issue110_b_a230s_firstperson_shadow.py'
      - 'tests/test_stage12_a230s_firstperson_shadow.py'
      - 'docs/research/stage12-issue110-b-a230s-*.md'
      - '.github/workflows/stage12-b-a230s-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prospective-firstperson:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Assert hidden causal ambiguity, guarded mortality and read-only food shadow
        run: python -m unittest discover -s tests -p test_stage12_a230s_firstperson_shadow.py -v
      - name: Execute frozen first-person physical battery and Stage6 shadow diagnoses
        run: |
          python -u scripts/run_stage12_issue110_b_a230s_firstperson_shadow.py \
            --output-dir /tmp/a230s-worlds > /tmp/a230s.log 2>&1 \
            || { tail -n 190 /tmp/a230s.log; exit 2; }
          grep A230S_SUMMARY /tmp/a230s.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a230s-py${{ matrix.python-version }}
          path: |
            /tmp/a230s-worlds
            /tmp/a230s.log
          retention-days: 30
