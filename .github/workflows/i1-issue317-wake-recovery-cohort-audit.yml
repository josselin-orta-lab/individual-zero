name: I1 issue317 independent 32-life recovered wake WAL audit
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'tools/audit_i1_317_wake_recovery_cohort.py'
      - 'tests/i1/test_i1_317_wake_recovery_cohort.py'
      - '.github/workflows/i1-issue317-wake-recovery-cohort-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test forged and incomplete cohort rejection
        run: python -m unittest discover -s tests/i1 -p test_i1_317_wake_recovery_cohort.py -v
      - name: Retrieve original 32 irrevocable WAL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sealed result
          for world in oasis foraging dry-valley memory-corridor; do
            for seed in 11117 11239; do
              gh run download 39302574668 --repo "$GITHUB_REPOSITORY" --name "i1-317-wake-factorial-$world-$seed" --dir sealed
              test -f "sealed/$world/$seed/report.json"
              for arm in canonical recovered_fatigue natural_threshold recovered_and_threshold; do
                test -f "sealed/$world/$seed/$arm/life-01.wal"
              done
            done
          done
      - name: Independently authenticate physical actions and consolidations
        run: |
          python tools/audit_i1_317_wake_recovery_cohort.py --root sealed --output result/independent-recovery.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('result/independent-recovery.json').read_text())
          assert d['verified_lives']==32
          assert d['verified_distinct_original_wal_sha256']==32
          assert d['experimental_recovery_scalar_itself_WAL_proven'] is False
          assert d['scientific_verdict']=='NO-GO'
          assert all(d['by_arm'][arm]['independent_lives']==8 for arm in (
              'canonical','recovered_fatigue','natural_threshold','recovered_and_threshold'))
          print('THIRTY_TWO_ORIGINAL_IRREVERSIBLE_WAL_CERTIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-317-independent-32-wake-factorial-certificate
          path: result/
          retention-days: 30
          if-no-files-found: warn
