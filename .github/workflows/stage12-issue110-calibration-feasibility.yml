name: Issue110 attribution calibration feasibility
on:
  pull_request:
    branches:
      - science/stage12-issue110-sleep-window-20261014
    paths:
      - 'scripts/run_stage12_issue110_calibration_feasibility.py'
      - 'src/lab/stage3_runtime.py'
      - 'src/lab/stage10_runtime.py'
      - 'tests/test_stage12_waking_capture_provenance.py'
      - 'scripts/run_stage12_issue110_first_planning_state.py'
      - '.github/workflows/stage12-issue110-calibration-feasibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  autonomous-calibration-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pin source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Verify canonical waking perception receipt contract
        run: python -m unittest discover -s tests -p 'test_stage12_waking_capture_provenance.py' -v
      - name: Preregistered independent autonomous feasibility
        env:
          COHORT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/run_stage12_issue110_calibration_feasibility.py \
            --output-dir /tmp/issue110-calibration \
            --cohort-id "$COHORT_ID"
      - name: Preserve WAL and full canonical source data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue110-calibration-py${{ matrix.python-version }}
          path: /tmp/issue110-calibration/
          retention-days: 30
          if-no-files-found: warn
