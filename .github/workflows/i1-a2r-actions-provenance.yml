name: A2-R Actions provenance pure contracts
on:
  pull_request:
    paths:
      - 'tools/research/i1_a2r_actions_provenance.py'
      - 'tools/research/i1_a2r_environment_review.py'
      - 'tools/research/i1_a2r_native_review_history.py'
      - 'tools/research/tests/test_i1_a2r_native_review_history.py'
      - 'tools/research/tests/test_i1_a2r_environment_review.py'
      - 'tools/research/tests/test_i1_a2r_actions_provenance.py'
      - '.github/workflows/i1-a2r-actions-provenance.yml'
permissions:
  contents: read
jobs:
  metadata_only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=tools/research python -m unittest discover -s tools/research/tests -p test_i1_a2r_actions_provenance.py -v
      - run: PYTHONPATH=tools/research python -m unittest discover -s tools/research/tests -p test_i1_a2r_environment_review.py -v
      - run: PYTHONPATH=tools/research python -m unittest discover -s tools/research/tests -p test_i1_a2r_native_review_history.py -v
