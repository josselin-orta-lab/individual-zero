name: I1 issue318 cross-goal local opportunity
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'src/i1/runtime/i1_active_runtime.py'
      - 'src/i1/runtime/i1_natural_runtime.py'
      - 'src/i1/runtime/m11_transactional_mortal.py'
      - 'tests/i1/test_i1_318_cross_goal_local_opportunities.py'
      - '.github/workflows/i1-issue318-cross-goal-opportunity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests/i1 -p test_i1_318_cross_goal_local_opportunities.py -v
      - run: python -m unittest discover -s tests/i1 -p test_i1_317_experiential_native_m11.py -v
