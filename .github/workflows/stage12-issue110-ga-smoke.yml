name: Issue 110 first-person agency focused smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/i0/modules/stage12_goal_agency.py'
      - 'src/i0/modules/action_control.py'
      - 'src/lab/stage12_runtime.py'
      - 'src/lab/stage3_runtime.py'
      - 'tests/test_stage12_goal_agency*.py'
      - 'tests/test_stage12_attribution_pairs.py'
      - 'src/i0/modules/stage12_attribution_pairs.py'
      - 'src/lab/stage12_attribution_pair_audit.py'
      - '.github/workflows/stage12-issue110-ga-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue110-ga-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ga-smoke:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Standalone first-person agency and real physics
        run: |
          python -m unittest discover -s tests -p 'test_stage12_goal_agency.py' -v
          python -m unittest discover -s tests -p 'test_stage12_attribution_pairs.py' -v
          python -m unittest discover -s tests -p 'test_stage12_goal_agency_runtime.py' -v
          python -m unittest discover -s tests -p 'test_stage12_goal_progress.py' -q
          python -m unittest discover -s tests -p 'test_stage12_attribution_provenance.py' -q
