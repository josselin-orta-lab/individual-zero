name: I1 issue317 native Stage8 matched physical births
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'tools/run_i1_317_native_experiential_cohort.py'
      - 'tests/i1/test_i1_317_native_experiential_cohort.py'
      - '.github/workflows/i1-issue317-native-experiential-births.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-new-mortal:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        preset: [memory-corridor, water-isolated-corridor]
        seed: [17123, 17257, 17383, 17491]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests/i1 -p test_i1_317_native_experiential_cohort.py -v
      - name: Two native freshly born independently mortal individuals
        env:
          PRESET: ${{ matrix.preset }}
          SEED: ${{ matrix.seed }}
        run: |
          python tools/run_i1_317_native_experiential_cohort.py --preset "$PRESET" --seed "$SEED" --output-dir "results/$PRESET/$SEED"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('results')/os.environ['PRESET']/os.environ['SEED']/'report.json'
          r=json.loads(p.read_text())
          assert r['status']=='COMPLETE_PAIRED_PHYSICAL_DIAGNOSTIC'
          assert r['schema']=='i1-317-native-experiential-mortal/v1'
          assert set(r['arms'])==set(r['preregistered_arms'])
          assert r['native_experiential_stage8_opt_in'] is True
          assert r['scientific_verdict']=='NO-GO'
          print('NATIVE_STAGE8_TWO_MORTAL_BIRTHS_COMPLETED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-317-native-mortal-${{ matrix.preset }}-${{ matrix.seed }}
          path: results/
          retention-days: 30
          if-no-files-found: warn
