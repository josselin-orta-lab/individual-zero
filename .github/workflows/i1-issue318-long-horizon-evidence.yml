name: 'I1 #318 900-step ecological Q evidence holdout'
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'tools/run_i1_318_long_horizon_evidence_cohort.py'
      - 'tests/i1/test_i1_318_long_horizon_evidence_cohort.py'
      - '.github/workflows/i1-issue318-long-horizon-evidence.yml'
permissions:
  contents: read
jobs:
  mortal:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        preset: [foraging, dry-valley, hazard-edge, empty-land]
        seed: [25117, 25219, 25339]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests/i1 -p test_i1_318_long_horizon_evidence_cohort.py -v
      - name: Birth only two unique never-replayed mortal I1
        env:
          PRESET: ${{ matrix.preset }}
          SEED: ${{ matrix.seed }}
        run: |
          python tools/run_i1_318_long_horizon_evidence_cohort.py --preset "$PRESET" --seed "$SEED" --output-dir "results/$PRESET/$SEED"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path("results")/os.environ["PRESET"]/os.environ["SEED"]/"report.json").read_text())
          assert j["schema"]=="i1-318-long-horizon-matched-Q-evidence-mortal/v1"
          assert j["status"]=="COMPLETE_LONG_HORIZON_PHYSICAL_DIAGNOSTIC"
          assert j["preregistered_arms"]==["local_q_neutral","local_q_evidence_only"]
          assert j["exclusively_new_24_mortal_lives"] is True
          assert j["scientific_verdict"]=="NO-GO"
          print("I1_318_LONG_HORIZON_PAIR_FINISHED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-318-longholdout-${{ matrix.preset }}-${{ matrix.seed }}
          path: results/
          retention-days: 30
          if-no-files-found: warn
