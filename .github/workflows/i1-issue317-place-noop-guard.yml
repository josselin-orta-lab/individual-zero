name: I1 issue317 no-op place recall search guard
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'tools/run_i1_317_place_noop_guard.py'
      - 'tests/i1/test_i1_317_place_noop_guard.py'
      - '.github/workflows/i1-issue317-place-noop-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-mortal-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        preset: [oasis, foraging, memory-corridor]
        seed: [14083, 14107]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install I1
        run: python -m pip install -e .
      - name: Adversarial test for provably no-op search guard
        run: python -m unittest discover -s tests/i1 -p test_i1_317_place_noop_guard.py -v
      - name: Birth two unrelated mortal lives per world and seed
        env:
          PRESET: ${{ matrix.preset }}
          SEED: ${{ matrix.seed }}
        run: |
          python tools/run_i1_317_place_noop_guard.py --preset "$PRESET" --seed "$SEED" --output-dir "result/$PRESET/$SEED"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path('result')/os.environ['PRESET']/os.environ['SEED']/'report.json').read_text())
          assert r['schema']=='i1-317-lived-place-noop-search-guard-v1'
          assert r['status']=='COMPLETE_PAIRED_PHYSICAL_DIAGNOSTIC'
          assert set(r['arms'])=={'canonical','guarded_recall'}
          assert r['preregistered_arms']==['canonical','guarded_recall']
          assert r['no_op_guarded_paid_route_search_study'] is True
          assert r['guard_does_not_force_motor_or_infer_thirst_relief'] is True
          assert r['scientific_verdict']=='NO-GO'
          print('FIRST_PERSON_NOOP_SEARCH_MORTAL_PAIR_COMPLETE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-317-place-noop-guard-${{ matrix.preset }}-${{ matrix.seed }}
          path: result/
          retention-days: 30
          if-no-files-found: warn
