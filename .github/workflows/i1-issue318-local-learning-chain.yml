name: 'I1 #318 physical learning chain from original WAL'
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'tools/audit_i1_318_local_learning_chain.py'
      - '.github/workflows/i1-issue318-local-learning-chain.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  attest-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m py_compile tools/audit_i1_318_local_learning_chain.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 39385691970
          github-token: ${{ github.token }}
          pattern: i1-318-independent-local-*
          path: original
          merge-multiple: true
      - name: Read-only original WAL causal chronology
        run: |
          python tools/audit_i1_318_local_learning_chain.py --root original --output original-learning-chain.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-318-original-learning-chain
          path: original-learning-chain.json
          retention-days: 30
          if-no-files-found: warn
