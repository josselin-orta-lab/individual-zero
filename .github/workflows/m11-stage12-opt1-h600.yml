name: Issue133 M11 OPT1 long-horizon H600 single campaign
# Pre-registered H600 is queued at run #38405486588 on frozen SHA
# fff436ab175c1bf1e3229d9f0e779570a47bda14. Future runs manual only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opt1-h600:
    name: SQLite-owned true H600 world (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Run 600 true physical steps, preserve current SQLite state and journal
        run: python -u scripts/run_m11_stage12_opt1_h600.py --output-dir /tmp/issue133-m11-h600
      - name: Retain raw SQLite, export, summary and any failed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue133-m11-opt1-h600-python-${{ matrix.python-version }}
          path: /tmp/issue133-m11-h600/
          retention-days: 30
          if-no-files-found: warn
