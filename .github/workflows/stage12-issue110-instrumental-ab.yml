name: Issue110 instrumental geographic goal AB
on:
  pull_request:
    branches: [science/stage12-issue110-sleep-window-20261014]
    paths:
      - 'src/i0/modules/exploration.py'
      - 'src/i0/modules/stage11_evaluator.py'
      - 'src/lab/stage11_runtime.py'
      - 'scripts/run_stage12_issue110_first_planning_state.py'
      - 'scripts/run_stage12_issue110_instrumental_ab.py'
      - '.github/workflows/stage12-issue110-instrumental-ab.yml'
      - 'tests/test_stage12_instrumental_geographic.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-lives:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Check instrumental fail-closed contracts
        run: python -m unittest discover -s tests -p 'test_stage12_instrumental_geographic.py' -v
      - name: Run 16 preregistered autonomous lives
        env:
          COHORT: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/run_stage12_issue110_instrumental_ab.py \
            --output-dir /tmp/instrumental-ab --cohort-id "$COHORT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue110-instrumental-py${{ matrix.python-version }}
          path: /tmp/instrumental-ab
          retention-days: 30
          if-no-files-found: warn
