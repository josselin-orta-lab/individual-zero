name: I1 prospective geographic population
on:
  push:
    branches: [science/i1-natural-population-calibration-20261018]
    paths:
      - 'tools/run_i1_geo_population.py'
      - 'tests/i1/test_i1_geo_population.py'
      - '.github/workflows/i1-geo-population.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        candidate: [0, 1, 2, 3, 4, 5]
        world: [oasis, foraging, dry-valley]
        seed: [931, 932]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests/i1 -p test_i1_geo_population.py -v
      - name: Unmodified decision-making and mortal physical life
        env:
          CANDIDATE: ${{ matrix.candidate }}
          WORLD: ${{ matrix.world }}
          SEED: ${{ matrix.seed }}
        run: |
          python tools/run_i1_geo_population.py \
            --candidate "$CANDIDATE" --world "$WORLD" \
            --seed "$SEED" --steps 400 \
            --output-dir "reports/candidate-$CANDIDATE/$WORLD/seed-$SEED"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-geo-${{ matrix.candidate }}-${{ matrix.world }}-${{ matrix.seed }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
