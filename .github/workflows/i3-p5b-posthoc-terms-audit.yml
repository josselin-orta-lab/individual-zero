name: I3 P5b original-data-only score-term hypothesis audit
on:
  push:
    branches: [automation/i3-p5b-posthoc-terms-audit-20261106]
    paths: [.github/workflows/i3-p5b-posthoc-terms-audit.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout posthoc source and original P5b archive
        uses: actions/checkout@v4
        with:
          ref: 158b5ae4c66752241ccdde7838aacdcac7143549
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test all synthetic original-custody and mathematical guards
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/i3 -p 'test_*.py' -q
          python scripts/check_engine_repository.py --json
      - name: Compute posthoc score algebra from original evidence ONLY
        shell: bash
        run: |
          set -euo pipefail
          folder=src/i3/docs/studies/p5b-paid-readout-heldout
          test "$(gzip -dc "$folder/readout-full.json.gz" | sha256sum | cut -d ' ' -f1)" = "98d21bc18d88f26743ae9ca07cc0d966605d14de826b73a91b9d24b675c9a8df"
          PYTHONPATH=src python -m i3.lab.p5b_posthoc_terms "$folder/readout-full.json.gz" > "$RUNNER_TEMP/p5b-terms.json"
          python - <<'PY'
          import json,os
          x=json.load(open(os.environ["RUNNER_TEMP"]+"/p5b-terms.json"))
          assert x["status"]=="POST_HOC_DESCRIPTIVE_NOT_PREREGISTERED_NOT_CONFIRMATORY"
          assert x["original_canonical_sha256"]=="211c2586971bace7cc592488c399202f97d07ddb3be0937eb49d4a47dd4f9473"
          assert x["new_study_lives"]==0
          for mode,entry in x["modes"].items():
              c=entry["total"]
              assert c["pairs"]==288
              print("POSTHOC",mode,"pairs",c["pairs"],
                    "base_only",c.get("option_score_delta_base_only",0),
                    "bonus_only",c.get("option_score_delta_bonus_only",0),
                    "both",c.get("option_score_delta_both_terms",0),
                    "cancelled",c.get("option_components_changed_but_score_cancelled",0),
                    "pairs_bonus_only",c.get("pairs_score_delta_bonus_only",0),
                    "pairs_base_only",c.get("pairs_score_delta_base_only",0))
          PY
