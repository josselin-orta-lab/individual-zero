name: I3 P5b chronology developmental audit no validation
on:
  push:
    branches: [automation/i3-p5b-divergence-preflight-20261106]
    paths: [.github/workflows/i3-p5b-divergence-preflight.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout exact development-only instrument
        uses: actions/checkout@v4
        with:
          ref: 02e569df7681b8eb158f0bc985042c22a18107bf
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: I3 tests and generation boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/i3 -p 'test_*.py' -q
          python scripts/check_engine_repository.py --json
      - name: Verify paired development-only chronology
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m i3.lab.p5b_development_diagnostic --run-development > "$RUNNER_TEMP/p5b.json"
          python - <<'PY'
          import json,os
          d=json.load(open(os.environ["RUNNER_TEMP"]+"/p5b.json"))
          assert d["validation"]=="NOT_OPENED" and d["reserve"]=="LOCKED"
          assert len(d["lives"])==84 and len(d["first_paired_action_divergence"])==6
          for mode,paired in d["first_paired_action_divergence"].items():
              assert len(paired)==12
              for field in ("first_action_divergence_step",
                            "first_decision_funding_divergence_step",
                            "first_post_step_body_divergence_step",
                            "first_paid_decision_work_divergence_step"):
                  values=[v[field] for v in paired if v[field] is not None]
                  assert all(1<=v<=120 for v in values)
                  print("DEV",mode,field,"paired divergences",len(values),
                        "earliest",min(values) if values else None)
          PY
      - name: Verify original P4 P5a data unchanged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,gzip
          from pathlib import Path
          root=Path("src/i3/docs/studies")
          for name,sha in (
            ("p4a-g2-heldout/validation-full.json.gz","44adb1192d1aea87cf5d96a547f794de6f7fe33a566a5de90747a34429e8e8d6"),
            ("p4b-paid-outcome-learning/learning-full.json.gz","688463e4fbb71cb88d57d0cafbe70eb033adeafe8ae8551d42bec58dfa9e395c"),
            ("p5a-paid-component-screen/mechanisms-full.json.gz","21719dcc89f83f3984ccc32b3d203d2152ff8c7dd8c2c8a76318ce84d60113d8")):
              assert hashlib.sha256(gzip.decompress((root/name).read_bytes())).hexdigest()==sha
          PY
