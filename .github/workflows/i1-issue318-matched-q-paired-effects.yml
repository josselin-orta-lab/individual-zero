name: 'I1 #318 paired factorial WAL effect audit'
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'tools/audit_i1_318_matched_q_paired_effects.py'
      - 'tests/i1/test_i1_318_matched_q_paired_effects.py'
      - '.github/workflows/i1-issue318-matched-q-paired-effects.yml'
permissions:
  contents: read
  actions: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests/i1 -p test_i1_318_matched_q_paired_effects.py -v
      - uses: actions/download-artifact@v4
        with:
          run-id: 39407509122
          github-token: ${{ github.token }}
          pattern: i1-318-matched-twin-*
          path: original
          merge-multiple: true
      - name: Certify 32 WAL then compute eight paired factorial contrasts
        run: |
          python tools/audit_i1_318_matched_q_paired_effects.py --root original --output paired-factorial-effects.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("paired-factorial-effects.json").read_text())
          assert d["WAL_authenticated"] == 32
          assert d["blocked_four_arm_replicates"] == 8
          assert d["scientific_verdict"] == "INCONCLUSIVE"
          print("I1_318_PAIRED_Q_FACTORS_CERTIFIED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-318-eight-paired-Q-contrasts
          path: paired-factorial-effects.json
          retention-days: 30
          if-no-files-found: warn
