name: I1 A2.38 sealed 160 mortal births
on:
  # Prior experimental campaign: manual only, not I1 acceptance.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a238-confirmatory-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  confirmatory:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out frozen PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin source SHA
        id: pin
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: python -m pip install -e .
      - name: Prerequisite smoke
        run: |
          python -m compileall -q scripts/i1_a238_preflight.py scripts/i1_a238_model.py scripts/i1_a238_fixtures.py scripts/run_i1_a238_factorial.py scripts/audit_i1_a238_factorial.py
          python -m unittest discover -s tests -p 'test_i1_a238_factorial_smoke.py' -v
      - name: Run 160 independent mortal I1 births
        run: python scripts/run_i1_a238_factorial.py --output artifacts/a238-confirmatory --source-sha "${{ steps.pin.outputs.source_sha }}"
      - name: Separate WAL and journal audit
        if: always()
        run: |
          if test -e artifacts/a238-confirmatory/lives.jsonl; then
            python scripts/audit_i1_a238_factorial.py --input artifacts/a238-confirmatory
          else
            echo 'NO confirmatory cohort available'
            exit 1
          fi
      - name: Archive all outcomes including failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-a238-confirmatory-${{ steps.pin.outputs.source_sha }}
          path: artifacts/a238-confirmatory/
          if-no-files-found: warn
          retention-days: 90
