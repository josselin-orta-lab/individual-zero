name: I3 P4a original heldout evidence archive (one-shot)
on:
  push:
    branches: [automation/i3-p4a-archive-original-20261106]
    paths: [.github/workflows/i3-p4a-archive-original.yml]
permissions:
  contents: write
  actions: read
jobs:
  archive-original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout preregistered main with push credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify original preregistration is ancestral
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e08fc2c6604d470dbf12839a0aa449309ac7d49a HEAD
      - name: Retrieve first and only validation study result
        uses: actions/download-artifact@v4
        with:
          name: i3-p4a-original-heldout-first-run
          run-id: 42185484483
          github-token: ${{ github.token }}
          path: original
      - name: Verify and archive unaltered full data
        shell: bash
        run: |
          set -euo pipefail
          mv original out
          sha256sum -c out/SHA256SUMS.txt
          test "$(sha256sum out/i3-p4a-validation-full.json | cut -d ' ' -f1)" = "44adb1192d1aea87cf5d96a547f794de6f7fe33a566a5de90747a34429e8e8d6"
          python - <<'PY'
          import json
          from hashlib import sha256
          p=json.load(open("out/i3-p4a-validation-full.json"))
          digest=sha256(json.dumps({k:v for k,v in p.items() if k!="sha256"},sort_keys=True,separators=(",",":")).encode()).hexdigest()
          assert digest==p["sha256"]=="3fe21087283eeafb8e9b0fc2522b238ea700611029a7f02b1edf3b89b2a3b3c5"
          assert p["total_lives"]==len(p["lives"])==288
          assert p["source_sha"]=="01132efef08edb23143c4618d1a2491b23026eb4"
          assert p["schedule_sha256"]=="7d5785eca2f65b1562c2dca22bc4bd65f930250e8a0b032df18a030b22b38289"
          assert p["status"]=="P4A_VALIDATION_ONLY_P4B_AND_RESERVE_NOT_RUN"
          print("P4a exact original verified",len(p["lives"]))
          PY
          folder=src/i3/docs/studies/p4a-g2-heldout
          mkdir -p "$folder"
          gzip -n -9 -c out/i3-p4a-validation-full.json > "$folder/validation-full.json.gz"
          cp out/i3-p4a-validation-summary.json "$folder/validation-summary.json"
          cp out/SHA256SUMS.txt "$folder/ORIGINAL_SHA256SUMS.txt"
          git checkout -b i3/p4a-heldout-evidence-20261106
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$folder"
          git commit -m "research(i3 P4a): archive original 288 heldout lives and source receipts"
          git push origin HEAD:refs/heads/i3/p4a-heldout-evidence-20261106
