name: I1 A2.32 lived learning scientific audit

on:
  # Prior experimental campaign: manual only, not I1 acceptance.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a232-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paired-lived-learning:
    name: A2.32 64 mortal lives (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Execute lives and report unfiltered negative outcomes
        run: |
          python scripts/run_i1_a232_learning.py --output "a232-py${{ matrix.python-version }}" --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Preserve raw per-life external records and independent WALs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a232-lived-cohort-py${{ matrix.python-version }}
          path: a232-py${{ matrix.python-version }}/
          retention-days: 90
          if-no-files-found: warn
