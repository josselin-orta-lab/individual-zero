name: I2 proposal-only safety (no engine execution)

on:
  pull_request:
    branches: [main]
    paths:
      # Archived I2 sources/tests are SHA-frozen; PRs get only static denial checks.
      # Full 3.11/3.12 historical suite is manual-only, never ordinary PR CI.
      - 'src/i2/**'
      - '!src/i2/docs/**'
      - '!src/i2/README.md'
      - '!src/i2/AGENTS.md'
      - 'tests/i2/**'
      - 'tools/i2_ci_shards.py'
      - 'tools/assess_engine_proposal.py'
      # Structural policy changes must be validated without an I1 birth.
      - 'scripts/check_engine_repository.py'
      - 'tests/test_engine_repository.py'
      - '.github/workflows/i2-proposal-safety.yml'
  workflow_dispatch:
    inputs:
      archive_review:
        description: 'Explicit historical I2 software audit only, NOT new scientific cohorts'
        type: choice
        required: true
        options:
          - I2_EXPLICIT_HISTORICAL_TECHNICAL_AUDIT

permissions:
  contents: read

concurrency:
  group: i2-proposal-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inert-proposal:
    if: github.event_name == 'pull_request' || github.event.inputs.archive_review == 'I2_EXPLICIT_HISTORICAL_TECHNICAL_AUDIT'
    name: I2 inactive proposal (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Keep the two Python versions and the original full suite for explicit
    # historical technical review. PRs must fail quickly on archive drift,
    # cannot run paid synthetic I2 research lives by a documentation edit.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Exact reviewed PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Source-locked I2 archive and registered generation boundaries (PR-safe)
        run: |
          python tools/check_i2_archive.py --json
          python -m unittest discover -s tests -p test_historical_generation_archive.py -v
          python scripts/check_engine_contracts.py --json
          python scripts/check_engine_repository.py --json
          python -m unittest discover -s tests -p test_engine_repository.py -v
      - name: Independent proposal assessment (expected BLOCKED)
        run: |
          python tools/assess_engine_proposal.py --generation I2 --json > i2-assessment.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("i2-assessment.json").read_text())
          # A pure policy exists, but there is still no living Lab or runtime.
          expected_missing = set()
          assert r["checks"]["lab_implementation_present"] is True, r
          assert r["status"] == "STRUCTURE_PRESENT_REVIEW_REQUIRED", r
          assert set(r["blocked_by"]) == expected_missing, r["blocked_by"]
          assert r["checks"]["cognition_implementation_present"] is True, r
          assert r["checks"]["independent_tests_present"] is True, r
          assert r["activation"] == "FORBIDDEN", r
          assert r["registration"] == "FORBIDDEN", r
          assert r["scientific_evidence"] == "NOT_EVALUATED", r
          assert r["test_execution"] == "NOT_PERFORMED", r
          assert r["human_review_required"] is True, r
          print("I2_PROPOSAL_POLICY_INERT_GUARD_PASS")
          PY
      - name: Full archived I2 test suite (explicit manual audit ONLY)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.archive_review == 'I2_EXPLICIT_HISTORICAL_TECHNICAL_AUDIT'
        run: |
          python tools/i2_ci_shards.py
          python -m compileall -q src/i2 tests/i2