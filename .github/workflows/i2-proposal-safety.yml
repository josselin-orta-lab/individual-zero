name: I2 proposal-only safety (no engine execution)

on:
  pull_request:
    branches: [main]
    paths:
      # I2 source or fixtures still require the full inert-proposal checks.
      # Pure documentation changes use agent-context-static.yml instead.
      - 'src/i2/**'
      - '!src/i2/docs/**'
      - '!src/i2/README.md'
      - '!src/i2/AGENTS.md'
      - 'tests/i2/**'
      - 'tools/assess_engine_proposal.py'
      # Structural policy changes must be validated without an I1 birth.
      - 'scripts/check_engine_repository.py'
      - 'tests/test_engine_repository.py'
      - '.github/workflows/i2-proposal-safety.yml'

permissions:
  contents: read

concurrency:
  group: i2-proposal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inert-proposal:
    name: I2 inactive proposal (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Exact reviewed PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Isolated I2 policy and scaffold tests (no birth)
        run: |
          python -m unittest discover -s tests/i2 -p 'test_*.py' -v
          python -m compileall -q src/i2 tests/i2
      - name: Registered generation boundaries (static only, no I1 runtime)
        run: |
          python scripts/check_engine_repository.py --json
          python -m unittest discover -s tests -p test_engine_repository.py -v
      - name: Independent proposal assessment (expected BLOCKED)
        run: |
          python tools/assess_engine_proposal.py --generation I2 --json > i2-assessment.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("i2-assessment.json").read_text())
          # A pure policy exists, but there is still no living Lab or runtime.
          expected_missing = {"runtime_implementation_present"}
          assert r["checks"]["lab_implementation_present"] is True, r
          assert r["status"] == "BLOCKED", r
          assert set(r["blocked_by"]) == expected_missing, r["blocked_by"]
          assert r["checks"]["cognition_implementation_present"] is True, r
          assert r["checks"]["independent_tests_present"] is True, r
          assert r["activation"] == "FORBIDDEN", r
          assert r["registration"] == "FORBIDDEN", r
          assert r["scientific_evidence"] == "NOT_EVALUATED", r
          assert r["test_execution"] == "NOT_PERFORMED", r
          assert r["human_review_required"] is True, r
          print("I2_PROPOSAL_POLICY_INERT_GUARD_PASS")
          PY