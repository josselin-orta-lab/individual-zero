name: 'I1 #318 verify four-arm first physical Q forks'
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'tools/audit_i1_318_matched_four_arm_first_fork.py'
      - 'tests/i1/test_i1_318_four_arm_fork_guard.py'
      - '.github/workflows/i1-issue318-matched-four-arm-fork.yml'
permissions:
  contents: read
  actions: read
jobs:
  authenticate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m py_compile tools/audit_i1_318_matched_four_arm_first_fork.py
      - run: python -m unittest discover -s tests/i1 -p test_i1_318_four_arm_fork_guard.py -v
      - uses: actions/download-artifact@v4
        with:
          run-id: 39407509122
          github-token: ${{ github.token }}
          pattern: i1-318-matched-twin-*
          path: original
          merge-multiple: true
      - name: Certify original 32 WAL before interpreting first four-way forks
        run: |
          python tools/audit_i1_318_matched_four_arm_first_fork.py --root original --output matched-four-arm-forks.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("matched-four-arm-forks.json").read_text())
          assert d["original_verified_WAL"]==32
          assert len(d["blocks"])==8
          assert d["scientific_verdict"]=="INCONCLUSIVE"
          print("I1_318_FOUR_WAY_FORK_AUDIT_COMPLETED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-318-matched-four-arm-physical-fork-certificate
          path: matched-four-arm-forks.json
          retention-days: 30
          if-no-files-found: warn
