name: A2-R postflight cold census pure tests
on:
  pull_request:
    paths:
      - 'tools/research/i1_a2r_postflight.py'
      - 'tools/research/i1_a2r_geo_intrinsic_join.py'
      - 'tools/research/tests/test_i1_a2r_geo_intrinsic_join.py'
      - 'tools/research/tests/test_i1_a2r_postflight.py'
      - 'tools/research/i1_a2r_control_cold.py'
      - 'tools/research/i1_a2r_candidate_provenance.py'
      - 'tools/research/i1_a2r_q_coexposure.py'
      - 'tools/research/tests/test_i1_a2r_q_coexposure.py'
      - 'tools/research/tests/test_i1_a2r_candidate_provenance.py'
      - 'tools/research/tests/test_i1_a2r_control_cold.py'
      - '.github/workflows/i1-a2r-postflight-pure.yml'
permissions:
  contents: read
jobs:
  pure_postflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=tools:tools/research python -m unittest discover -s tools/research/tests -p test_i1_a2r_postflight.py -v
      - run: PYTHONPATH=tools:tools/research python -m unittest discover -s tools/research/tests -p test_i1_a2r_geo_intrinsic_join.py -v
      - run: PYTHONPATH=tools:tools/research python -m unittest discover -s tools/research/tests -p test_i1_a2r_control_cold.py -v
      - run: PYTHONPATH=tools:tools/research python -m unittest discover -s tools/research/tests -p test_i1_a2r_candidate_provenance.py -v
      - run: PYTHONPATH=tools:tools/research python -m unittest discover -s tools/research/tests -p test_i1_a2r_q_coexposure.py -v
