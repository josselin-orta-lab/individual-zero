name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run bootstrap smoke execution
        run: individual-zero --cycles 3 --seed 0 --run-id ci-smoke --output /tmp/individual-zero-ci.jsonl

      - name: Stage 8 reference and online-state metrics
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          from pathlib import Path
          from lab.stage8_reference_fixture import build_stage8_reference_runtime

          runtime = build_stage8_reference_runtime()
          for _ in range(300):
              outcome = runtime.run_step()
              if outcome.execution_status != "applied":
                  raise SystemExit(f"unexpected Stage 8 outcome: {outcome.execution_status}")
          if not runtime.journal.verify():
              raise SystemExit("invalid Stage 8 journal")
          payload = runtime.journal.canonical_bytes()
          Path("/tmp/stage8-reference.jsonl").write_bytes(payload + b"\n")
          q = runtime.q_active.export_causal_state()
          kappa = runtime.kappa_active.export_causal_state()
          print(f"stage8_bytes={len(payload)}")
          print(f"stage8_head={runtime.journal.head_hash}")
          print(f"stage8_q_signatures={len(q['weights'])}")
          print(f"stage8_q_updates={sum(q['update_counts'].values())}")
          print(f"stage8_kappa_version={kappa['version']}")
          print(f"stage8_kappa_keys={len(kappa['counters'])}")
          print(f"stage8_f_cog={runtime.metacognition.state.f_cog_uc_counter}")
          if not q['weights'] or not kappa['counters']:
              raise SystemExit("Stage 8 Q and kappa must both evolve")
          repeat = build_stage8_reference_runtime()
          for _ in range(300):
              if repeat.run_step().execution_status != "applied":
                  raise SystemExit("Stage 8 replay execution diverged")
          if repeat.journal.canonical_bytes() != payload:
              raise SystemExit("Stage 8 300-step journal replay diverged")
          if repeat.journal.head_hash != runtime.journal.head_hash:
              raise SystemExit("Stage 8 300-step golden heads differ")
          if repeat.q_active.export_causal_state() != q:
              raise SystemExit("Stage 8 Q_active replay diverged")
          if repeat.kappa_active.export_causal_state() != kappa:
              raise SystemExit("Stage 8 kappa_active replay diverged")
          print("stage8_reference_second_run_exact=true")
          PY

      - name: Upload Stage 8 reference journal
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: stage8-reference-journal
          path: /tmp/stage8-reference.jsonl
          if-no-files-found: error

      - name: Fetch retained historical Stage 7 reference journal
        if: matrix.python-version == '3.11'
        uses: actions/download-artifact@v4
        with:
          name: stage7-reference-journal
          run-id: 37778385047
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/historical-stage7

      - name: Diagnose Stage 7 historical artifact divergence
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          from pathlib import Path
          from lab.stage7_reference_fixture import build_stage7_reference_runtime
          r = build_stage7_reference_runtime()
          for _ in range(300):
              r.run_step()
          historical = Path('/tmp/historical-stage7/stage7-reference.jsonl').read_bytes().splitlines()
          current = r.journal.canonical_bytes().splitlines()
          print('stage7_historical_artifact_event_count=',len(historical))
          print('stage7_current_event_count=',len(current))
          print('stage7_current_head=',r.journal.head_hash)
          for i,(a,b) in enumerate(zip(historical,current)):
              if a != b:
                  print('stage7_first_historical_divergence_index=',i)
                  print('stage7_old_event=',a[:1800].decode('utf8'))
                  print('stage7_current_event=',b[:1800].decode('utf8'))
                  break
          PY
      - name: Generate Stage 1 reference journal
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          from pathlib import Path
          from lab.compute_budget import ComputeBudgetConfig
          from lab.stage1_runtime import ScriptedStage1Runtime

          budget = ComputeBudgetConfig(
              version="stage1-ci-v1",
              cycle_ceiling=100,
              module_envelopes={"stage1_fixture": 100},
              protected_modules=frozenset({"stage1_fixture"}),
              protected_capacity=10,
              operation_costs={"fixture_op": 1},
          )
          runtime = ScriptedStage1Runtime(
              campaign_seed=17,
              budget_config=budget,
          )
          for _ in range(3):
              runtime.run_step(cycle=1)

          path = Path("/tmp/stage1-reference.jsonl")
          payload = runtime.journal.canonical_bytes()
          path.write_bytes(payload + (b"\n" if payload else b""))
          if not runtime.journal.verify():
              raise SystemExit("stage1 reference journal failed verification")
          print(f"stage1_reference_bytes={len(payload)}")
          print(f"stage1_reference_head={runtime.journal.head_hash}")
          expected = "67a43e32bb6f8bb053ece7a1d7ba36d50ec773725922b931d6bb377b023b37a4"
          if runtime.journal.head_hash != expected:
              raise SystemExit(
                  f"Stage 1 reference regression: {runtime.journal.head_hash} != {expected}"
              )
          PY

      - name: Upload Stage 1 reference journal
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: stage1-reference-journal
          path: /tmp/stage1-reference.jsonl
          if-no-files-found: error

      - name: Generate Stage 2 reference journal
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          from pathlib import Path
          from i0.config import MVP_CYCLE_PHASE_COMPONENT_ORDER
          from lab.safety_protocol import SafetyProtocolConfig
          from lab.stage2_runtime import ScriptedStage2Runtime
          from lab.world import (
              BerryEffect,
              BodyState,
              Command,
              Position,
              ToolRecipe,
              WorldLayout,
              WorldPhysicsConfig,
          )

          physics = WorldPhysicsConfig(
              version="stage2-ci-reference-v1",
              width=32,
              height=32,
              day_steps=300,
              night_steps=100,
              night_start_step=200,
              initial_body=BodyState(50.0, 60.0, 60.0, 100.0),
              initial_position=Position(2, 2),
              food_decay_per_step=0.1,
              water_decay_per_step=0.2,
              action_energy_costs={
                  "se_deplacer": 0.5,
                  "collecter": 0.5,
                  "manger": 0.2,
                  "boire": 0.2,
                  "poser_une_pierre": 0.5,
                  "fabriquer_outil": 0.5,
                  "dormir": 0.0,
                  "attendre": 0.0,
              },
              sleep_energy_gain=1.0,
              rest_integrity_gain=0.0,
              drink_water_gain=10.0,
              berry_effects={
                  "berry_a": BerryEffect(5.0, 0.0),
                  "berry_b": BerryEffect(5.0, -100.0),
              },
              creature_damage=10.0,
              danger_zone_damage=15.0,
              tool_recipe=ToolRecipe(1, 1, 2),
          )
          runtime = ScriptedStage2Runtime(
              config=physics,
              layout=WorldLayout(),
              phase_component_order=MVP_CYCLE_PHASE_COMPONENT_ORDER,
              safety_config=SafetyProtocolConfig(
                  version="stage2-ci-safety-v1",
                  lethal_max=2,
                  mode="campaign",
              ),
          )
          for _ in range(300):
              runtime.open_step()
              outcome = runtime.execute(Command("attendre"))
              if outcome.status != "applied":
                  raise SystemExit(f"unexpected Stage 2 outcome: {outcome.status}")

          payload = runtime.journal.canonical_bytes()
          path = Path("/tmp/stage2-reference.jsonl")
          path.write_bytes(payload + (b"\n" if payload else b""))
          if not runtime.journal.verify():
              raise SystemExit("stage2 reference journal failed verification")
          print(f"stage2_reference_bytes={len(payload)}")
          print(f"stage2_reference_head={runtime.journal.head_hash}")
          expected = "3fe29db59f10b5518ac45575d3f8ca1d8c5666ff528ad036cbe1397046ec53bd"
          if runtime.journal.head_hash != expected:
              raise SystemExit(
                  f"Stage 2 reference regression: {runtime.journal.head_hash} != {expected}"
              )
          PY

      - name: Upload Stage 2 reference journal
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: stage2-reference-journal
          path: /tmp/stage2-reference.jsonl
          if-no-files-found: error

      - name: Generate Stage 3 reference journal
        if: matrix.python-version == '3.11'
