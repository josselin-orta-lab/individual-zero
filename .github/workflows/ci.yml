              raise SystemExit("stage3 reference journal failed verification")
          print(f"stage3_reference_bytes={len(payload)}")
          print(f"stage3_reference_head={runtime.journal.head_hash}")
          expected = "b088023fb83298e2c32b8a66cd4b2dc1fc21a587945a6c103b9a32586f210f09"
          if runtime.journal.head_hash != expected:
              raise SystemExit(
                  f"Stage 3 reference regression: {runtime.journal.head_hash} != {expected}"
              )
          PY

      - name: Upload Stage 3 reference journal
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: stage3-reference-journal
          path: /tmp/stage3-reference.jsonl
          if-no-files-found: error

      - name: Generate Stage 4 reference journal
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          from pathlib import Path
          from lab.stage4_reference_fixture import build_stage4_reference_runtime

          runtime = build_stage4_reference_runtime()
          for _ in range(300):
              outcome = runtime.run_step()
              if outcome.execution_status != "applied":
                  raise SystemExit(
                      f"unexpected Stage 4 outcome: {outcome.execution_status}"
                  )

          if runtime.world.position.x != 4 or runtime.world.position.y != 2:
              raise SystemExit(
                  f"unexpected Stage 4 final position: {runtime.world.position}"
              )
          if runtime.world.body.water != 60.0:
              raise SystemExit(
                  f"unexpected Stage 4 final water: {runtime.world.body.water}"
              )

          payload = runtime.journal.canonical_bytes()
          path = Path("/tmp/stage4-reference.jsonl")
          path.write_bytes(payload + (b"\n" if payload else b""))
          if not runtime.journal.verify():
              raise SystemExit("stage4 reference journal failed verification")
          print(f"stage4_reference_bytes={len(payload)}")
          print(f"stage4_reference_head={runtime.journal.head_hash}")
          print(
              "stage4_f_cog_uc="
              f"{runtime.metacognition.state.f_cog_uc_counter}"
          )
          expected = "87e2de3c49f07bafa8026ef785e5e50abf38c98314e780b3e2c5107bf26bdac8"
          if runtime.journal.head_hash != expected:
              raise SystemExit(
                  f"Stage 4 reference regression: {runtime.journal.head_hash} != {expected}"
              )
          if runtime.metacognition.state.f_cog_uc_counter != 9551:
              raise SystemExit(
                  "Stage 4 F_cog UC regression: "
                  f"{runtime.metacognition.state.f_cog_uc_counter} != 9551"
              )
          PY

      - name: Upload Stage 4 reference journal
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: stage4-reference-journal
          path: /tmp/stage4-reference.jsonl
          if-no-files-found: error


      - name: Generate Stage 6 reference journal
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          from pathlib import Path
          from lab.stage6_reference_fixture import build_stage6_reference_runtime

          runtime = build_stage6_reference_runtime()
          for _ in range(300):
              outcome = runtime.run_step()
              if outcome.execution_status != "applied":
                  raise SystemExit(
                      f"unexpected Stage 6 outcome: {outcome.execution_status}"
                  )

