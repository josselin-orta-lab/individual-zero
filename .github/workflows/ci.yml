          )
          expected = "3b0319a318039a0a759ded929835215a94113922ede43e9a5e4553ba56b643e9"
          if runtime.journal.head_hash != expected:
              raise SystemExit(
                  f"Stage 5 reference regression: {runtime.journal.head_hash} != {expected}"
