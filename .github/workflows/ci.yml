              raise SystemExit(
                  f"unexpected Stage 6 final position: {runtime.world.position}"
              )
          if runtime.world.body.water != 60.0:
              raise SystemExit(
                  f"unexpected Stage 6 final water: {runtime.world.body.water}"
              )
