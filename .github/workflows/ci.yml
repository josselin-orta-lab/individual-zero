name: CI

# Automatic review gate is intentionally light; exhaustive cross-version CI is manual.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
    branches:
      - main
      - 'i0/stage*'
      - 'runtime/*'
      - 'world/*'
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'setup.py'
      - 'setup.cfg'
      - 'tox.ini'
      - 'scripts/**'
      - 'docs/architecture/reference/en/mvp-specification-v1.2.1.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && 'manual-full' || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  quick-checks:
    name: quick-unit-tests (Python 3.12)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'labeled' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -q
      - name: Run bootstrap smoke execution
        run: individual-zero --cycles 3 --seed 0 --run-id ci-smoke --output /tmp/individual-zero-ci.jsonl

  test:
    name: full-validation (Python ${{ matrix.python-version }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'ci-full')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run bootstrap smoke execution
        run: individual-zero --cycles 3 --seed 0 --run-id ci-smoke --output /tmp/individual-zero-ci.jsonl

      - name: Generate Stage 1 reference journal
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          from pathlib import Path
          from lab.compute_budget import ComputeBudgetConfig
          from lab.stage1_runtime import ScriptedStage1Runtime

          budget = ComputeBudgetConfig(
              version="stage1-ci-v1",
              cycle_ceiling=100,
              module_envelopes={"stage1_fixture": 100},
              protected_modules=frozenset({"stage1_fixture"}),
              protected_capacity=10,
              operation_costs={"fixture_op": 1},
          )
          runtime = ScriptedStage1Runtime(
              campaign_seed=17,
              budget_config=budget,
          )
          for _ in range(3):
              runtime.run_step(cycle=1)

          path = Path("/tmp/stage1-reference.jsonl")
          payload = runtime.journal.canonical_bytes()
          path.write_bytes(payload + (b"\n" if payload else b""))
          if not runtime.journal.verify():
              raise SystemExit("stage1 reference journal failed verification")
          print(f"stage1_reference_bytes={len(payload)}")
          print(f"stage1_reference_head={runtime.journal.head_hash}")
          PY

      - name: Upload Stage 1 reference journal
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: stage1-reference-journal
          path: /tmp/stage1-reference.jsonl
          if-no-files-found: error
