          from pathlib import Path
          from i0.config import MVP_CYCLE_PHASE_COMPONENT_ORDER
          from i0.modules import StaticSafetyFacts
          from lab.safety_protocol import SafetyProtocolConfig
          from lab.stage3_runtime import Stage3Runtime
          from lab.world import (
              BerryEffect,
              BodyState,
              Position,
              ToolRecipe,
              WorldLayout,
              WorldPhysicsConfig,
          )

          physics = WorldPhysicsConfig(
              version="stage3-ci-reference-v1",
              width=32,
              height=32,
              day_steps=300,
              night_steps=100,
              night_start_step=200,
              initial_body=BodyState(50.0, 60.0, 60.0, 100.0),
              initial_position=Position(2, 2),
              food_decay_per_step=0.1,
              water_decay_per_step=0.2,
              action_energy_costs={
                  "se_deplacer": 0.5,
                  "collecter": 0.5,
                  "manger": 0.2,
                  "boire": 0.2,
                  "poser_une_pierre": 0.5,
                  "fabriquer_outil": 0.5,
                  "dormir": 0.0,
                  "attendre": 0.0,
              },
              sleep_energy_gain=1.0,
              rest_integrity_gain=0.0,
              drink_water_gain=10.0,
              berry_effects={
                  "berry_a": BerryEffect(5.0, 0.0),
                  "berry_b": BerryEffect(5.0, -100.0),
              },
              creature_damage=10.0,
              danger_zone_damage=15.0,
              tool_recipe=ToolRecipe(1, 1, 2),
          )
          runtime = Stage3Runtime(
              config=physics,
              layout=WorldLayout(
                  creatures=frozenset({Position(3, 2)}),
              ),
              phase_component_order=MVP_CYCLE_PHASE_COMPONENT_ORDER,
              safety_config=SafetyProtocolConfig(
                  version="stage3-ci-safety-v1",
                  lethal_max=2,
                  mode="campaign",
              ),
              safety_facts=StaticSafetyFacts(),
              protected_integrity_threshold=20.0,
          )
          for _ in range(300):
              runtime.open_step()
              outcome = runtime.run_step()
              if outcome.execution_status != "applied":
                  raise SystemExit(
                      f"unexpected Stage 3 outcome: {outcome.execution_status}"
                  )

          payload = runtime.journal.canonical_bytes()
          path = Path("/tmp/stage3-reference.jsonl")
          path.write_bytes(payload + (b"\n" if payload else b""))
          if not runtime.journal.verify():
              raise SystemExit("stage3 reference journal failed verification")
          print(f"stage3_reference_bytes={len(payload)}")
          print(f"stage3_reference_head={runtime.journal.head_hash}")
          expected = "b088023fb83298e2c32b8a66cd4b2dc1fc21a587945a6c103b9a32586f210f09"
          if runtime.journal.head_hash != expected:
              raise SystemExit(
                  f"Stage 3 reference regression: {runtime.journal.head_hash} != {expected}"
              )
          PY

      - name: Upload Stage 3 reference journal
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: stage3-reference-journal
          path: /tmp/stage3-reference.jsonl
          if-no-files-found: error

      - name: Generate Stage 4 reference journal
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          from pathlib import Path
          from lab.stage4_reference_fixture import build_stage4_reference_runtime

          runtime = build_stage4_reference_runtime()
          for _ in range(300):
              outcome = runtime.run_step()
              if outcome.execution_status != "applied":
                  raise SystemExit(
                      f"unexpected Stage 4 outcome: {outcome.execution_status}"
                  )

          if runtime.world.position.x != 4 or runtime.world.position.y != 2:
              raise SystemExit(
                  f"unexpected Stage 4 final position: {runtime.world.position}"
              )
          if runtime.world.body.water != 60.0:
              raise SystemExit(
                  f"unexpected Stage 4 final water: {runtime.world.body.water}"
              )

          payload = runtime.journal.canonical_bytes()
          path = Path("/tmp/stage4-reference.jsonl")
          path.write_bytes(payload + (b"\n" if payload else b""))
          if not runtime.journal.verify():
              raise SystemExit("stage4 reference journal failed verification")
          print(f"stage4_reference_bytes={len(payload)}")
          print(f"stage4_reference_head={runtime.journal.head_hash}")
          print(
              "stage4_f_cog_uc="
              f"{runtime.metacognition.state.f_cog_uc_counter}"
          )
          expected = "87e2de3c49f07bafa8026ef785e5e50abf38c98314e780b3e2c5107bf26bdac8"
          if runtime.journal.head_hash != expected:
              raise SystemExit(
                  f"Stage 4 reference regression: {runtime.journal.head_hash} != {expected}"
              )
          if runtime.metacognition.state.f_cog_uc_counter != 9551:
              raise SystemExit(
                  "Stage 4 F_cog UC regression: "
                  f"{runtime.metacognition.state.f_cog_uc_counter} != 9551"
              )
          PY

      - name: Upload Stage 4 reference journal
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: stage4-reference-journal
          path: /tmp/stage4-reference.jsonl
          if-no-files-found: error


      - name: Generate Stage 5 reference journal
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          from pathlib import Path
          from lab.stage5_reference_fixture import build_stage5_reference_runtime

          runtime = build_stage5_reference_runtime()
