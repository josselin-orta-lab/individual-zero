name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run bootstrap smoke execution
        run: individual-zero --cycles 3 --seed 0 --run-id ci-smoke --output /tmp/individual-zero-ci.jsonl

      - name: Stage 9 matched hydration contrast (diagnostic, not acceptance)
        if: matrix.python-version == '3.12'
        run: |
          python -m lab.stage9_hydration_contrast_report | tee /tmp/stage9-hydration-contrast.jsonl

      - name: Upload Stage 9 hydration contrast evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: stage9-hydration-contrast-diagnostic
          path: /tmp/stage9-hydration-contrast.jsonl
          if-no-files-found: error

      # Evidence publishing is not Stage-9 scientific acceptance. The
      # laboratory must still preregister the threshold and obtain real
      # independent naturally acquired causal candidates before the Golden.
      - name: Stage 9 evidence bundle (diagnostic, not acceptance)
        if: matrix.python-version == '3.12'
        run: |
          python -m lab.stage9_acceptance_report > /tmp/stage9-acceptance-diagnostic.json
          python - <<'PY'
          from pathlib import Path
          from lab.stage9_spontaneous_superstition_matrix import run_spontaneous_superstition_matrix
          # Must match acceptance-report default (seed 42, then 43 and 44),
          # rather than the standalone matrix's exploratory defaults.
          result = run_spontaneous_superstition_matrix(
              seeds=(42, 43, 44), steps=14,
          )
          Path("/tmp/stage9-spontaneous-matrix-diagnostic.json").write_text(
              result.to_json(), encoding="utf-8",
          )
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          from lab.determinism import canonical_causal_bytes, sha256_hex

          acceptance = json.loads(Path(
              "/tmp/stage9-acceptance-diagnostic.json"
          ).read_text(encoding="utf-8"))
          expected_digest = acceptance.pop("evidence_sha256")
          if sha256_hex(canonical_causal_bytes(acceptance)) != expected_digest:
              raise SystemExit("Stage 9 acceptance artifact digest differs")
          if acceptance["acceptance_status"] != "open" or acceptance["golden_stage9_frozen"]:
              raise SystemExit("Stage 9 diagnostic was incorrectly promoted to Golden")
          checks = {row["criterion"]: row for row in acceptance["checks"]}
          matrix = json.loads(Path(
              "/tmp/stage9-spontaneous-matrix-diagnostic.json"
          ).read_text(encoding="utf-8"))
          matrix_digest = matrix.pop("digest")
          if sha256_hex(canonical_causal_bytes(matrix)) != matrix_digest:
              raise SystemExit("Stage 9 full multiworld artifact digest differs")
          runs = matrix["runs"]
          opportunities = sum(len(row["spontaneous_candidate_refs"]) for row in runs)
          established = sum(len(row["spontaneous_established_false_refs"]) for row in runs)
          if (
              opportunities != matrix["spontaneously_observed_candidates"]
              or established != matrix["established_false_rules"]
              or any(not set(row["spontaneous_established_false_refs"]).issubset(
                  row["spontaneous_candidate_refs"]
              ) for row in runs)
              or matrix["natural_false_rule_rate"] != (
                  None if opportunities == 0 else established / opportunities
              )
          ):
              raise SystemExit("Stage 9 multiworld numerator/denominator inconsistent")
          superstition = checks["superstitious_rules_under_random_reward"]["evidence"]
          if (
              matrix_digest != superstition["spontaneous_matrix_sha256"]
              or matrix["evaluation_status"] != superstition["spontaneous_evaluation_status"]
              or matrix["spontaneously_observed_candidates"] != superstition["spontaneous_candidate_count"]
              or matrix["natural_false_rule_rate"] != superstition["spontaneous_diagnostic_rate"]
          ):
              raise SystemExit("Stage 9 multiworld evidence and acceptance report differ")
          print("stage9_diagnostic_bundle=" + json.dumps({
              "acceptance": acceptance["acceptance_status"],
              "golden_frozen": acceptance["golden_stage9_frozen"],
              "acceptance_digest": expected_digest,
              "multiworld_digest": matrix_digest,
              "natural_candidates": matrix["spontaneously_observed_candidates"],
              "false_rule_rate": matrix["natural_false_rule_rate"],
              "scientific_status": matrix["evaluation_status"],
          }, sort_keys=True))
          PY

      - name: Upload Stage 9 diagnostic evidence bundle
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: stage9-acceptance-diagnostics
          path: |
            /tmp/stage9-acceptance-diagnostic.json
            /tmp/stage9-spontaneous-matrix-diagnostic.json
          if-no-files-found: error

      - name: Stage 8 preregistered physical κ stress Brier gate
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from lab.stage8_calibration_stress import controlled_physical_calibration
          report = controlled_physical_calibration()
          result = {
              "protocol_version": report.version,
              "independent_physical_observations": report.credited_observations,
              "confirmations": report.confirmations,
              "contradictions": report.contradictions,
              "brier_early": report.early_brier,
              "brier_late": report.late_brier,
              "brier_neutral": report.baseline_brier,
          }
          Path("/tmp/stage8-physical-kappa.json").write_text(
              json.dumps(result, sort_keys=True, indent=2) + "\\n", encoding="utf8"
          )
          print("stage8_physical_kappa=" + json.dumps(result, sort_keys=True))
          if not (report.credited_observations == 80
                  and report.confirmations > 0 and report.contradictions > 0
                  and report.late_brier < report.early_brier
                  and report.late_brier < report.baseline_brier):
              raise SystemExit("Stage 8 κ independent physical Brier gate failed")
          second = controlled_physical_calibration()
          if second != report:
              raise SystemExit("Stage 8 physical calibration replay differs")
          print("stage8_physical_kappa_replay_exact=true")
          PY

      - name: Upload Stage 8 physical κ calibration
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: stage8-physical-kappa-calibration
          path: /tmp/stage8-physical-kappa.json
          if-no-files-found: error

      - name: Stage 8 physical learning and prequential calibration curves
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from lab.stage8_learning_benchmark import (
              world_learning_curve, Stage8PhysicalCalibrationRecorder,
          )
          from lab.stage8_reference_fixture import build_stage8_reference_runtime
          td = world_learning_curve(pairs=80, interval=20)
          if not td.points[-1].rmse_against_observed_return < td.points[0].rmse_against_observed_return:
              raise SystemExit("Stage 8 physical-world TD learning did not improve")
          recorder = Stage8PhysicalCalibrationRecorder()
          runtime = build_stage8_reference_runtime()
          for _ in range(300):
              confidence = recorder.before_step(runtime)
              result = runtime.run_step()
              if result.execution_status != "applied":
                  raise SystemExit("Stage 8 calibration-world execution not applied")
              recorder.after_step(runtime, confidence)
          curve = recorder.curve()
          report = {
              "protocol_version": td.protocol_version,
              "td_world_version": td.world_version,
              "td_sample_count": td.sample_count,
              "td_measured_rewards": [td.measured_reward_drink, td.measured_reward_wait],
              "td_points": [
                  {"step": p.observed_steps, "q_drink": p.q_drink,
                   "q_wait": p.q_wait, "rmse": p.rmse_against_observed_return}
                  for p in td.points
              ],
              "calibration_count": len(curve.samples),
              "brier_first_half": curve.initial_brier,
              "brier_second_half": curve.late_brier,
              "brier_neutral_baseline": curve.baseline_brier,
              "brier_decreased": (
                  None if curve.initial_brier is None or curve.late_brier is None
                  else curve.late_brier < curve.initial_brier
              ),
          }
          Path("/tmp/stage8-learning-benchmark.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\\n", encoding="utf-8"
          )
          print("stage8_learning_benchmark=" + json.dumps(report, sort_keys=True))
          if not curve.samples:
              print("stage8_brier_gate=inconclusive_no_credited_physical_comparisons")
          elif report["brier_decreased"] is not True:
              print("stage8_brier_gate=not_yet_demonstrated")
          else:
              print("stage8_brier_gate=observed_decrease")
          PY

      - name: Upload Stage 8 learning and calibration curves
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: stage8-learning-benchmark
          path: /tmp/stage8-learning-benchmark.json
          if-no-files-found: error

      - name: Stage 8 reference and online-state metrics
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          from pathlib import Path
          from lab.stage8_reference_fixture import build_stage8_reference_runtime

          runtime = build_stage8_reference_runtime()
          for _ in range(300):
              outcome = runtime.run_step()
              if outcome.execution_status != "applied":
                  raise SystemExit(f"unexpected Stage 8 outcome: {outcome.execution_status}")
          if not runtime.journal.verify():
              raise SystemExit("invalid Stage 8 journal")
          payload = runtime.journal.canonical_bytes()
          Path("/tmp/stage8-reference.jsonl").write_bytes(payload + b"\n")
          q = runtime.q_active.export_causal_state()
          kappa = runtime.kappa_active.export_causal_state()
          print(f"stage8_bytes={len(payload)}")
          print(f"stage8_head={runtime.journal.head_hash}")
          print(f"stage8_q_signatures={len(q['weights'])}")
          print(f"stage8_q_updates={sum(q['update_counts'].values())}")
          print(f"stage8_kappa_version={kappa['version']}")
          print(f"stage8_kappa_keys={len(kappa['counters'])}")
          print(f"stage8_f_cog={runtime.metacognition.state.f_cog_uc_counter}")
          # Fixed only after a verified second identical 300-step execution.
          expected = "0a2dc62d4ba51722a96f307fdf6c7427d1aa3b0a8a3c0e21da81bc490eb23cf8"
          if runtime.journal.head_hash != expected:
              raise SystemExit(
                  "Stage 8 golden regression: "
                  f"{runtime.journal.head_hash} != {expected}"
              )
          if len(payload) != 35061323:
              raise SystemExit(f"Stage 8 journal size regression: {len(payload)}")
          if sum(q["update_counts"].values()) != 597 or len(q["weights"]) != 2:
              raise SystemExit("Stage 8 Q_active evolution regression")
          if len(kappa["counters"]) != 1 or kappa["version"] != 1498:
              raise SystemExit("Stage 8 kappa_active evolution regression")
          if runtime.metacognition.state.f_cog_uc_counter != 9593:
              raise SystemExit("Stage 8 F_cog regression")
          if not q['weights'] or not kappa['counters']:
              raise SystemExit("Stage 8 Q and kappa must both evolve")
          repeat = build_stage8_reference_runtime()
          for _ in range(300):
              if repeat.run_step().execution_status != "applied":
                  raise SystemExit("Stage 8 replay execution diverged")
          if repeat.journal.canonical_bytes() != payload:
              raise SystemExit("Stage 8 300-step journal replay diverged")
          if repeat.journal.head_hash != runtime.journal.head_hash:
              raise SystemExit("Stage 8 300-step golden heads differ")
          if repeat.q_active.export_causal_state() != q:
              raise SystemExit("Stage 8 Q_active replay diverged")
          if repeat.kappa_active.export_causal_state() != kappa:
              raise SystemExit("Stage 8 kappa_active replay diverged")
          print("stage8_reference_second_run_exact=true")
          PY

      - name: Upload Stage 8 reference journal
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: stage8-reference-journal
          path: /tmp/stage8-reference.jsonl
          if-no-files-found: error

      - name: Generate Stage 1 reference journal
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          from pathlib import Path
          from lab.compute_budget import ComputeBudgetConfig
          from lab.stage1_runtime import ScriptedStage1Runtime

          budget = ComputeBudgetConfig(
              version="stage1-ci-v1",
              cycle_ceiling=100,
              module_envelopes={"stage1_fixture": 100},
              protected_modules=frozenset({"stage1_fixture"}),
              protected_capacity=10,
              operation_costs={"fixture_op": 1},
          )
          runtime = ScriptedStage1Runtime(
              campaign_seed=17,
              budget_config=budget,
          )
          for _ in range(3):
              runtime.run_step(cycle=1)

          path = Path("/tmp/stage1-reference.jsonl")
          payload = runtime.journal.canonical_bytes()
          path.write_bytes(payload + (b"\n" if payload else b""))
          if not runtime.journal.verify():
              raise SystemExit("stage1 reference journal failed verification")
          print(f"stage1_reference_bytes={len(payload)}")
          print(f"stage1_reference_head={runtime.journal.head_hash}")
          expected = "67a43e32bb6f8bb053ece7a1d7ba36d50ec773725922b931d6bb377b023b37a4"
          if runtime.journal.head_hash != expected:
              raise SystemExit(
                  f"Stage 1 reference regression: {runtime.journal.head_hash} != {expected}"
              )
          PY

      - name: Upload Stage 1 reference journal
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: stage1-reference-journal
          path: /tmp/stage1-reference.jsonl
          if-no-files-found: error

