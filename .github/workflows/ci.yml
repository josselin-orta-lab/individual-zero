              )

          payload = runtime.journal.canonical_bytes()
          path = Path("/tmp/stage6-reference.jsonl")
          path.write_bytes(payload + (b"\n" if payload else b""))
          if not runtime.journal.verify():
              raise SystemExit("stage6 reference journal failed verification")
          print(f"stage6_reference_bytes={len(payload)}")
          print(f"stage6_reference_head={runtime.journal.head_hash}")
          print(
              "stage6_f_cog_uc="
              f"{runtime.metacognition.state.f_cog_uc_counter}"
          )
          expected = "1f7a61df76a84a5f3c00b66ee636ec99ca787793775b0a6ef15449db69286e1b"
          if runtime.journal.head_hash != expected:
              raise SystemExit(
                  f"Stage 6 reference regression: {runtime.journal.head_hash} != {expected}"
              )
          if runtime.metacognition.state.f_cog_uc_counter != 9593:
              raise SystemExit(
                  "Stage 6 F_cog UC regression: "
                  f"{runtime.metacognition.state.f_cog_uc_counter} != 9593"
              )
