name: CI

# Budget policy: brief PR checks on reviewable code, exhaustive diagnostics on demand.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
    branches:
      - main
      - 'i0/stage*'
      - 'runtime/*'
      - 'world/*'
    paths:
      - '.github/workflows/**'
      - '.gitattributes'
      - '.gitignore'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'setup.py'
      - 'setup.cfg'
      - 'tox.ini'
      - 'scripts/**'
      - 'docs/architecture/reference/en/mvp-specification-v1.2.1.md'
  # Full replay stays available on the default branch via manual dispatch.
  # Draft PRs may request unit-only verification with the ci-unit label.
  workflow_dispatch:

concurrency:
  # Distinct label groups prevent a short unit check from canceling an
  # operator-requested full run, and avoid canceling either on PR updates.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  quick-checks:
    name: quick-unit-tests (Python 3.12)
    # PRs ready for review get this lightweight check automatically. Draft
    # PRs get it ONLY upon explicit application of the ci-unit label.
    if: >-
      github.event_name == 'pull_request' &&
      ((github.event.action == 'labeled' && github.event.label.name == 'ci-unit') ||
       (github.event.action != 'labeled' && !github.event.pull_request.draft))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install project
        run: python -m pip install -e .

      - name: Run unit tests (without long-running reference diagnostics)
        run: python -m unittest discover -s tests -q

      - name: Run bootstrap smoke execution
        run: individual-zero --cycles 3 --seed 0 --run-id ci-smoke --output /tmp/individual-zero-ci.jsonl

  test:
    name: full-validation (Python ${{ matrix.python-version }})
    # Preserve every existing extended test and archive for manual validation.
    # The ci-full label gives this draft PR an immediate manual path while
    # workflow_dispatch waits for its workflow definition on default branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'ci-full')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # Independent v1.3.1 mortal cognition: 600 actually executed world
      # steps, no Oracle/Bench loading, no life snapshots or rollback.
      # Kept separate from the historical Stage-11 replay diagnostic.
      - name: Stage 11 mortal autonomous 600 physical steps (software only)
        if: matrix.python-version == '3.12'
        timeout-minutes: 25
        run: |
          python -m lab.stage11_autonomous_600_step_probe --steps 600 \
            | tee /tmp/stage11-autonomous-600.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          from lab.determinism import canonical_causal_bytes, sha256_hex

          raw = Path("/tmp/stage11-autonomous-600.jsonl").read_text(
              encoding="utf-8",
          ).strip()
          prefix = "stage11_autonomous_600_step="
          if not raw.startswith(prefix):
              raise SystemExit("missing Stage11 autonomous receipt")
          report = json.loads(raw[len(prefix):])
          evidence = report.pop("evidence_sha256")
          if (
              sha256_hex(canonical_causal_bytes(report)) != evidence
              or report["protocol_version"] != "stage11-autonomous-600-journal-v1"
              or report["classification"] != "public_development_diagnostic_not_heldout"
              or report["scientific_verdict"] is not None
              or report["steps_physically_executed"] != 600
              or report["perceptual_captures"] != 600
              or report["world_transitions"] != 600
              or report["cognitive_autobiographical_commits"] != 600
              or report["terminal_deaths"] != 0
              or [a["world_step"] for a in report["journal_prefix_anchors"]] != [1, 300, 600]
              or not report["offline_audit_completed"]
              or report["external_oracle_loaded"]
              or report["external_bench_loaded"]
              or report["historical_life_snapshot_or_restore_used"]
              or report["physical_truth_attested_by_independent_oracle"]
          ):
              raise SystemExit("Stage11 autonomous 600-step audit failed")
          print("stage11_autonomous_600_world_steps_full_journal_verified=true")
          PY

      - name: Upload Stage 11 mortal autonomous 600-step diagnostic
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: stage11-autonomous-600-mortal-software-diagnostic
          path: /tmp/stage11-autonomous-600.jsonl
          if-no-files-found: error

      # Stage-11 prospective public 600-world-step diagnostic. The protocol
      # is software-only, uses the unchanged public Stage-11 reference world,
      # and compares TWO independently instantiated lives with the exact
      # same full-owner snapshot schedule. No held-out or Golden promotion.
      - name: Stage 11 public 600-step exact independent replay (software only)
        if: matrix.python-version == '3.12'
        timeout-minutes: 25
        run: |
          python -m lab.stage11_600_step_software_probe | tee /tmp/stage11-600-step-software.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          from lab.determinism import canonical_causal_bytes, sha256_hex

          line = Path("/tmp/stage11-600-step-software.jsonl").read_text(encoding="utf-8").strip()
          prefix = "stage11_600_step_software="
          if not line.startswith(prefix):
              raise SystemExit("Stage11 600-step diagnostic missing receipt")
          report = json.loads(line[len(prefix):])
          digest = report.pop("evidence_sha256")
          if (
              report["protocol_version"] != "stage11-public-600-step-software-v1"
              or report["classification"] != "public_software_diagnostic_not_heldout"
              or report["scientific_verdict"] is not None
              or report["steps_completed"] != 600
              or report["physical_capture_count"] != 600
              or not report["identical_independent_reexecution"]
              or [item[0] for item in report["snapshot_receipts"]] != [1, 300, 600]
              or sha256_hex(canonical_causal_bytes(report)) != digest
          ):
              raise SystemExit("Stage11 600-step software diagnostic failed")
          print("stage11_600_world_steps_independent_replay=true")
          PY

      - name: Upload Stage 11 600-step public software diagnostic
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: stage11-600-step-software-diagnostic
          path: /tmp/stage11-600-step-software.jsonl
          if-no-files-found: error

      - name: Stage 9 frozen checkout preflight (local software diagnostic)
        if: matrix.python-version == '3.12'
        run: |
          python -m lab.stage9_frozen_worktree --repo . \
            --frozen-commit "$(git rev-parse HEAD)" \
            > /tmp/stage9-checkout-integrity.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(
              "/tmp/stage9-checkout-integrity.json"
          ).read_text(encoding="utf-8"))
          if (
              report["worktree_status"] != "frozen_tracked_code_matches_local_checkout"
              or report["scientific_verdict"] is not None
              or report["golden_stage9_frozen"]
              or report["verified_tracked_files"] < 1
          ):
              raise SystemExit("Stage 9 local checkout integrity preflight failed")
          print("stage9_checkout_preflight=local_software_only")
          PY

      - name: Upload Stage 9 local checkout integrity diagnostic
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: stage9-checkout-integrity-diagnostic
          path: /tmp/stage9-checkout-integrity.json
          if-no-files-found: error

      - name: Run bootstrap smoke execution
        run: individual-zero --cycles 3 --seed 0 --run-id ci-smoke --output /tmp/individual-zero-ci.jsonl

      - name: Stage 9 matched hydration contrast (diagnostic, not acceptance)
        if: matrix.python-version == '3.12'
        run: |
          python -m lab.stage9_hydration_contrast_report | tee /tmp/stage9-hydration-contrast.jsonl

      - name: Upload Stage 9 hydration contrast evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: stage9-hydration-contrast-diagnostic
          path: /tmp/stage9-hydration-contrast.jsonl
          if-no-files-found: error

      # A 300-step full-journal and all-owner comparison is a software
      # reference diagnostic only. No Stage-9 scientific Golden is frozen.
      - name: Stage 9 extended exact reference replay (diagnostic, not Golden)
        if: matrix.python-version == '3.12'
        run: |
          python -m lab.stage9_reference_replay --steps 300 \
            --journal /tmp/stage9-reference-diagnostic.jsonl \
            --causal-state /tmp/stage9-reference-causal-state.json \
            > /tmp/stage9-reference-diagnostic.json
          python - <<'PY'
          import json
          from pathlib import Path
          from lab.determinism import canonical_causal_bytes, sha256_hex
          from lab.stage9_canonical_journal_audit import audit_raw_causal_journal
          report = json.loads(Path(
              "/tmp/stage9-reference-diagnostic.json"
          ).read_text(encoding="utf-8"))
          journal = Path("/tmp/stage9-reference-diagnostic.jsonl").read_bytes()
          state_bytes = Path("/tmp/stage9-reference-causal-state.json").read_bytes()
          journal_audit = audit_raw_causal_journal(
              Path("/tmp/stage9-reference-diagnostic.jsonl"),
              physical_observation_refs=set(),
          )
          if (
              report["protocol_version"] != "stage9-extended-reference-diagnostic-v3"
              or report["classification"] != "diagnostic_only"
              or report["golden_stage9_frozen"]
              or report["scientific_verdict"] is not None
              or report["steps"] != 300
              or not report["identical_independent_reexecution"]
              or report["journal_bytes"] != len(journal)
              or report["journal_sha256"] != sha256_hex(journal)
              or report["causal_state_sha256"] != sha256_hex(state_bytes)
              or not state_bytes
              or canonical_causal_bytes(json.loads(state_bytes)) != state_bytes
              or journal_audit["journal_events_checked"] <= 0
              or journal_audit["journal_head_hash"] != report["journal_head"]
              or journal_audit["physical_truth_attested"]
              or journal_audit["memory_episode_closure_attested"]
          ):
              raise SystemExit("Stage 9 300-step replay diagnostic failed")
          print("stage9_300_step_replay_exact=true")
          PY

      - name: Upload Stage 9 extended software reference diagnostic
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: stage9-extended-reference-diagnostic
          path: |
            /tmp/stage9-reference-diagnostic.json
            /tmp/stage9-reference-diagnostic.jsonl
            /tmp/stage9-reference-causal-state.json
          if-no-files-found: error

      # Evidence publishing is not Stage-9 scientific acceptance. The
      # laboratory must still preregister the threshold and obtain real
      # independent naturally acquired causal candidates before the Golden.
      - name: Stage 9 evidence bundle (diagnostic, not acceptance)
        if: matrix.python-version == '3.12'
        run: |
          python -m lab.stage9_acceptance_report > /tmp/stage9-acceptance-diagnostic.json
          python - <<'PY'
          from pathlib import Path
          from lab.stage9_spontaneous_superstition_matrix import run_spontaneous_superstition_matrix
          # Must match acceptance-report default (seed 42, then 43 and 44),
          # rather than the standalone matrix's exploratory defaults.
          result = run_spontaneous_superstition_matrix(
              seeds=(42, 43, 44), steps=14,
          )
          Path("/tmp/stage9-spontaneous-matrix-diagnostic.json").write_text(
              result.to_json(), encoding="utf-8",
          )
          PY
          python - <<'PY'
          from pathlib import Path
          from lab.stage9_known_cause_world_matrix import run_known_cause_world_matrix
          # Match the acceptance-report fixed diagnostic seed set exactly.
          result = run_known_cause_world_matrix(seeds=(42, 43, 44))
          Path("/tmp/stage9-known-cause-world-matrix.json").write_text(
              result.to_json(), encoding="utf-8",
          )
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          from lab.determinism import canonical_causal_bytes, sha256_hex

          acceptance = json.loads(Path(
              "/tmp/stage9-acceptance-diagnostic.json"
          ).read_text(encoding="utf-8"))
          expected_digest = acceptance.pop("evidence_sha256")
          if sha256_hex(canonical_causal_bytes(acceptance)) != expected_digest:
              raise SystemExit("Stage 9 acceptance artifact digest differs")
          if acceptance["acceptance_status"] != "open" or acceptance["golden_stage9_frozen"]:
              raise SystemExit("Stage 9 diagnostic was incorrectly promoted to Golden")
          checks = {row["criterion"]: row for row in acceptance["checks"]}
          matrix = json.loads(Path(
              "/tmp/stage9-spontaneous-matrix-diagnostic.json"
          ).read_text(encoding="utf-8"))
          matrix_digest = matrix.pop("digest")
          if sha256_hex(canonical_causal_bytes(matrix)) != matrix_digest:
              raise SystemExit("Stage 9 full multiworld artifact digest differs")
          runs = matrix["runs"]
          opportunities = sum(len(row["spontaneous_candidate_refs"]) for row in runs)
          established = sum(len(row["spontaneous_established_false_refs"]) for row in runs)
          if (
              opportunities != matrix["spontaneously_observed_candidates"]
              or established != matrix["established_false_rules"]
              or any(not set(row["spontaneous_established_false_refs"]).issubset(
                  row["spontaneous_candidate_refs"]
              ) for row in runs)
              or matrix["natural_false_rule_rate"] != (
                  None if opportunities == 0 else established / opportunities
              )
          ):
              raise SystemExit("Stage 9 multiworld numerator/denominator inconsistent")
          known = json.loads(Path(
              "/tmp/stage9-known-cause-world-matrix.json"
          ).read_text(encoding="utf-8"))
          known_digest = known.pop("digest")
          if sha256_hex(canonical_causal_bytes(known)) != known_digest:
              raise SystemExit("Stage 9 known-cause matrix artifact digest differs")
          known_rows = known["runs"]
          expected_known = checks["known_cause_attribution"]["evidence"]
          if (
              len(known_rows) != expected_known["geometric_world_count"]
              or known_digest != expected_known["geometric_matrix_sha256"]
              or known["seeds"] != expected_known["geometric_matrix_seeds"]
              or len({row["world_digest"] for row in known_rows}) != len(known_rows)
              or sum(row["results"]["ground_truthed_cases"] for row in known_rows) != known["physically_ground_truthed_cases"]
              or sum(row["results"]["correct_links"] for row in known_rows) != known["correct_links"]
              or sum(row["results"]["uncertain_cases"] for row in known_rows) != known["uncertain_cases"]
              or sum(row["results"]["false_self_links"] for row in known_rows) != known["false_self_links"]
              or known["physically_ground_truthed_cases"] != expected_known["geometric_ground_truthed_cases"]
              or known["correct_links"] != expected_known["geometric_correct_links"]
              or known["uncertain_cases"] != expected_known["geometric_uncertain_cases"]
              or known["false_self_links"] != expected_known["geometric_false_self_links"]
              or known["observed_accuracy"] != expected_known["geometric_observed_accuracy"]
              or known["classification"] != "diagnostic_only"
          ):
              raise SystemExit("Stage 9 known-cause world matrix mismatches acceptance report")
          superstition = checks["superstitious_rules_under_random_reward"]["evidence"]
          if (
              matrix_digest != superstition["spontaneous_matrix_sha256"]
              or matrix["evaluation_status"] != superstition["spontaneous_evaluation_status"]
              or matrix["spontaneously_observed_candidates"] != superstition["spontaneous_candidate_count"]
              or matrix["natural_false_rule_rate"] != superstition["spontaneous_diagnostic_rate"]
          ):
              raise SystemExit("Stage 9 multiworld evidence and acceptance report differ")
          print("stage9_diagnostic_bundle=" + json.dumps({
              "acceptance": acceptance["acceptance_status"],
              "golden_frozen": acceptance["golden_stage9_frozen"],
              "acceptance_digest": expected_digest,
              "multiworld_digest": matrix_digest,
              "known_cause_world_digest": known_digest,
              "known_cause_worlds": len(known_rows),
              "known_cause_correct_links": known["correct_links"],
              "known_cause_total_links": known["physically_ground_truthed_cases"],
              "natural_candidates": matrix["spontaneously_observed_candidates"],
              "false_rule_rate": matrix["natural_false_rule_rate"],
              "scientific_status": matrix["evaluation_status"],
          }, sort_keys=True))
          PY

      - name: Upload Stage 9 diagnostic evidence bundle
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: stage9-acceptance-diagnostics
          path: |
            /tmp/stage9-acceptance-diagnostic.json
            /tmp/stage9-spontaneous-matrix-diagnostic.json
            /tmp/stage9-known-cause-world-matrix.json
          if-no-files-found: error

      - name: Stage 9 prospective scientific preflight (never Golden)
        if: matrix.python-version == '3.12'
        run: |
          python -m lab.stage9_scientific_preregistration > /tmp/stage9-scientific-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("/tmp/stage9-scientific-preflight.json").read_text(encoding="utf-8"))
          if (
              status["registration_status"] != "unregistered"
              or status["scientific_verdict"] is not None
              or status["golden_stage9_frozen"]
          ):
              raise SystemExit("Stage 9 prospective scientific preflight falsely passes")
          print("stage9_preregistration=" + status["registration_status"])
          PY

      - name: Upload Stage 9 prospective scientific preflight
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: stage9-scientific-preregistration-preflight
          path: /tmp/stage9-scientific-preflight.json
          if-no-files-found: error

      - name: Stage 9 prospective holdout assessment readiness (never Golden)
        if: matrix.python-version == '3.12'
        run: |
          python -m lab.stage9_scientific_assessment > /tmp/stage9-scientific-assessment.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/stage9-scientific-assessment.json").read_text())
          if (result["assessment"] != "unregistered"
              or result["scientific_verdict"] is not None
              or result["golden_stage9_frozen"]):
              raise SystemExit("unregistered Stage-9 scientific assessment must fail closed")
          print("stage9_scientific_assessment=" + result["assessment"])
          PY

      - name: Upload Stage 9 prospective holdout assessment readiness
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: stage9-scientific-assessment-readiness
          path: /tmp/stage9-scientific-assessment.json
          if-no-files-found: error

      - name: Stage 8 preregistered physical κ stress Brier gate
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from lab.stage8_calibration_stress import controlled_physical_calibration
          report = controlled_physical_calibration()
          result = {
              "protocol_version": report.version,
              "independent_physical_observations": report.credited_observations,
              "confirmations": report.confirmations,
              "contradictions": report.contradictions,
              "brier_early": report.early_brier,
              "brier_late": report.late_brier,
              "brier_neutral": report.baseline_brier,
          }
          Path("/tmp/stage8-physical-kappa.json").write_text(
              json.dumps(result, sort_keys=True, indent=2) + "\\n", encoding="utf8"
          )
          print("stage8_physical_kappa=" + json.dumps(result, sort_keys=True))
          if not (report.credited_observations == 80
                  and report.confirmations > 0 and report.contradictions > 0
                  and report.late_brier < report.early_brier
                  and report.late_brier < report.baseline_brier):
              raise SystemExit("Stage 8 κ independent physical Brier gate failed")
          second = controlled_physical_calibration()
          if second != report:
              raise SystemExit("Stage 8 physical calibration replay differs")
          print("stage8_physical_kappa_replay_exact=true")
          PY

      - name: Upload Stage 8 physical κ calibration
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: stage8-physical-kappa-calibration
          path: /tmp/stage8-physical-kappa.json
          if-no-files-found: error

      - name: Stage 8 physical learning and prequential calibration curves
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from lab.stage8_learning_benchmark import (
              world_learning_curve, Stage8PhysicalCalibrationRecorder,
          )
          from lab.stage8_reference_fixture import build_stage8_reference_runtime
          td = world_learning_curve(pairs=80, interval=20)
          if not td.points[-1].rmse_against_observed_return < td.points[0].rmse_against_observed_return:
              raise SystemExit("Stage 8 physical-world TD learning did not improve")
          recorder = Stage8PhysicalCalibrationRecorder()
          runtime = build_stage8_reference_runtime()
          for _ in range(300):
              confidence = recorder.before_step(runtime)
              result = runtime.run_step()
              if result.execution_status != "applied":
                  raise SystemExit("Stage 8 calibration-world execution not applied")
              recorder.after_step(runtime, confidence)
          curve = recorder.curve()
          report = {
              "protocol_version": td.protocol_version,
              "td_world_version": td.world_version,
              "td_sample_count": td.sample_count,
              "td_measured_rewards": [td.measured_reward_drink, td.measured_reward_wait],
              "td_points": [
                  {"step": p.observed_steps, "q_drink": p.q_drink,
                   "q_wait": p.q_wait, "rmse": p.rmse_against_observed_return}
                  for p in td.points
              ],
              "calibration_count": len(curve.samples),
              "brier_first_half": curve.initial_brier,
              "brier_second_half": curve.late_brier,
              "brier_neutral_baseline": curve.baseline_brier,
              "brier_decreased": (
                  None if curve.initial_brier is None or curve.late_brier is None
                  else curve.late_brier < curve.initial_brier
              ),
          }
          Path("/tmp/stage8-learning-benchmark.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\\n", encoding="utf-8"
          )
          print("stage8_learning_benchmark=" + json.dumps(report, sort_keys=True))
          if not curve.samples:
              print("stage8_brier_gate=inconclusive_no_credited_physical_comparisons")
          elif report["brier_decreased"] is not True:
              print("stage8_brier_gate=not_yet_demonstrated")
          else:
              print("stage8_brier_gate=observed_decrease")
          PY

      - name: Upload Stage 8 learning and calibration curves
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: stage8-learning-benchmark
          path: /tmp/stage8-learning-benchmark.json
          if-no-files-found: error

      - name: Stage 8 reference and online-state metrics
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          from pathlib import Path
          from lab.stage8_reference_fixture import build_stage8_reference_runtime

          runtime = build_stage8_reference_runtime()
          for _ in range(300):
              outcome = runtime.run_step()
              if outcome.execution_status != "applied":
                  raise SystemExit(f"unexpected Stage 8 outcome: {outcome.execution_status}")
          if not runtime.journal.verify():
              raise SystemExit("invalid Stage 8 journal")
          payload = runtime.journal.canonical_bytes()
          Path("/tmp/stage8-reference.jsonl").write_bytes(payload + b"\n")
          q = runtime.q_active.export_causal_state()
          kappa = runtime.kappa_active.export_causal_state()
          print(f"stage8_bytes={len(payload)}")
          print(f"stage8_head={runtime.journal.head_hash}")
          print(f"stage8_q_signatures={len(q['weights'])}")
          print(f"stage8_q_updates={sum(q['update_counts'].values())}")
          print(f"stage8_kappa_version={kappa['version']}")
          print(f"stage8_kappa_keys={len(kappa['counters'])}")
          print(f"stage8_f_cog={runtime.metacognition.state.f_cog_uc_counter}")
          # Fixed only after a verified second identical 300-step execution.
          expected = "0a2dc62d4ba51722a96f307fdf6c7427d1aa3b0a8a3c0e21da81bc490eb23cf8"
          if runtime.journal.head_hash != expected:
              raise SystemExit(
                  "Stage 8 golden regression: "
                  f"{runtime.journal.head_hash} != {expected}"
              )
          if len(payload) != 35061323:
