name: I3 P5d original-only independent custody transport

on:
  pull_request:
    paths:
      - '.github/workflows/i3-p5d-custody-transport.yml'
      - 'src/i3/lab/p5d_custody.py'

permissions:
  contents: read

concurrency:
  group: i3-p5d-custody-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Exact original-only custody Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run complete I3 code checks
        run: PYTHONPATH=src python -m unittest discover -s tests/i3 -p 'test_*.py'
      - name: Verify generation ownership excluding transient transport workflow
        run: |
          rm .github/workflows/i3-p5d-custody-transport.yml
          python scripts/check_engine_repository.py --json
          python scripts/check_engine_contracts.py --json
      - name: Retrieve original 24-life P5d evidence from source-locked action
        uses: actions/download-artifact@v4
        with:
          name: i3-p5d-development-original
          run-id: 42264995059
          repository: josselin-orta-lab/individual-zero
          github-token: ${{ github.token }}
          path: original
      - name: Read-only audit of original bytes and adversarial mutations
        shell: bash
        run: |
          export PYTHONPATH=src
          python -m i3.lab.p5d_custody original/p5d-original.json > independent-custody.json
          python - <<'PY'
          import copy, hashlib, json
          from pathlib import Path
          from i3.lab.p5d_custody import audit_payload, verify_original
          raw=Path('original/p5d-original.json').read_bytes()
          original=json.loads(raw)
          result=verify_original(raw)
          assert result["aggregation"]["normal"]["ingestions"]==7
          assert result["aggregation"]["discard_curiosity_bonus"]["ingestions"]==0
          assert result["aggregation"]["discard_curiosity_bonus"]["terminal_carried_tokens"]==11
          assert result["aggregation"]["normal"]["voluntary_wait_steps"]==134
          assert result["aggregation"]["discard_curiosity_bonus"]["voluntary_wait_steps"]==761
          checks=[]
          try:
              verify_original(raw+b' ')
          except ValueError:checks.append('original-bytes')
          for name,mutate in (
              ('duplicated-life',lambda d:d['receipts'].__setitem__(1,copy.deepcopy(d['receipts'][0]))),
              ('unpaid-cognition',lambda d:d['receipts'][0]['steps'][0]['phase_payment']['decision']['accounting']['energy'].__setitem__('unpaid',1.0)),
              ('invented-consumption',lambda d:d['receipts'][0]['steps'][0].__setitem__('consumed_inventory',True)),
              ('changed-inventory',lambda d:d['receipts'][0]['steps'][0].__setitem__('capture_inventory',[['madeup',1]])),
              ('missing-step',lambda d:d['receipts'][0]['steps'].pop()),
              ('wrong-world',lambda d:d['receipts'][0].__setitem__('development_index',96)),
          ):
              bad=copy.deepcopy(original)
              mutate(bad)
              try:audit_payload(bad)
              except (ValueError,KeyError,TypeError):checks.append(name)
          assert len(checks)==7,checks
          print('P5D_CUSTODY_SOURCE','${{ github.event.pull_request.head.sha }}')
          print('P5D_ORIGINAL_SHA256',hashlib.sha256(raw).hexdigest())
          print('P5D_CUSTODY_ADVERSARIAL_CHECKS',checks)
          print('P5D_CUSTODY_AGGREGATION',json.dumps(result['aggregation'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p5d-independent-original-only-custody-python-${{ matrix.python-version }}
          path: independent-custody.json
          retention-days: 90
          if-no-files-found: error

  archive:
    name: Preserve verified original raw evidence as a permanent git blob
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: i3-p5d-development-original
          run-id: 42264995059
          repository: josselin-orta-lab/individual-zero
          github-token: ${{ github.token }}
          path: original
      - name: Independently verify before committing any original bytes
        shell: bash
        run: |
          PYTHONPATH=src python -m i3.lab.p5d_custody original/p5d-original.json > independent-custody.json
          mkdir -p src/i3/docs/studies/p5d-resource-acquisition
          python - <<'PY'
          import gzip,hashlib
          from pathlib import Path
          root=Path('src/i3/docs/studies/p5d-resource-acquisition')
          raw=Path('original/p5d-original.json').read_bytes()
          with (root/'p5d-original.json.gz').open('wb') as f:
              with gzip.GzipFile(filename='',mode='wb',fileobj=f,compresslevel=9,mtime=0) as gz:
                  gz.write(raw)
          gz=(root/'p5d-original.json.gz').read_bytes()
          assert gzip.decompress(gz)==raw
          (root/'ORIGINAL_SHA256SUMS.txt').write_text(hashlib.sha256(raw).hexdigest()+'  p5d-original.json\n'+hashlib.sha256(gz).hexdigest()+'  p5d-original.json.gz\n')
          (root/'independent-custody.json').write_bytes(Path('independent-custody.json').read_bytes())
          print('P5D_ARCHIVE_BYTES',len(gz))
          print('P5D_ARCHIVE_SHA256',hashlib.sha256(gz).hexdigest())
          PY
      - name: Commit archive to PR branch only, never main
        shell: bash
        env:
          P5D_BRANCH: ${{ github.head_ref }}
          P5D_EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$P5D_EXPECTED"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i3/docs/studies/p5d-resource-acquisition
          git commit -m "research(i3 P5d): preserve first original 24-life paid evidence and custody"
          git push origin "HEAD:refs/heads/$P5D_BRANCH"
