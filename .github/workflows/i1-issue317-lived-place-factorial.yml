name: I1 issue317 lived first-person place factorial
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'tools/run_i1_317_lived_place_factorial.py'
      - 'tests/i1/test_i1_317_lived_place_factorial.py'
      - '.github/workflows/i1-issue317-lived-place-factorial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  births:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        preset: [oasis, foraging, memory-corridor]
        seed: [13127, 13219]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install I1
        run: python -m pip install -e .
      - name: Reject unlearned and fraudulent source benefit
        run: python -m unittest discover -s tests/i1 -p test_i1_317_lived_place_factorial.py -v
      - name: Four autonomous mortal births without engine promotion
        env:
          PRESET: ${{ matrix.preset }}
          SEED: ${{ matrix.seed }}
        run: |
          python tools/run_i1_317_lived_place_factorial.py --preset "$PRESET" --seed "$SEED" --output-dir "results/$PRESET/$SEED"
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path('results')/os.environ['PRESET']/os.environ['SEED']/'report.json'
          d=json.loads(p.read_text())
          assert d['status']=='COMPLETE_PAIRED_PHYSICAL_DIAGNOSTIC'
          assert set(d['arms'])==set(d['preregistered_arms'])
          assert d['no_type_based_resource_utility'] is True
          assert d['no_motor_forcing_or_new_vital_reflex'] is True
          assert d['scientific_verdict']=='NO-GO'
          print('LIVED_PLACE_FACTORIAL_DIAGNOSTIC_COMPLETE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-317-lived-place-${{ matrix.preset }}-${{ matrix.seed }}
          path: results/
          retention-days: 30
          if-no-files-found: warn
