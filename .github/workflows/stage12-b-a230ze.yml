name: Stage12 A2.30-ZE physically witnessed exact coverage shadow
on:
  pull_request:
    branches: [science/stage12-b-a230zd-autonomous-attribution-funnel-20261015]
    paths:
      - 'scripts/run_stage12_issue110_b_a230ze_model_coverage.py'
      - 'tests/test_stage12_a230ze_model_coverage.py'
      - 'docs/research/stage12-issue110-b-a230ze-*.md'
      - '.github/workflows/stage12-b-a230ze.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blinded-model-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Verify no ingestion, no latent safety, no physical heldout and Stage6 root controls
        run: python -m unittest discover -s tests -p test_stage12_a230ze_model_coverage.py -v
      - name: Execute one original preregistered pure physical source cohort and heldout shadows
        run: |
          python -u scripts/run_stage12_issue110_b_a230ze_model_coverage.py \
            --output-dir /tmp/a230ze-physical > /tmp/a230ze.log 2>&1 \
            || { tail -n 170 /tmp/a230ze.log; exit 2; }
          grep A230ZE_SUMMARY /tmp/a230ze.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a230ze-py${{ matrix.python-version }}
          path: |
            /tmp/a230ze-physical
            /tmp/a230ze.log
          retention-days: 30
