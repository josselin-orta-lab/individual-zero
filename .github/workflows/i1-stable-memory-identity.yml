name: I1 stable spatial-memory option identity
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/i1/modules/geographic_exploration.py'
      - 'src/i1/modules/geographic_planning.py'
      - 'src/i1/runtime/stage11_runtime.py'
      - 'tests/i1/test_i1_317_stable_memory_identity.py'
      - '.github/workflows/i1-stable-memory-identity.yml'
permissions:
  contents: read
jobs:
  stable-memory:
    name: Stable memory identity (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install engine
        run: python -m pip install -e .
      - name: Stable option identity and Competition contract
        run: python -m unittest discover -s tests/i1 -p test_i1_317_stable_memory_identity.py -v
