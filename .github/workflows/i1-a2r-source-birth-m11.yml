name: I1 A2-R exact source to born M11 chain (targeted)
on:
  pull_request:
    paths:
      - 'tools/research/i1_a2r_source_birth_audit.py'
      - 'tools/i1_eco_a2r_launch_gate.py'
      - 'tools/i1_eco_a2r_original_slot.py'
      - 'tools/a2r_tests/test_i1_a2r_original_slot.py'
      - 'tools/a2r_tests/test_i1_a2r_launch_gate.py'
      - 'tools/research/tests/test_i1_a2r_source_birth_audit.py'
      - '.github/workflows/i1-a2r-source-birth-m11.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_birth_m11:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: PYTHONPATH=tools/research python -m unittest discover -s tools/research/tests -p test_i1_a2r_source_birth_audit.py -v
      - run: PYTHONPATH=tools:tools/research python -m unittest discover -s tools/a2r_tests -p test_i1_a2r_launch_gate.py -v
      - run: PYTHONPATH=tools:tools/research python -m unittest discover -s tools/a2r_tests -p test_i1_a2r_original_slot.py -v
      - run: test ! -d reports/i1-eco-a2r-cohort
