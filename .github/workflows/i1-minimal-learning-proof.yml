name: I1 minimal learning causal proof
on:
  push:
    branches: [science/i1-minimal-learning-proof-20261018]
    paths:
      - '.github/workflows/i1-minimal-learning-proof.yml'
      - 'tools/run_i1_minimal_learning.py'
      - 'src/i1/lab/world_presets/learning-cell.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        food_role: ['a', 'b']
        reading: ['active', 'masked']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify engine boundaries and world
        run: |
          python -m pip install -e .
          python scripts/check_engine_repository.py --json
          python tools/run_i1_minimal_learning.py --preset learning-cell --validate-only
      - name: Independently born mortal agents with no scripted actions
        shell: bash
        env:
          FOOD: ${{ matrix.food_role }}
          READING: ${{ matrix.reading }}
        run: |
          set -euo pipefail
          flag=()
          if [[ "$READING" == "masked" ]]; then flag=(--learning-read-ablation); fi
          for seed in 246 247 248 249 250; do
            folder="reports/${FOOD}/${READING}/seed-${seed}"
            python tools/run_i1_minimal_learning.py --preset learning-cell \
              --seed "$seed" --steps 200 --lives 1 --custody wal \
              --food-role "$FOOD" "${flag[@]}" --output-dir "$folder"
          done
      - name: Preserve all lives and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-learning-${{ matrix.food_role }}-${{ matrix.reading }}-${{ github.run_id }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
