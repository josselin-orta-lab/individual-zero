name: I3 P5b readout controls DEVELOPMENT preflight (no validation)
on:
  push:
    branches: [automation/i3-p5b-readouts-preflight-20261106]
    paths: [.github/workflows/i3-p5b-readouts-preflight.yml]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout exact P5b engineering candidate
        uses: actions/checkout@v4
        with:
          ref: 8b22a45cc5a1b4d4573084f802c5c3bc071b5ae5
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate I3 including decision readout observer purity
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/i3 -p 'test_*.py' -q
          python scripts/check_engine_repository.py --json
      - name: Development-only diagnostic of decision options and funding
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m i3.lab.p5b_development_diagnostic --run-development > "$RUNNER_TEMP/p5b-development.json"
          python - <<'PY'
          import json,os
          p=json.load(open(os.environ["RUNNER_TEMP"]+"/p5b-development.json"))
          assert p["status"]=="ENGINEERING_DEVELOPMENT_ONLY_NOT_SCIENTIFIC_EVIDENCE"
          assert len(p["lives"])==48 and set(p["comparison"])=={
            "full","blind_predictions","blind_sources","blind_all"}
          assert p["validation"]=="NOT_OPENED" and p["reserve"]=="LOCKED"
          for mode,values in p["comparison"].items():
              print("DEV",mode,"lives",values["lives"],"censored",values["censored"],
                    "steps",values["lived_steps"],"inactive",values["inactive_steps"],
                    "paid_energy",values["energy_paid"],
                    "observers",values["decision"],
                    "offered",values["offered_families"],
                    "scored",values["scored_families"])
          PY
      - name: Reconcile original P4 and P5a complete scientific data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,hashlib
          from pathlib import Path
          root=Path("src/i3/docs/studies")
          files={
           "p4a-g2-heldout/validation-full.json.gz":"44adb1192d1aea87cf5d96a547f794de6f7fe33a566a5de90747a34429e8e8d6",
           "p4b-paid-outcome-learning/learning-full.json.gz":"688463e4fbb71cb88d57d0cafbe70eb033adeafe8ae8551d42bec58dfa9e395c",
           "p5a-paid-component-screen/mechanisms-full.json.gz":"21719dcc89f83f3984ccc32b3d203d2152ff8c7dd8c2c8a76318ce84d60113d8",
          }
          for name,expected in files.items():
              assert hashlib.sha256(gzip.decompress((root/name).read_bytes())).hexdigest()==expected
              print("UNCHANGED original",name)
          PY
