name: Stage12 Issue110 A2.13 physical projection adversaries
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_stage12_issue110_a213.py'
      - 'tests/test_stage12_a213_projection_safety.py'
      - 'docs/research/stage12-issue110-a213-physical-projection-adversarial-prereg-2026-10-14.fr.md'
      - 'docs/research/stage12-issue110-a213-projection-safety-results-2026-10-14.fr.md'
      - '.github/workflows/stage12-issue110-a213.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Unknown effect and physical counterexample regression
        run: python -m unittest discover -s tests -p 'test_stage12_a213_projection_safety.py' -v
      - name: Forty-eight paired pre-registered physical contrasts
        run: |
          python scripts/run_stage12_issue110_a213.py \
            --output-dir /tmp/i0-a213-physical > /tmp/i0-a213.log 2>&1 \
            || { tail -n 140 /tmp/i0-a213.log; exit 2; }
          grep 'A213_SUMMARY' /tmp/i0-a213.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage12-a213-py${{ matrix.python-version }}
          path: |
            /tmp/i0-a213-physical
            /tmp/i0-a213.log
          retention-days: 30
          if-no-files-found: warn
