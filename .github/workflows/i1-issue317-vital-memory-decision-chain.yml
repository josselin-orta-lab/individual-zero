name: I1 issue317 sealed vital memory decision chain
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'tools/audit_i1_317_vital_memory_decision_chain.py'
      - 'tests/i1/test_i1_317_vital_memory_decision_chain.py'
      - '.github/workflows/i1-issue317-vital-memory-decision-chain.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail closed on synthetic invalid physical evidence
        run: python -m unittest discover -s tests/i1 -p test_i1_317_vital_memory_decision_chain.py -v
      - name: Retrieve exact eight original independent mortal WAL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sealed result
          for world in oasis foraging dry-valley memory-corridor; do
            for seed in 11117 11239; do
              gh run download 39302574668 --repo "$GITHUB_REPOSITORY" --name "i1-317-wake-factorial-$world-$seed" --dir sealed
              test -f "sealed/$world/$seed/report.json"
              test -f "sealed/$world/$seed/canonical/life-01.wal"
            done
          done
      - name: Independently trace perceived need to options to real world command
        run: |
          python tools/audit_i1_317_vital_memory_decision_chain.py --root sealed --output result/vital-memory-chain.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('result/vital-memory-chain.json').read_text())
          assert d['certified_unique_original_wal_lives']==8
          assert d['scientific_verdict']=='NO-GO'
          assert d['motor_route_utility_automatically_inferred'] is False
          assert d['aggregate'].get('water_critical_water_memory_physically_applied_steps', 0) <= d['aggregate'].get('water_critical_water_memory_crossed_steps', 0)
          print('INDEPENDENT_EIGHT_LIFE_VITAL_MEMORY_CHAIN_CERTIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-317-sealed-vital-memory-decision-chain
          path: result/
          retention-days: 30
          if-no-files-found: warn
