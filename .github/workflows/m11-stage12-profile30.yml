name: M11 Stage12 profile30 current generation

on:
  pull_request:
    branches: [exp/stage10-priced-multipass-sleep-20261013]
    paths:
      - 'scripts/profile_m11_stage12_30.py'
      - '.github/workflows/m11-stage12-profile30.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile30:
    name: M11 Stage12 real step profiler (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Run prospectively priced H30 cProfile SQLite life
        run: python scripts/profile_m11_stage12_30.py --output-dir /tmp/m11-stage12-profile30
      - name: Preserve profiles and exact SHA results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m11-stage12-profile30-python-${{ matrix.python-version }}
          path: /tmp/m11-stage12-profile30/
          retention-days: 30
          if-no-files-found: warn
