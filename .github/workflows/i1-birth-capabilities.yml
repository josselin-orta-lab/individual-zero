name: I1 effective natural birth capabilities
on:
  push:
    branches: [audit/i1-natural-birth-capabilities-20261018]
  pull_request:
    paths:
      - 'tools/audit_i1_birth_capabilities.py'
      - 'tests/i1/test_i1_birth_capabilities.py'
      - '.github/workflows/i1-birth-capabilities.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  birth:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests/i1 -p test_i1_birth_capabilities.py -v
      - run: python scripts/check_engine_repository.py --json
      - run: python tools/audit_i1_birth_capabilities.py --preset oasis --output reports/birth-oasis.json
      - run: python tools/audit_i1_birth_capabilities.py --preset foraging --output reports/birth-foraging.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-effective-birth-audit
          path: reports/
          if-no-files-found: error
