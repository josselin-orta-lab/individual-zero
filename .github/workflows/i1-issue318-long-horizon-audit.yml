name: 'I1 #318 24 original long-horizon ecological Q WAL audit'
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'tools/audit_i1_318_long_horizon_evidence.py'
      - '.github/workflows/i1-issue318-long-horizon-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m py_compile tools/audit_i1_318_long_horizon_evidence.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 39429962526
          github-token: ${{ github.token }}
          pattern: i1-318-longholdout-*
          path: original
          merge-multiple: true
      - name: Authenticate 24 mortal WAL, including real death outcomes
        run: |
          python tools/audit_i1_318_long_horizon_evidence.py --root original --output original-24-ecology-certificate.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("original-24-ecology-certificate.json").read_text())
          assert a["verified_WAL_count"]==24
          assert a["status"]=="ORIGINAL_24_WAL_AUTHENTICATED"
          assert a["scientific_verdict"]=="INCONCLUSIVE"
          print("I1_318_24_ECOLOGY_WAL_CERTIFIED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-318-24-longhorizon-original-WAL-certificate
          path: original-24-ecology-certificate.json
          retention-days: 30
          if-no-files-found: warn
