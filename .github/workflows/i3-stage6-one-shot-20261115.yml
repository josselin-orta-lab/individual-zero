# One and only owner-authorized Stage6-light source-exact prospective campaign.
# Triggered once by MERGING THIS FILE into main. Never on PR or reruns.
# The 2 complete technical rehearsals must PASS before science can allocate.
name: I3 Stage6-light one-shot native GSR, sealed engineering then science
on:
  push:
    branches: [main]
    paths: ['.github/workflows/i3-stage6-one-shot-20261115.yml']

permissions:
  contents: read

concurrency:
  group: i3-stage6-light-one-shot-campaign
  cancel-in-progress: false

jobs:
  protocol:
    if: ${{ github.run_attempt == 1 && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight exact contract without opening a World
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests/i3 -p 'test_stage6_light_native_gsr_transport.py' -v
          python -m unittest discover -s tests/i3 -p 'test_stage6_light_prospective_worlds.py' -v
          python -m unittest discover -s tests/i3 -p 'test_stage6_light_science_admission.py' -v
          python - <<'PY'
          from i3.lab import stage6_light_native_gsr_transport as T
          from i3.runtime.provenance import source_snapshot
          import os, subprocess
          assert T.G0._pins()
          x = source_snapshot()
          assert x["git_head"] == os.environ["GITHUB_SHA"]
          assert x["working_tree_dirty"] is False
          assert x["sha256"]
          assert subprocess.check_output(["git","status","--porcelain","--untracked-files=all"]).strip() == b""
          print("SOURCE_EXACT_PREEXPOSURE_PROTOCOL_PREFLIGHT_PASS", x["sha256"])
          PY

  engineering:
    if: ${{ github.run_attempt == 1 }}
    needs: protocol
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: src
      CUSTODY: /tmp/i3-stage6-full-rehearsal
      PYVERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Allocate source-exact complete 11,520-life engineering plan, no births
        run: |
          mkdir -p "$CUSTODY"
          SOURCE=$(python -c 'from i3.runtime.provenance import source_snapshot; print(source_snapshot()["sha256"])')
          python -m i3.lab.stage6_light_native_gsr_transport allocate "$GITHUB_SHA" "$SOURCE" "$CUSTODY/PLAN.json" "$CUSTODY/originals"
          python -m i3.lab.stage6_light_native_gsr_transport verify "$CUSTODY/PLAN.json"
      - name: Publish full plan bytes, roots and SHA BEFORE first World
        uses: actions/upload-artifact@v4
        with:
          name: stage6-technical-plan-${{ matrix.python-version }}-${{ github.run_id }}
          path: /tmp/i3-stage6-full-rehearsal/PLAN.json
          if-no-files-found: error
          retention-days: 90
      - name: Run ONCE original full nine-phase native engineering G/S/R
        run: |
          PLAN_SHA=$(python -c 'import json,os; print(json.load(open(os.environ["CUSTODY"]+"/PLAN.json"))["allocation_sha256"])')
          python -m i3.lab.stage6_light_native_gsr_transport run-engineering "$CUSTODY/PLAN.json" "$CUSTODY/originals" "$PLAN_SHA" > "$CUSTODY/CORE.json"
      - name: Verify nine-phase seals and publish technical receipt
        run: |
          python -m i3.lab.stage6_light_one_shot_receipts rehearsal "$CUSTODY/PLAN.json" "$CUSTODY/originals" "$CUSTODY/CORE.json" "$CUSTODY/REHEARSAL_RECEIPT.json" "$PYVERSION" "$GITHUB_RUN_ID"
      - name: Upload source-bound rehearsal receipt (independent job artifact)
        uses: actions/upload-artifact@v4
        with:
          name: stage6-technical-receipt-${{ matrix.python-version }}-${{ github.run_id }}
          path: /tmp/i3-stage6-full-rehearsal/REHEARSAL_RECEIPT.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve ALL full original gzip records (or partial failure) without retry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage6-technical-originals-${{ matrix.python-version }}-${{ github.run_id }}
          path: /tmp/i3-stage6-full-rehearsal/originals
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90

  science:
    if: ${{ github.run_attempt == 1 }}
    needs: engineering
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: src
      CUSTODY: /tmp/i3-stage6-prospective-science
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare internal study custody outside exact clean checkout
        run: mkdir -p "$CUSTODY"
      - name: Retrieve sealed Python 3.11 full rehearsal receipt
        uses: actions/download-artifact@v4
        with:
          name: stage6-technical-receipt-3.11-${{ github.run_id }}
          path: /tmp/i3-stage6-prospective-science/receipts/311
      - name: Retrieve sealed Python 3.12 full rehearsal receipt
        uses: actions/download-artifact@v4
        with:
          name: stage6-technical-receipt-3.12-${{ github.run_id }}
          path: /tmp/i3-stage6-prospective-science/receipts/312
      - name: Verify both source-exact full rehearsals, neither is scientific evidence
        run: |
          python -m i3.lab.stage6_light_one_shot_receipts combine "$CUSTODY/receipts/311/REHEARSAL_RECEIPT.json" "$CUSTODY/receipts/312/REHEARSAL_RECEIPT.json" "$CUSTODY/REHEARSALS.json"
          SOURCE=$(python -c 'from i3.runtime.provenance import source_snapshot; print(source_snapshot()["sha256"])')
          python -m i3.lab.stage6_light_native_gsr_transport allocate-science "$GITHUB_SHA" "$SOURCE" "$CUSTODY/SCIENCE_PLAN.json" "$CUSTODY/originals" "$CUSTODY/REHEARSALS.json"
          python -m i3.lab.stage6_light_native_gsr_transport verify-science "$CUSTODY/SCIENCE_PLAN.json"
      - name: Publish prospective 16-population science allocation BEFORE first birth
        uses: actions/upload-artifact@v4
        with:
          name: stage6-science-preexposure-plan-${{ github.run_id }}
          path: |
            /tmp/i3-stage6-prospective-science/SCIENCE_PLAN.json
            /tmp/i3-stage6-prospective-science/REHEARSALS.json
          if-no-files-found: error
          retention-days: 90
      - name: Execute native science G0/SEAL/S1/G1/SEAL/S2/G2/SEAL/R once
        run: |
          PLAN_SHA=$(python -c 'import json,os; print(json.load(open(os.environ["CUSTODY"]+"/SCIENCE_PLAN.json"))["allocation_sha256"])')
          python -m i3.lab.stage6_light_native_gsr_transport run-science "$CUSTODY/SCIENCE_PLAN.json" "$CUSTODY/originals" "$PLAN_SHA" > "$CUSTODY/SCIENCE_CORE.json"
      - name: Recheck 11,520 sealed originals, all 16 contrasts, neutral sentinels
        run: |
          python -m i3.lab.stage6_light_one_shot_receipts science "$CUSTODY/SCIENCE_PLAN.json" "$CUSTODY/originals" "$CUSTODY/SCIENCE_CORE.json" "$CUSTODY/SCIENCE_RESULT.json"
      - name: Publish full scientific report, including null and adverse findings
        uses: actions/upload-artifact@v4
        with:
          name: stage6-science-result-${{ github.run_id }}
          path: |
            /tmp/i3-stage6-prospective-science/SCIENCE_RESULT.json
            /tmp/i3-stage6-prospective-science/originals/R_FINAL_SCIENCE.json
            /tmp/i3-stage6-prospective-science/originals/PHASES.jsonl
          if-no-files-found: error
          retention-days: 90
      - name: Preserve ALL original scientific life histories or failure originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage6-science-originals-${{ github.run_id }}
          path: /tmp/i3-stage6-prospective-science/originals
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
