name: I3 survival B1 statistical campaign and engineering smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/i3/lab/stage2_exact_paired_survival.py'
      - 'tests/i3/test_stage2_exact_paired_survival.py'
      - 'src/i3/docs/studies/stage2-replay-gate-selected-design/ENGINEERING_B1_PLAN.json'
      - '.github/workflows/i3-survival-b1-engineering.yml'

permissions:
  contents: read

concurrency:
  group: i3-survival-b1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synthetic-and-engineering:
    name: I3 B1 engineering only (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: src
      PLAN: src/i3/docs/studies/stage2-replay-gate-selected-design/ENGINEERING_B1_PLAN.json
    steps:
      - name: Checkout the exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify no scientific indices in B1 engineering plan
        run: |
          python - <<'PY'
          import json, os
          with open(os.environ["PLAN"]) as stream:
              p = json.load(stream)
          assert p["protocol_id"] == "I3_SURVIVAL_B1_NON_EVIDENTIARY_ENGINEERING_SMOKE"
          assert p["scientific"]["indices"] == []
          assert p["scientific"]["genome_seeds"] == []
          assert p["engineering"]["cohort"] == "engineering"
          assert p["arms"] == ["reference", "p13_replay_gate_v1"]
          assert len(p["engineering"]["indices"]) == 4
          assert len(p["engineering"]["genome_seeds"]) == 1
          assert p["no_engineering_outcomes_publish"] is True
          PY
      - name: Run pure synthetic exact paired test and power scenarios
        run: |
          python -m unittest discover -s tests/i3 -p 'test_stage2_exact_paired_survival.py' -v
          python -m i3.lab.stage2_exact_paired_survival > "$RUNNER_TEMP/b1-power-synthetic.json"
          python - "$RUNNER_TEMP/b1-power-synthetic.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              x = json.load(stream)
          assert x["conditions"] == "PURE_SYNTHETIC_IID_PAIRED_SURVIVAL_DRAWS"
          assert x["no_actual_survival_data_read"] is True
          assert len(x["simulated_cells"]) == 16
          assert all(c["worlds_opened"] == 0 and c["scientific_lives"] == 0
                     and c["scientific_verdict"] == "NOT_ISSUED"
                     for c in x["simulated_cells"])
          PY
      - name: Run the existing guarded G/R transport on temporary engineering Worlds
        run: |
          python -m i3.lab.stage2_panel rehearse "$PLAN" > "$RUNNER_TEMP/b1-engineering-structure.json"
          python - "$RUNNER_TEMP/b1-engineering-structure.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              r = json.load(stream)
          # Structural only; no survival, deaths, actions, policy choices
          # or other engineering outcomes may be published.
          expected_keys = {
              "schema", "planned", "phase_G", "generated", "generation_failure",
              "phase_R", "reduced", "reduction_failure", "invariant_failures",
              "manifest_sha256", "mean_step_ms", "status", "runner",
              "protocol_id", "transport_fingerprint", "plan_sha256",
              "namespace",
          }
          assert set(r) <= expected_keys, "engineering outcome leaked"
          assert r["status"] == "PASS", "engineering transport did not PASS"
          assert r["planned"] == 24 == r["generated"] == r["reduced"]
          assert r["phase_G"] == "GENERATED" and r["phase_R"] == "COMPLETE"
          assert r["namespace"] == "engineering"
          assert r["generation_failure"] is None
          assert r["reduction_failure"] is None
          assert r["invariant_failures"]
          assert not any(r["invariant_failures"].values())
          print("B1_ENGINEERING_STRUCTURAL_PASS_24_OF_24_NO_SCIENTIFIC_WORLD")
          PY
      - name: Upload structural engineering proof and synthetic power grid
        uses: actions/upload-artifact@v4
        with:
          name: i3-b1-engineering-structural-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/b1-engineering-structure.json
            ${{ runner.temp }}/b1-power-synthetic.json
          if-no-files-found: error
          retention-days: 30
