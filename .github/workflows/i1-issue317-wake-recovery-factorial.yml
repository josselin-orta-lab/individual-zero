name: I1 issue317 recovery-sensitive sleep factorial
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'tools/run_i1_317_wake_recovery_factorial.py'
      - 'tests/i1/test_i1_317_wake_recovery_factorial.py'
      - '.github/workflows/i1-issue317-wake-recovery-factorial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mortal-births:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        preset: [oasis, foraging, dry-valley, memory-corridor]
        seed: [11117, 11239]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install I1
        run: python -m pip install -e .
      - name: Refuse adversarial bad wake traces and unregistered arms
        run: python -m unittest discover -s tests/i1 -p test_i1_317_wake_recovery_factorial.py -v
      - name: Four independent irreversible lives under same physical world
        env:
          PRESET: ${{ matrix.preset }}
          SEED: ${{ matrix.seed }}
        run: |
          python tools/run_i1_317_wake_recovery_factorial.py --preset "$PRESET" --seed "$SEED" --output-dir "results/$PRESET/$SEED"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path('results')/os.environ['PRESET']/os.environ['SEED']/'report.json').read_text())
          assert d['status']=='COMPLETE_PAIRED_PHYSICAL_DIAGNOSTIC'
          assert set(d['arms'])==set(d['preregistered_arms'])
          assert d['only_natural_wake_pressure_and_threshold_intervened'] is True
          assert d['scientific_verdict']=='NO-GO'
          print('FOUR_MORTAL_FACTORIAL_LIVES_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-317-wake-factorial-${{ matrix.preset }}-${{ matrix.seed }}
          path: results/
          retention-days: 30
          if-no-files-found: warn
