name: 'I1 #318 certify 32 original factorial WAL'
on:
  workflow_run:
    workflows: ['I1 #318 four-arm factorial 32 unique mortal births']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  authenticate:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == '0b727273ff748c7919cebb8420dc99a39f2580f6' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m py_compile tools/audit_i1_318_local_q_factorial_cohort.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 39405862547
          github-token: ${{ github.token }}
          pattern: i1-318-factorial-*
          path: original
          merge-multiple: true
      - name: Verify exact new original 32 mortal WAL and 2x2 selectors
        run: |
          python tools/audit_i1_318_local_q_factorial_cohort.py --root original --output local-q-factorial-certificate.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("local-q-factorial-certificate.json").read_text())
          assert j["verified_WAL_count"] == 32
          assert j["status"] == "ORIGINAL_32_WAL_AUTHENTICATED"
          assert j["scientific_verdict"] == "INCONCLUSIVE"
          print("I1_318_FACTORIAL_32_ORIGINAL_WAL_VERIFIED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-318-factorial-32-original-WAL-certificate
          path: local-q-factorial-certificate.json
          retention-days: 30
          if-no-files-found: warn
