name: 'I1 #318 matched temperament Q factorial 32 newborns'
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'tools/run_i1_318_matched_temperament_q_factorial.py'
      - 'tests/i1/test_i1_318_matched_temperament_factorial_cohort.py'
      - '.github/workflows/i1-issue318-matched-twin-q-factorial.yml'
permissions:
  contents: read
jobs:
  birth:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        preset: [memory-corridor, water-isolated-corridor]
        seed: [24103, 24223, 24359, 24481]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests/i1 -p test_i1_318_matched_temperament.py -v
      - run: python -m unittest discover -s tests/i1 -p test_i1_318_matched_temperament_factorial_cohort.py -v
      - name: Birth four independent mortal matched-temperament I1
        env:
          PRESET: ${{ matrix.preset }}
          SEED: ${{ matrix.seed }}
        run: |
          python tools/run_i1_318_matched_temperament_q_factorial.py --preset "$PRESET" --seed "$SEED" --output-dir "results/$PRESET/$SEED"
          python - <<'PY'
          import json, os
          from pathlib import Path
          j=json.loads((Path("results")/os.environ["PRESET"]/os.environ["SEED"]/"report.json").read_text())
          assert j["schema"]=="i1-318-matched-temperament-Q-factorial-mortal/v1"
          assert j["status"]=="COMPLETE_FACTORIAL_PHYSICAL_DIAGNOSTIC"
          assert j["matched_twin_birth_temperament"] is True
          assert j["all_lives_distinct_and_mortal"] is True
          assert len(j["arms"])==4
          assert j["scientific_verdict"]=="NO-GO"
          print("I1_318_MATCHED_TEMPERAMENT_FOUR_MORTAL_BIRTHS_COMPLETE")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i1-318-matched-twin-${{ matrix.preset }}-${{ matrix.seed }}
          path: results/
          retention-days: 30
          if-no-files-found: warn
