name: Stage12 A2.30-K independent archived impact verification
on:
  pull_request:
    branches: [science/stage12-b-a229-choice-arbitration-20261015]
    paths:
      - 'scripts/audit_stage12_issue110_b_a230k_impact.py'
      - 'tests/test_stage12_a230k_impact.py'
      - 'docs/research/stage12-issue110-b-a230k-*.md'
      - '.github/workflows/stage12-b-a230k.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  archived-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Verify offline comparison and refusal of forged model evidence
        run: python -m unittest discover -s tests -p test_stage12_a230k_impact.py -v
      - name: Download original preregistered J archive without re-executing lives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/a230k-source
          gh run download 38720764403 --repo "$GITHUB_REPOSITORY" --name a230j-py3.11 --dir /tmp/a230k-source
      - name: Independently re-audit archived physical and subjective contrasts
        run: |
          python -u scripts/audit_stage12_issue110_b_a230k_impact.py \
            --source-dir /tmp/a230k-source \
            --output-dir /tmp/a230k-output > /tmp/a230k.log 2>&1 \
            || { tail -n 140 /tmp/a230k.log; exit 2; }
          grep A230K_SUMMARY /tmp/a230k.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a230k-py${{ matrix.python-version }}
          path: |
            /tmp/a230k-output
            /tmp/a230k.log
          retention-days: 30
