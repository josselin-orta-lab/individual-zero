name: I1 issue317 native experiential M11 compatibility
on:
  push:
    branches: [fix/i1-memory-competition-317]
    paths:
      - 'src/i1/modules/experienced_place_relevance.py'
      - 'src/i1/runtime/i1_natural_runtime.py'
      - 'src/i1/runtime/m11_transactional_mortal.py'
      - 'tests/i1/test_i1_317_native_experiential_place.py'
      - 'tests/i1/test_i1_317_experiential_native_m11.py'
      - '.github/workflows/i1-issue317-experiential-native-m11.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model
        run: python -m pip install -e .
      - name: Native pure evidence and M11 cold parity regression
        run: |
          python -m unittest discover -s tests/i1 -p test_i1_317_native_experiential_place.py -v
          python -m unittest discover -s tests/i1 -p test_i1_317_experiential_native_m11.py -v
          python -m unittest discover -s tests/i1 -p test_i1_natural_m11_cold_recovery.py -v
