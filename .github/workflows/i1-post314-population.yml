name: I1 post-314 native population
on:
  push:
    branches: [science/i1-post314-natural-population-20261018]
    paths:
      - 'tools/run_i1_post314_population.py'
      - 'tools/analyze_i1_post314_population.py'
      - 'tools/audit_i1_birth_capabilities.py'
      - 'tests/i1/test_i1_post314_population.py'
      - '.github/workflows/i1-post314-population.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-lives:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        candidate: [0, 1, 2, 3, 4, 5]
        world: [oasis, foraging, dry-valley]
        seed: [1041, 1042]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests/i1 -p test_i1_post314_population.py -v
      - name: Corrected I1 independent mortal life
        env:
          CANDIDATE: ${{ matrix.candidate }}
          WORLD: ${{ matrix.world }}
          SEED: ${{ matrix.seed }}
        run: |
          python tools/run_i1_post314_population.py \
            --candidate "$CANDIDATE" --world "$WORLD" --seed "$SEED" \
            --steps 400 --output-dir "reports/candidate-$CANDIDATE/$WORLD/seed-$SEED"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1-post314-${{ matrix.candidate }}-${{ matrix.world }}-${{ matrix.seed }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
  rank:
    needs: paired-lives
    if: ${{ needs.paired-lives.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: i1-post314-*
          path: paired/
      - name: Require all 36 real post-314 lives
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p ranking
          python tools/analyze_i1_post314_population.py \
            --root paired --sha "$SOURCE_SHA" --out ranking/scoreboard.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1-post314-population-scoreboard
          path: ranking/
          retention-days: 30
          if-no-files-found: warn
