name: Agent context navigation (static only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/agent-context-map.json'
      - 'config/research-program.json'
      - 'config/research-dossiers.json'
      - 'config/research-g0-artifacts.json'
      - 'tools/agent_context.py'
      - 'tools/research_coordinator.py'
      - 'tools/research_corpus.py'
      - 'tools/research_dossiers.py'
      - 'tools/research/g0_custody_receipt.py'
      - 'tests/test_agent_context.py'
      - 'tests/test_research_coordinator.py'
      - 'tests/test_research_knowledge.py'
      - 'tests/test_research_corpus.py'
      - 'tests/test_research_dossiers.py'
      - 'tests/test_g0_custody_receipt.py'
      # All current engineering and accepted decision guides share one light check.
      - 'docs/engineering/*.md'
      - 'docs/decisions/*.md'
      # Navigation atlas PRs use this same small check; no heavy engine CI.
      - 'docs/architecture/ATLAS.md'
      - 'docs/architecture/README.md'
      - 'docs/architecture/ENGINE_GENERATIONS.md'
      - 'docs/architecture/proposals/README.md'
      - 'tools/check_repo_navigation.py'
      - 'tests/test_repo_navigation.py'
      - 'tools/repository_layout.py'
      - 'tests/test_repository_layout.py'
      - 'tools/research_location_index.py'
      - 'tests/test_research_location_index.py'
      - 'tools/research_link_audit.py'
      - 'tests/test_research_link_audit.py'
      - 'tools/check_navigation_portals.py'
      - 'tests/test_navigation_portals.py'
      - 'docs/research/studies/README.md'
      - 'docs/research/studies/HISTORICAL_ROOT_FILES.md'
      - 'docs/research/*.md'
      # Frozen research snapshot indexes are navigation, not active I0/I1 sources.
      - 'docs/research/archive/**/README.md'
      - 'docs/research/studies/stage-11/README.md'
      - 'docs/research/studies/stage-12/README.md'
      - 'docs/research/studies/i1/README.md'
      - 'docs/research/studies/m11/README.md'
      - 'docs/research/studies/stage-9/README.md'
      - 'docs/research/studies/stage-10/README.md'
      - 'docs/research/studies/cross-cutting/README.md'
      - 'tests/TEST_LAYOUT.md'
      - 'tests/research/i1-historical/README.md'
      - 'archive/README.md'
      - 'docs/README.md'
      - 'docs/research/README.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'src/i2/docs/STATUS.md'
      - 'src/i2/docs/STATUS_HISTORY.md'
      - 'src/i2/docs/README.md'
      - 'src/i2/AGENTS.md'
      - 'docs/research/audits/RESEARCH_SOURCE_RECONCILIATION_2026-11-01.md'
      - 'docs/research/audits/I1_G0_PROVIDER_ARTIFACT_CUSTODY_2026-11-01.md'
      - '.github/workflows/i2-proposal-safety.yml'
      - '.github/workflows/agent-context-static.yml'

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check metadata and focused routing tests without running an engine
        run: |
          python tools/agent_context.py audit --json
          python tools/research_coordinator.py audit --structure-only > /tmp/iz-research-audit.json
          python -m unittest discover -s tests -p test_research_coordinator.py -v
          python -m unittest discover -s tests -p test_research_knowledge.py -v
          python -m unittest discover -s tests -p test_research_corpus.py -v
          python tools/research_dossiers.py audit --structure-only > /tmp/iz-dossier-audit.json || { cat /tmp/iz-dossier-audit.json; exit 1; }
          python tools/research_dossiers.py g0-provider-inventory > /tmp/iz-g0-provider.json
          python -m unittest discover -s tests -p test_g0_custody_receipt.py -v
          python tools/research/g0_custody_receipt.py plan > /tmp/iz-g0-export-plan.json
          python tools/research/g0_custody_receipt.py plan --shell > /tmp/iz-g0-export-plan.sh
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('/tmp/iz-g0-export-plan.json').read_text())
          assert plan['status'] == 'PROVIDER_METADATA_PLAN_ONLY'
          assert plan['scientific_verdict'] == 'NOT_EVALUATED'
          assert not plan['external_durable_custody_attested']
          assert sum(len(v['artifacts']) for v in plan['campaigns'].values()) == 58
          assert Path('/tmp/iz-g0-export-plan.sh').read_text().count('gh api --method GET') == 58
          print('G0_OFFLINE_EXPORT_PLAN_NO_NETWORK_PASS')
          PY
          python -m unittest discover -s tests -p test_research_dossiers.py -v
          python tools/research_dossiers.py show --id I1-A1C-TARGETED > /tmp/iz-a1c-dossier.json || test "$?" -eq 2
          python tools/research_dossiers.py gaps > /tmp/iz-dossier-gaps.json || test "$?" -eq 2
          python tools/research_dossiers.py compare --left I1-A1C-TARGETED --right I1-A2R-REWARD > /tmp/iz-dossier-compare.json || test "$?" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          dossier = json.loads(Path('/tmp/iz-a1c-dossier.json').read_text())
          audit = json.loads(Path('/tmp/iz-dossier-audit.json').read_text())
          gaps = json.loads(Path('/tmp/iz-dossier-gaps.json').read_text())
          comparison = json.loads(Path('/tmp/iz-dossier-compare.json').read_text())
          program = json.loads(Path('config/research-program.json').read_text())
          manifest = json.loads(Path('config/research-dossiers.json').read_text())
          research_audit = json.loads(Path('/tmp/iz-research-audit.json').read_text())
          psources = {entry['id']: entry for entry in program['source_checks']}
          dsources = {entry['id']: entry for entry in manifest['sources']}
          assert research_audit['status'] == 'PASS'
          assert research_audit['audit_mode'] == 'STRUCTURE_ONLY'
          assert all(item['status'] == 'PIN_MATCH' or
                     (item['status'] == 'SOURCE_BLOB_DRIFT'
                      and psources[sid]['authority'] == 'status')
                     for sid, item in research_audit['source_integrity'].items())
          provider = json.loads(Path('/tmp/iz-g0-provider.json').read_text())
          assert provider['status'] == 'PASS'
          assert provider['provider_records'] == 58
          assert provider['scheduled_earliest_expiry'].startswith('2026-11-28')
          assert provider['custody_status'] == 'NOT_ATTESTED'
          assert provider['scientific_verdict'] == 'NOT_EVALUATED'
          assert audit['status'] == 'PASS'
          assert audit['audit_mode'] == 'STRUCTURE_ONLY'
          assert all(item['status'] == 'PIN_MATCH' or
                     (item['status'] == 'SOURCE_BLOB_DRIFT'
                      and item['marker_present']
                      and dsources[sid]['authority'] == 'current_status_snapshot')
                     for sid, item in audit['source_integrity'].items())
          assert dossier['reported_assessment'] == 'NO_GO'
          assert dossier['primary_record'] == 'PRIMARY_ORIGINAL_RESULT_NOT_LINKED'
          assert dossier['scientific_verdict'] == 'NOT_EVALUATED'
          assert gaps['scientific_verdict'] == 'NOT_EVALUATED'
          assert comparison['same_explicit_scope'] is False
          print('CURATED_DOSSIERS_SOURCE_PINS_AND_LIMITS_PASS')
          PY
          python tools/research_corpus.py index --output /tmp/iz-research-corpus.json
          python tools/research_corpus.py delta --baseline /tmp/iz-research-corpus.json > /tmp/iz-research-delta.json
          python tools/research_corpus.py review --topic study:A1-C --limit 3 > /tmp/iz-research-review.json
          python - <<'PY'
          import json
          from pathlib import Path
          inventory = json.loads(Path('/tmp/iz-research-corpus.json').read_text())
          delta = json.loads(Path('/tmp/iz-research-delta.json').read_text())
          lead = json.loads(Path('/tmp/iz-research-review.json').read_text())
          assert inventory['summary']['documents'] >= 100
          assert inventory['scientific_verdict'] == 'NOT_EVALUATED'
          assert delta['status'] == 'NO_FILE_CHANGES'
          assert lead['scientific_verdict'] == 'NOT_EVALUATED'
          print('CORPUS_NAVIGATION_NO_SCIENTIFIC_PROMOTION_PASS')
          PY
          python tools/research_coordinator.py status --format json > /tmp/research-state.json || test "$?" -eq 2
          python tools/research_coordinator.py graph --mode knowledge --format json > /tmp/research-graph.json
          python tools/research_coordinator.py trace --id question:I1-L3 > /tmp/research-trace.json || test "$?" -eq 2
          python tools/research_coordinator.py catalog --limit 3 > /tmp/research-catalog.json
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("/tmp/research-state.json").read_text())
          graph = json.loads(Path("/tmp/research-graph.json").read_text())
          trace = json.loads(Path("/tmp/research-trace.json").read_text())
          catalog = json.loads(Path("/tmp/research-catalog.json").read_text())
          assert state["status"] in ("RECORDED_TEXT_MATCHES", "SOURCE_REVIEW_REQUIRED"), state["status"]
          assert state["scientific_verdict"] == "NOT_EVALUATED"
          assert graph["status"] == "CURATED_PROVENANCE_ONLY"
          assert trace["status"] in ("PROVENANCE_LINKS_ONLY", "SOURCE_REVIEW_REQUIRED")
          assert catalog["scientific_verdict"] == "NOT_EVALUATED"
          print("SOURCE_PINNED_RESEARCH_NAVIGATION_PASS")
          PY
          python -m unittest discover -s tests -p test_agent_context.py -v
          python scripts/check_engine_repository.py --json
          python -m unittest discover -s tests -p test_repo_navigation.py -v
          python tools/check_repo_navigation.py --scope entrypoints
          python tools/check_repo_navigation.py --scope current
          python tools/repository_layout.py audit --json > /tmp/iz-repository-layout.json
          python tools/repository_layout.py check
          python -m unittest discover -s tests -p test_repository_layout.py -v
          python -m unittest discover -s tests -p test_research_location_index.py -v
          python -m unittest discover -s tests -p test_research_link_audit.py -v
          python -m unittest discover -s tests -p test_navigation_portals.py -v
          python tools/check_navigation_portals.py --json > /tmp/iz-current-portals.json
          python tools/research_link_audit.py --limit 10 --json > /tmp/iz-research-links.json
          python tools/research_location_index.py --family stage-12 --limit 3 --json > /tmp/iz-stage12-location.json
