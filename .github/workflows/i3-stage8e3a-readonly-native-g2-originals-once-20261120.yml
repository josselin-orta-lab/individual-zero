# ONE-SHOT read-only analysis of the CLOSED Stage8-E2 G2 ORIGINAL gzip.
# No World, no run_life, no genotype edits, no scientific admission or rerun.
name: I3 Stage8-E3A read-only original G2 motor and cognitive cost decomposition
on:
  push:
    branches: [main]
    paths: ['.github/workflows/i3-stage8e3a-readonly-native-g2-originals-once-20261120.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: stage8e3a-original-g2-readonly-once-20261120
  cancel-in-progress: false

jobs:
  source_and_falsifier_preflight:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact one-shot audit source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.11 descriptive analysis only
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact first-added workflow and pinned closed science
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, subprocess
          from tools import stage8e3a_readonly_motor_cost_audit as R
          path=".github/workflows/i3-stage8e3a-readonly-native-g2-originals-once-20261120.yml"
          sha=os.environ["GITHUB_SHA"]
          hist=subprocess.check_output(["git","log","--format=%H","--",path],text=True).splitlines()
          assert hist == [sha], "new exact one-shot source only, no reuse"
          changed=subprocess.check_output(
              ["git","diff-tree","--no-commit-id","--name-status","-r",sha,
               "--",path], text=True).strip().split()
          assert changed == ["A",path], "workflow must be first added at this HEAD"
          assert not subprocess.check_output(
              ["git","status","--porcelain","--untracked-files=all"]).strip()
          assert R.RUN_ID == 44637950471
          assert R.ENGINE_HEAD == "03faff4b9c194a5288b92e394f6a75cbe62cd095"
          assert R.ORIGINALS == 36864
          assert len(R.ARMS) == 4
          assert R.SCIENCE_RESULT_SHA == "18ad42a1e68a0a7c1c2390bd397ee90e7872bdf398f0f5bac37d06bbfff8af45"
          print("STAGE8E3A_FIRST_ONLY_READONLY_SOURCE_PINS_PASS_ZERO_WORLD")
          PY
          python -m unittest discover -s tests/i3 -p 'test_stage8e3a_*.py' -v
          python -m unittest discover -s tests -p 'test_engine_repository.py' -v
          python scripts/check_engine_repository.py --json

  read_all_originals:
    if: ${{ github.run_attempt == 1 }}
    needs: source_and_falsifier_preflight
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      COLD: /tmp/i3-stage8e3a-cold-readonly
      RUN_ID: 44637950471
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download ORIGINAL 36,864 native G2 gzip archive, full unsampled
        uses: actions/download-artifact@v4
        with:
          name: stage8e2-science-G2-original-gzip-44637950471
          repository: josselin-orta-lab/individual-zero
          run-id: 44637950471
          github-token: ${{ github.token }}
          path: /tmp/i3-stage8e3a-cold-readonly/G2
      - name: Download original G2 manifest and parentage metadata
        uses: actions/download-artifact@v4
        with:
          name: stage8e2-science-native-metadata-44637950471
          repository: josselin-orta-lab/individual-zero
          run-id: 44637950471
          github-token: ${{ github.token }}
          path: /tmp/i3-stage8e3a-cold-readonly/metadata
      - name: Download negative original frozen science and cold original audit
        uses: actions/download-artifact@v4
        with:
          name: stage8e2-science-original-cold-audit-and-primary-44637950471
          repository: josselin-orta-lab/individual-zero
          run-id: 44637950471
          github-token: ${{ github.token }}
          path: /tmp/i3-stage8e3a-cold-readonly/science
      - name: Download independent 64-population scientific primary audit
        uses: actions/download-artifact@v4
        with:
          name: stage8e2-science-independent-confirmatory-gate-44637950471
          repository: josselin-orta-lab/individual-zero
          run-id: 44637950471
          github-token: ${{ github.token }}
          path: /tmp/i3-stage8e3a-cold-readonly/independent
      - name: Rehash each gzip & decoded JSON and both original first-person chains
        shell: bash
        run: |
          set -euo pipefail
          test -s "$COLD/G2/G2.tar"
          test -s "$COLD/metadata/METADATA.tar"
          test -s "$COLD/science/SCIENCE_FINAL.json"
          test -s "$COLD/science/COLD_AUDIT.json"
          test -s "$COLD/independent/INDEPENDENT_STATISTICS.json"
          python tools/stage8e3a_readonly_motor_cost_audit.py \
            --metadata-tar "$COLD/metadata/METADATA.tar" \
            --g2-tar "$COLD/G2/G2.tar" \
            --science-final "$COLD/science/SCIENCE_FINAL.json" \
            --cold-audit "$COLD/science/COLD_AUDIT.json" \
            --independent-statistics "$COLD/independent/INDEPENDENT_STATISTICS.json" \
            --output "$COLD/STAGE8E3A_FULL.json" \
            > "$COLD/INSPECTION_RECEIPT.json"
          python - <<'PY'
          from pathlib import Path
          import json, os
          root=Path(os.environ["COLD"])
          a=json.loads((root/"STAGE8E3A_FULL.json").read_bytes())
          assert a["original_g2_gzip_full_compressed_and_raw_sha256_rechecked"] == 36864
          assert a["original_step_traces_and_paid_evidence_chains_recomputed"] == 36864
          assert a["original_frozen_primary"] == "STAGE8E2_CAUSAL_GAMMA_BLOCK_NOT_DEMONSTRATED_F0"
          assert a["native_lives_generated"] == 0 and a["scientific_new_cohort"] is False
          assert len(a["population_rows"]) == 64
          print("STAGE8E3A_ALL_36864_ORIGINAL_TRACES_REAUDITED_POSTHOC_NO_SCIENCE")
          PY
      - name: Upload all 64 population and four-arm telemetry, NO originals duplicated
        uses: actions/upload-artifact@v4
        with:
          name: stage8e3a-36864-original-g2-readonly-telemetry-${{ github.run_id }}
          path: |
            /tmp/i3-stage8e3a-cold-readonly/STAGE8E3A_FULL.json
            /tmp/i3-stage8e3a-cold-readonly/INSPECTION_RECEIPT.json
          if-no-files-found: error
          retention-days: 90

  independent_population_reduction:
    if: ${{ github.run_attempt == 1 }}
    needs: read_all_originals
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OUT: /tmp/i3-stage8e3a-second-reduction
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: stage8e3a-36864-original-g2-readonly-telemetry-${{ github.run_id }}
          path: /tmp/i3-stage8e3a-second-reduction
      - name: Recompute 64-population motor/cost contrasts without opening originals
        shell: bash
        run: |
          set -euo pipefail
          python tools/stage8e3a_independent_reduction.py \
            "$OUT/STAGE8E3A_FULL.json" "$OUT/SECOND_REDUCTION.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          root=Path(os.environ["OUT"])
          s=json.loads((root/"SECOND_REDUCTION.json").read_bytes())
          assert s["population_unit_count"] == 64
          assert s["original_negative_primary_unchanged"] == "STAGE8E2_CAUSAL_GAMMA_BLOCK_NOT_DEMONSTRATED_F0"
          assert s["native_lives_generated"] == 0
          assert s["posthoc_only_no_causal_mediation"] is True
          print("STAGE8E3A_READONLY_SECOND_REDUCTION_PASS_NO_NEW_LIVES")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage8e3a-independent-motor-and-cost-population-report-${{ github.run_id }}
          path: /tmp/i3-stage8e3a-second-reduction/SECOND_REDUCTION.json
          if-no-files-found: error
          retention-days: 90
