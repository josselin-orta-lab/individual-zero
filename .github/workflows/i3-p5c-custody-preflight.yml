name: I3 P5c first original scientific custody preflight SYNTHETIC only
on:
  push:
    branches: [automation/i3-p5c-custody-preflight-20261106]
    paths: [.github/workflows/i3-p5c-custody-preflight.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout exact separate scientific custodian
        uses: actions/checkout@v4
        with:
          ref: 2c854417c333156a65f0345c18225169ddb39b52
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test all I3 controls including adversarial synthetic custody
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/i3 -p 'test_*.py' -q
          python scripts/check_engine_repository.py --json
      - name: Verify earlier original evidence unchanged and no P5c world exposure
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m i3.lab.p5c_heldout --preflight
          python - <<'PY'
          import gzip,hashlib
          from pathlib import Path
          root=Path("src/i3/docs/studies")
          checks={
           "p4a-g2-heldout/validation-full.json.gz":"44adb1192d1aea87cf5d96a547f794de6f7fe33a566a5de90747a34429e8e8d6",
           "p4b-paid-outcome-learning/learning-full.json.gz":"688463e4fbb71cb88d57d0cafbe70eb033adeafe8ae8551d42bec58dfa9e395c",
           "p5a-paid-component-screen/mechanisms-full.json.gz":"21719dcc89f83f3984ccc32b3d203d2152ff8c7dd8c2c8a76318ce84d60113d8",
           "p5b-paid-readout-heldout/readout-full.json.gz":"98d21bc18d88f26743ae9ca07cc0d966605d14de826b73a91b9d24b675c9a8df",
          }
          for name,expected in checks.items():
              assert hashlib.sha256(gzip.decompress((root/name).read_bytes())).hexdigest()==expected
          PY
