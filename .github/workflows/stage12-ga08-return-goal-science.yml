name: GA08 preregistered autonomous return-to-resource goal contrast
on:
  pull_request:
    branches:
      - research/stage12-issue110-attribution-provenance-20261013
    paths:
      - '.github/workflows/stage12-ga08-return-goal-science.yml'
      - 'scripts/run_stage12_issue110_ga08_return_goal_science.py'
      - 'src/i0/modules/stage12_spatial_goal_evidence.py'
      - 'src/i0/modules/stage12_goal_progress.py'
      - 'src/i0/modules/stage12_goal_agency.py'
      - 'src/lab/stage12_runtime.py'
      - 'src/lab/stage12_spatial_provenance_audit.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage12-ga08-return-goal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  physical-return-goal:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert frozen source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Check canonical owners and spatial audit regressions
        run: |
          python -m unittest discover -s tests -p 'test_stage12_ga08_owner_runtime.py' -q
          python -m unittest discover -s tests -p 'test_stage12_goal_agency.py' -q
      - name: Four autonomous return-to-known-resource lives
        run: |
          mkdir -p /tmp/stage12-ga08-return
          python scripts/run_stage12_issue110_ga08_return_goal_science.py \
            --output-dir /tmp/stage12-ga08-return/experiment
      - name: Publish positive or negative evidence
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/stage12-ga08-return/experiment/summary.json')
          print('issue110_ga08_return_summary=' + (p.read_text() if p.exists() else 'unavailable'))
          PY
      - name: Archive WAL canonical traces and rejected lives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage12-ga08-return-goal-py${{ matrix.python-version }}
          path: /tmp/stage12-ga08-return/
          retention-days: 30
          if-no-files-found: warn
