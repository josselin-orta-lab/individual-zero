name: I1 current-model validation
on:
  pull_request:
    branches: [main, chore/archive-i0-historical-ci-20261017, chore/engine-generations-tooling-20261017, refactor/i1-native-sources-phase1-20261017]
    paths:
      - 'src/i1/**'
      - 'src/i1/runtime/**'
      - 'scripts/build_i1_fork.py'
      - 'scripts/test_i1_ci.py'
      - 'scripts/test_i1_artifact_parity.py'
      - 'scripts/check_engine_contracts.py'
      - 'tools/new_engine.py'
      - 'tools/assess_engine_proposal.py'
      - 'docs/engineering/ENGINE_PROMOTION.md'
      - 'docs/engineering/SCRIPT_INVENTORY.md'
      - 'tools/run_engine_checks.py'
      - 'tools/campaign_report.py'
      - 'tools/check_tool_inventory.py'
      - 'tools/scan_script_dependencies.py'
      - 'tools/run_i1_world_preset.py'
      - 'src/i1/lab/world_presets/**'
      - 'config/script-custody.json'
      - 'config/tool-inventory.json'
      - 'scripts/**'
      - 'docs/engines/i1/**'
      - 'tests/i1/**'
      - 'AGENTS.md'
      - 'config/engine-registry.json'
      - 'tests/test_i1_m11_adversarial.py'
      - '.github/workflows/i1-current-ci.yml'
      - '.github/workflows/engine-structural.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Current I1 validation depth
        type: choice
        options: [smoke, full]
        default: smoke
permissions:
  contents: read
concurrency:
  group: i1-current-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  engine-structure:
    name: Shared engine I1 structural gate
    uses: ./.github/workflows/engine-structural.yml
    with:
      engine: I1
  current-i1:
    name: I1 natural SMOKE + FULL (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install baseline
        run: python -m pip install -e .
      - name: Checkout pre-migration M11 reference (exact I1 code, not past science)
        uses: actions/checkout@v4
        with:
          ref: f0038a4021dacd3f9af3980d3115dc31b8ef7527
          path: .i1-migration-reference
          persist-credentials: false
      - name: Exact generated I1 artifact parity
        run: python scripts/test_i1_artifact_parity.py --reference-root .i1-migration-reference
      - name: Engine boundary and archived source integrity
        run: |
          python scripts/check_engine_repository.py --json
          python -m unittest discover -s tests -p test_engine_repository.py -v
      - name: Generation-owned structural test suite
        run: |
          mkdir -p reports
          python tools/run_engine_checks.py --engine I1 --suite structure --execute --json > reports/i1-structure-${{ matrix.python-version }}.json
      - name: Script inventory without historical reactivation
        run: python tools/check_tool_inventory.py
      - name: Static script custody and dependency audit
        run: |
          mkdir -p reports
          python tools/scan_script_dependencies.py --output reports/i1-script-dependencies-${{ matrix.python-version }}.json --markdown-output reports/i1-script-dependencies-${{ matrix.python-version }}.md
      - name: Validate all registered natural-I1 preset worlds
        run: python tools/run_i1_world_preset.py --list
      - name: Static syntax
        run: python -m py_compile scripts/build_i1_fork.py scripts/test_i1_ci.py
      - name: Frozen I0 and versioned Lab source guard
        run: python -m unittest discover -s tests/i1 -p test_i1_source_snapshot.py -v
      - name: Current I1 independent SMOKE/FULL
        run: python scripts/test_i1_ci.py --mode ${{ github.event.inputs.mode || 'smoke' }} --seed 246 --junit reports/i1-${{ matrix.python-version }}.xml
      - name: I1 natural FULL (multiple autonomous mortal lives)
        if: github.event_name == 'pull_request'
        run: python scripts/test_i1_ci.py --mode full --seed 247 --junit reports/i1-full-${{ matrix.python-version }}.xml
      - name: Harness detects controlled failures
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          path = Path("reports/i1-selftest.xml")
          result = subprocess.run([
              sys.executable, "scripts/test_i1_ci.py",
              "--self-test", "--seed", "246", "--junit", str(path)
          ], check=False)
          assert result.returncode != 0, "I1 tester concealed an invalid assertion"
          suite = ET.parse(path).getroot()
          assert int(suite.attrib["failures"]) == 1, suite.attrib
          assert int(suite.attrib["errors"]) == 1, suite.attrib
          PY
      - name: Current I1 authenticated and adversarial M11 (declared suite)
        run: python tools/run_engine_checks.py --engine I1 --suite m11 --execute --json > reports/i1-m11-${{ matrix.python-version }}.json
      - name: Current I1 generated-world separation (declared suite)
        run: python tools/run_engine_checks.py --engine I1 --suite source --execute --json > reports/i1-source-${{ matrix.python-version }}.json
      - name: I0 baseline non-regression (archived fixtures, unchanged bytes)
        run: |
          cp -a archive/i0/lab src/lab
          cp archive/i0/tests/test_stage4_runtime.py tests/
          cp archive/i0/tests/test_stage5_trait_battery.py tests/
          cp archive/i0/tests/test_stage6_planning.py tests/
          for pattern in test_stage4_runtime.py test_stage5_trait_battery.py test_stage6_planning.py; do
            python -m unittest discover -s tests -p "$pattern" -q
          done
          rm -rf src/lab
      - name: Engine campaign report with explicit evidence gaps
        if: always()
        run: |
          python tools/campaign_report.py --engine I1 --python-version ${{ matrix.python-version }} --output reports/i1-campaign-${{ matrix.python-version }}.json --markdown-output reports/i1-campaign-${{ matrix.python-version }}.md
      - name: JUnit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1-current-junit-${{ matrix.python-version }}
          path: |
            reports/*.xml
            reports/*.json
            reports/*.md
          if-no-files-found: warn
