name: I1 A2.38 prospective external training seal
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_i1_a238_training_lock.py'
      - '.github/workflows/i1-a238-training-seal.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: i1-a238-training-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Seal prebirth physical laboratory
        run: python scripts/run_i1_a238_training_lock.py --output a238-training-seal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a238-training-seal-py${{ matrix.python-version }}
          path: a238-training-seal/
          if-no-files-found: warn
          retention-days: 90
