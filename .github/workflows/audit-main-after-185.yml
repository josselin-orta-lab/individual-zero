name: Post-185 exact main scientific verification
on:
  push:
    branches: ['audit/main-after-185-20261015']
permissions:
  contents: read
jobs:
  a228-main:
    name: A2.28-main (Python ${{ matrix.py }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        py: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '6f8d574a6a2d13356ff29b56139fc8a05eca82fa'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py }}
      - run: python -m pip install -e .
      - name: Canonical A2.28 run on actual main
        run: |
          python -u scripts/run_stage12_issue110_b_a228_funnel.py --output-dir /tmp/a228-main > /tmp/a228-main.log 2>&1 || { tail -n 100 /tmp/a228-main.log; exit 1; }
          grep A228_SUMMARY /tmp/a228-main.log
      - name: Stage12 and M11 contracts
        run: |
          python -m unittest discover -s tests -p 'test_stage12_dual_scope*.py' -v
          python -m unittest discover -s tests -p 'test_stage9_concurrent_cause_audit.py' -v
