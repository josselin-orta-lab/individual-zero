name: Stage12 A2.30-ZI independent sealed archive and Stage6 roots
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit_stage12_issue110_b_a230zi_independent.py'
      - 'tests/test_stage12_a230zi_independent_audit.py'
      - 'docs/research/stage12-issue110-b-a230zi-*.md'
      - '.github/workflows/stage12-b-a230zi.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-retrospective:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Download BOTH original Z Python physical archive versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/a230zi-311 /tmp/a230zi-312
          gh run download 38760713470 --repo "$GITHUB_REPOSITORY" --name a230z-py3.11 --dir /tmp/a230zi-311
          gh run download 38760713470 --repo "$GITHUB_REPOSITORY" --name a230z-py3.12 --dir /tmp/a230zi-312
      - name: Adversarial future, aliasing, own history, postmortem and policy falsification tests
        env:
          A230ZI_SOURCE_311: /tmp/a230zi-311
          A230ZI_SOURCE_312: /tmp/a230zi-312
        run: python -m unittest discover -s tests -p test_stage12_a230zi_independent_audit.py -v
      - name: Independently rescore sealed 168-world/244-step physics and Stage6 first-edge roots
        run: |
          python -u scripts/audit_stage12_issue110_b_a230zi_independent.py \
            --source-311 /tmp/a230zi-311 \
            --source-312 /tmp/a230zi-312 \
            --output-dir /tmp/a230zi-cert > /tmp/a230zi.log 2>&1 \
            || { tail -n 170 /tmp/a230zi.log; exit 2; }
          grep A230ZI_SUMMARY /tmp/a230zi.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a230zi-py${{ matrix.python-version }}
          path: |
            /tmp/a230zi-cert
            /tmp/a230zi.log
          retention-days: 30
