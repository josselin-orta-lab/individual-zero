name: I1 v4 TD credit diagnosis (observer-only)
on:
  pull_request:
    paths:
      - 'tools/research/i1_a1c_td_bias.py'
      - 'tools/research/tests/test_i1_a1c_td_bias.py'
      - '.github/workflows/i1-a1c-credit-observer.yml'
      - 'docs/research/audits/I1_ECO_A1C_TEMPORAL_CREDIT_DIAGNOSTIC_2026-10-29.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read_only:
    name: TD bias-only contracts Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Execute targeted post hoc contracts, no births
        run: |
          python -m py_compile tools/research/i1_a1c_td_bias.py
          python -m unittest discover -s tools/research/tests -p test_i1_a1c_td_bias.py -v
