name: A2-R cold geographic visit audit
on:
  pull_request:
    paths:
      - 'tools/research/i1_a2r_geographic_history_cold.py'
      - 'tests/research/a2r/test_i1_a2r_geographic_history_cold.py'
      - '.github/workflows/i1-a2r-geographic-history.yml'
permissions:
  contents: read
jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=tools/research python -m unittest discover -s tests/research/a2r -p test_i1_a2r_geographic_history_cold.py -v
