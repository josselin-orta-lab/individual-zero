name: I1 A2.31 paired prospective science

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_i1_a231_pairs.py'
      - 'docs/research/i1-a231-prereg-2026-10-16.en.md'
      - '.github/workflows/i1-a231-science.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i1-a231-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preregistered-pairs:
    name: A2.31 mortal paired lives (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Execute newly preregistered physically distinct mortal lives
        run: |
          python scripts/run_i1_a231_pairs.py --output "a231-py${{ matrix.python-version }}" --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Archive external evaluator data and independent per-life summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a231-physical-pairs-py${{ matrix.python-version }}
          path: a231-py${{ matrix.python-version }}/
          retention-days: 90
          if-no-files-found: warn
