name: Stage12 A2.29 B choice arbitration
on:
  pull_request:
    branches: [feature/stage12-b-dual-scope-judgement-20261015]
    paths:
      - 'scripts/run_stage12_issue110_b_a229_arbitration.py'
      - 'docs/research/stage12-issue110-b-a229-*.md'
      - '.github/workflows/stage12-b-a229.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arbitration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Audit 384 genuinely chosen actions and options
        run: |
          python -u scripts/run_stage12_issue110_b_a229_arbitration.py \
            --output-dir /tmp/a229 > /tmp/a229.log 2>&1 \
            || { tail -n 130 /tmp/a229.log; exit 2; }
          grep 'A229_SUMMARY' /tmp/a229.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a229-py${{ matrix.python-version }}
          path: |
            /tmp/a229
            /tmp/a229.log
          retention-days: 30
