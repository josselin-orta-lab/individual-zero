name: I1 S1 natural six-world scientific pilot
on:
  push:
    branches: [science/i1-observational-pilot-20261018]
    paths:
      - 'docs/research/i1-s1-natural-scientific-pilot-prereg-2026-10-18.fr.md'
      - 'tools/analyze_i1_s1_pilot.py'
      - '.github/workflows/i1-s1-scientific-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: i1-science-s1-pilot
  cancel-in-progress: false
jobs:
  descriptive-pilot:
    name: Frozen natural I1 six-world WAL pilot
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout only external scientific observer
        uses: actions/checkout@v4
        with:
          path: observer
          persist-credentials: false
      - name: Checkout immutable canonical I1 scientific subject
        uses: actions/checkout@v4
        with:
          ref: f87cbc15a34f9b0f2a43749bb2b3377a45401b84
          path: frozen
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify canonical frozen subject
        run: |
          test "$(git -C frozen rev-parse HEAD)" = f87cbc15a34f9b0f2a43749bb2b3377a45401b84
          git -C frozen diff --exit-code
          python frozen/tools/run_i1_world_preset.py --list
          python -m pip install -e ./frozen
      - name: Run preregistered independent mortal pilot (no scripted actions)
        shell: bash
        run: |
          set -euo pipefail
          for preset in oasis foraging dry-valley empty-land hazard-edge blocked-route; do
            python frozen/tools/run_i1_world_preset.py \
              --preset "$preset" --seed 246 --steps 60 --lives 3 \
              --custody wal --output-dir "$PWD/reports/s1/$preset"
          done
      - name: External read-only reporting from committed WAL and reports
        if: success()
        run: |
          python observer/tools/analyze_i1_s1_pilot.py \
            --root reports/s1 --output reports/s1-pilot-summary.json
      - name: Archive measured and failed-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1-s1-science-pilot-${{ github.run_id }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
