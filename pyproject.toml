[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "individual-zero"
version = "0.0.1"
description = "Bootstrap runtime for the Individual Zero open research project."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Josselin Orta"}
]
dependencies = []

[project.scripts]
individual-zero = "i1.lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["i0*", "i1*", "adapters*"]
