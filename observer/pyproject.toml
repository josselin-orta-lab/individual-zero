[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "individual-zero-observer"
version = "0.1.0"
description = "Independent local operator console for Individual Zero"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "pydantic>=2.6,<3", "uvicorn>=0.29,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
individual-zero-observer = "observer_app.app:serve"

[tool.setuptools]
include-package-data = true
packages = ["observer_app"]

[tool.setuptools.package-data]
observer_app = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
